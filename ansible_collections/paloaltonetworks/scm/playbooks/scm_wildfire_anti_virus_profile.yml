---
# Example playbook for paloaltonetworks.scm.scm_wildfire_anti_virus_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_wildfire_anti_virus_profile.yml
#

- name: Manage wildfire_anti_virus_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create wildfire_anti_virus_profile
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: present
        name: "ansible-test-wfav"
        folder: "Prisma Access"
        description: "Created by Ansible"
      register: create_result

    - name: Show created wildfire_anti_virus_profile
      ansible.builtin.debug:
        var: create_result.wildfire_anti_virus_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update wildfire_anti_virus_profile
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: present
        name: "ansible-test-wfav"
        folder: "Prisma Access"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated wildfire_anti_virus_profile
      ansible.builtin.debug:
        var: update_result.wildfire_anti_virus_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get wildfire_anti_virus_profile by name
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: gathered
        name: "ansible-test-wfav"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered wildfire_anti_virus_profile
      ansible.builtin.debug:
        var: gathered_result.wildfire_anti_virus_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get wildfire_anti_virus_profile by name (info module)
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile_info:
        name: "ansible-test-wfav"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.wildfire_anti_virus_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get wildfire_anti_virus_profile by ID (info module)
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile_info:
        id: "{{ gathered_result.wildfire_anti_virus_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.wildfire_anti_virus_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all wildfire_anti_virus_profiles
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show wildfire_anti_virus_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} wildfire_anti_virus_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete wildfire_anti_virus_profile
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: absent
        name: "ansible-test-wfav"
        folder: "Prisma Access"
