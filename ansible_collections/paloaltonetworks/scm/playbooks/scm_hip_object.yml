---
# Example playbook for paloaltonetworks.scm.scm_hip_object
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_hip_object.yml
#

- name: Manage hip_objects in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create hip_object
      paloaltonetworks.scm.scm_hip_object:
        state: present
        name: "ansible-test-hip"
        folder: "Shared"
        description: "Created by Ansible"
        host_info:
          criteria:
            os:
              contains:
                apple: "macOS"
      register: create_result

    - name: Show created hip_object
      ansible.builtin.debug:
        var: create_result.hip_object

    # ── Update ──────────────────────────────────────────────
    - name: Update hip_object
      paloaltonetworks.scm.scm_hip_object:
        state: present
        name: "ansible-test-hip"
        folder: "Shared"
        description: "Updated by Ansible"
        host_info:
          criteria:
            os:
              contains:
                microsoft: "Microsoft Windows 10"
        disk_encryption:
          criteria:
            is_installed: true
      register: update_result

    - name: Show updated hip_object
      ansible.builtin.debug:
        var: update_result.hip_object

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get hip_object by name
      paloaltonetworks.scm.scm_hip_object:
        state: gathered
        name: "ansible-test-hip"
        folder: "Shared"
      register: gathered_result

    - name: Show gathered hip_object
      ansible.builtin.debug:
        var: gathered_result.hip_object

    # ── Get by name (info module) ───────────────────────────
    - name: Get hip_object by name (info module)
      paloaltonetworks.scm.scm_hip_object_info:
        name: "ansible-test-hip"
        folder: "Shared"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.hip_objects

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get hip_object by ID (info module)
      paloaltonetworks.scm.scm_hip_object_info:
        id: "{{ gathered_result.hip_object.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.hip_objects

    # ── List all ────────────────────────────────────────────
    - name: List all hip_objects
      paloaltonetworks.scm.scm_hip_object_info:
        folder: "Shared"
      register: list_result

    - name: Show hip_objects count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} hip_objects"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete hip_object
      paloaltonetworks.scm.scm_hip_object:
        state: absent
        name: "ansible-test-hip"
        folder: "Shared"
