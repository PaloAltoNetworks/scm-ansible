---
# Example playbook for paloaltonetworks.scm.scm_qos_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_qos_rule.yml
#

- name: Manage qos_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create qos_rule
      paloaltonetworks.scm.scm_qos_rule:
        state: present
        name: "ansible-test-qos-rule"
        folder: "Service Connections"
        description: "Test QoS rule"
        action:
          var_class: "1"
      register: create_result

    - name: Show created qos_rule
      ansible.builtin.debug:
        var: create_result.qos_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update qos_rule
      paloaltonetworks.scm.scm_qos_rule:
        state: present
        name: "ansible-test-qos-rule"
        folder: "Service Connections"
        description: "Updated QoS rule"
        action:
          var_class: "2"
      register: update_result

    - name: Show updated qos_rule
      ansible.builtin.debug:
        var: update_result.qos_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get qos_rule by name
      paloaltonetworks.scm.scm_qos_rule:
        state: gathered
        name: "ansible-test-qos-rule"
        folder: "Service Connections"
        action:
          var_class: "2"
      register: gathered_result

    - name: Show gathered qos_rule
      ansible.builtin.debug:
        var: gathered_result.qos_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get qos_rule by name (info module)
      paloaltonetworks.scm.scm_qos_rule_info:
        name: "ansible-test-qos-rule"
        folder: "Service Connections"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.qos_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get qos_rule by ID (info module)
      paloaltonetworks.scm.scm_qos_rule_info:
        id: "{{ gathered_result.qos_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.qos_rules

    # ── List all ────────────────────────────────────────────
    - name: List all qos_rules
      paloaltonetworks.scm.scm_qos_rule_info:
        folder: "Service Connections"
      register: list_result

    - name: Show qos_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} qos_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete qos_rule
      paloaltonetworks.scm.scm_qos_rule:
        state: absent
        name: "ansible-test-qos-rule"
        folder: "Service Connections"
        action:
          var_class: "2"
