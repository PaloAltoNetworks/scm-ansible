---
# Example playbook for paloaltonetworks.scm.scm_tls_service_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_tls_service_profile.yml
#

- name: Manage tls_service_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create tls_service_profile
      paloaltonetworks.scm.scm_tls_service_profile:
        state: present
        name: "ansible-test-tls-prof"
        folder: "All"
        certificate: "Forward-Trust-CA"
        protocol_settings:
          min_version: "tls1-1"
          max_version: "tls1-3"
          keyxchg_algo_rsa: true
          keyxchg_algo_ecdhe: true
          enc_algo_aes_128_gcm: true
          enc_algo_aes_256_gcm: true
          auth_algo_sha256: true
      register: create_result

    - name: Show created tls_service_profile
      ansible.builtin.debug:
        var: create_result.tls_service_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update tls_service_profile
      paloaltonetworks.scm.scm_tls_service_profile:
        state: present
        name: "ansible-test-tls-prof"
        folder: "All"
        certificate: "Forward-Trust-CA"
        protocol_settings:
          min_version: "tls1-2"
          max_version: "tls1-3"
          keyxchg_algo_rsa: true
          keyxchg_algo_ecdhe: true
          enc_algo_aes_256_gcm: true
          auth_algo_sha256: true
      register: update_result

    - name: Show updated tls_service_profile
      ansible.builtin.debug:
        var: update_result.tls_service_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get tls_service_profile by name
      paloaltonetworks.scm.scm_tls_service_profile:
        state: gathered
        name: "ansible-test-tls-prof"
        folder: "All"
        certificate: "Forward-Trust-CA"
        protocol_settings:
          min_version: "tls1-2"
          max_version: "tls1-3"
          keyxchg_algo_rsa: true
      register: gathered_result

    - name: Show gathered tls_service_profile
      ansible.builtin.debug:
        var: gathered_result.tls_service_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get tls_service_profile by name (info module)
      paloaltonetworks.scm.scm_tls_service_profile_info:
        name: "ansible-test-tls-prof"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.tls_service_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get tls_service_profile by ID (info module)
      paloaltonetworks.scm.scm_tls_service_profile_info:
        id: "{{ gathered_result.tls_service_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.tls_service_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all tls_service_profiles
      paloaltonetworks.scm.scm_tls_service_profile_info:
        folder: "All"
      register: list_result

    - name: Show tls_service_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} tls_service_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete tls_service_profile
      paloaltonetworks.scm.scm_tls_service_profile:
        state: absent
        name: "ansible-test-tls-prof"
        folder: "All"
        certificate: "Forward-Trust-CA"
        protocol_settings:
          min_version: "tls1-2"
          max_version: "tls1-3"
          keyxchg_algo_rsa: true
