---
# Example playbook for paloaltonetworks.scm.scm_session_setting
#
# Demonstrates: list (singleton), get by ID, update
#
# SINGLETON RESOURCE: session_setting has no create or delete operations.
# One instance exists per folder. Use list to discover the ID, then get/update.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_session_setting.yml

- name: Manage session_setting in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── List (discover singleton ID) ─────────────────────────
    - name: List all session_settings
      paloaltonetworks.scm.scm_session_setting_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show session_settings list
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} session_setting(s)"

    # ── Get by ID ────────────────────────────────────────────
    - name: Get session_setting by ID
      paloaltonetworks.scm.scm_session_setting_info:
        id: "{{ list_result.session_settings[0].id }}"
      register: info_by_id
      when: list_result.session_settings | length > 0

    - name: Show session_setting detail
      ansible.builtin.debug:
        var: info_by_id.session_settings
      when: list_result.session_settings | length > 0

    # ── Update by ID ─────────────────────────────────────────
    # No-op update: re-apply the existing configuration to verify idempotency
    - name: Update session_setting by ID
      paloaltonetworks.scm.scm_session_setting:
        state: present
        id: "{{ list_result.session_settings[0].id }}"
        folder: "Prisma Access"
        # Optionally specify session_settings configuration:
        # session_settings:
        #   icmp_unreachable: true
      register: update_result
      when: list_result.session_settings | length > 0

    - name: Show updated session_setting
      ansible.builtin.debug:
        var: update_result.session_setting
      when: list_result.session_settings | length > 0
