---
# Example playbook for paloaltonetworks.scm.scm_file_blocking_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_file_blocking_profile.yml
#

- name: Manage file_blocking_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create file_blocking_profile
      paloaltonetworks.scm.scm_file_blocking_profile:
        state: present
        name: "ansible-test-fileblk"
        folder: "Prisma Access"
        description: "Created by Ansible"
      register: create_result

    - name: Show created file_blocking_profile
      ansible.builtin.debug:
        var: create_result.file_blocking_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update file_blocking_profile
      paloaltonetworks.scm.scm_file_blocking_profile:
        state: present
        name: "ansible-test-fileblk"
        folder: "Prisma Access"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated file_blocking_profile
      ansible.builtin.debug:
        var: update_result.file_blocking_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get file_blocking_profile by name
      paloaltonetworks.scm.scm_file_blocking_profile:
        state: gathered
        name: "ansible-test-fileblk"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered file_blocking_profile
      ansible.builtin.debug:
        var: gathered_result.file_blocking_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get file_blocking_profile by name (info module)
      paloaltonetworks.scm.scm_file_blocking_profile_info:
        name: "ansible-test-fileblk"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.file_blocking_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get file_blocking_profile by ID (info module)
      paloaltonetworks.scm.scm_file_blocking_profile_info:
        id: "{{ gathered_result.file_blocking_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.file_blocking_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all file_blocking_profiles
      paloaltonetworks.scm.scm_file_blocking_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show file_blocking_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} file_blocking_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete file_blocking_profile
      paloaltonetworks.scm.scm_file_blocking_profile:
        state: absent
        name: "ansible-test-fileblk"
        folder: "Prisma Access"
