---
# Example playbook for paloaltonetworks.scm.scm_label
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_label.yml
#

- name: Manage labels in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create label
      paloaltonetworks.scm.scm_label:
        state: present
        name: "ansible-test-label"
        description: "Test label"
      register: create_result

    - name: Show created label
      ansible.builtin.debug:
        var: create_result.label

    # ── Update ──────────────────────────────────────────────
    - name: Update label
      paloaltonetworks.scm.scm_label:
        state: present
        name: "ansible-test-label"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated label
      ansible.builtin.debug:
        var: update_result.label

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get label by name
      paloaltonetworks.scm.scm_label:
        state: gathered
        name: "ansible-test-label"
      register: gathered_result

    - name: Show gathered label
      ansible.builtin.debug:
        var: gathered_result.label

    # ── Get by name (info module) ───────────────────────────
    - name: Get label by name (info module)
      paloaltonetworks.scm.scm_label_info:
        name: "ansible-test-label"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.labels

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get label by ID (info module)
      paloaltonetworks.scm.scm_label_info:
        id: "{{ gathered_result.label.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.labels

    # ── List all ────────────────────────────────────────────
    - name: List all labels
      paloaltonetworks.scm.scm_label_info:
      register: list_result

    - name: Show labels count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} labels"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete label
      paloaltonetworks.scm.scm_label:
        state: absent
        name: "ansible-test-label"

