---
# Example playbook for paloaltonetworks.scm.scm_qos_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_qos_profile.yml
#

- name: Manage qos_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create qos_profile
      paloaltonetworks.scm.scm_qos_profile:
        state: present
        name: "ansible-test-qos-prof"
        folder: "Service Connections"
        class_bandwidth_type:
          mbps:
            var_class:
            - name: "class1"
              priority: "low"
            - name: "class2"
              priority: "real-time"
              class_bandwidth:
                egress_guaranteed: 10
                egress_max: 20
        aggregate_bandwidth:
          egress_guaranteed: 300
          egress_max: 1000
      register: create_result

    - name: Show created qos_profile
      ansible.builtin.debug:
        var: create_result.qos_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update qos_profile
      paloaltonetworks.scm.scm_qos_profile:
        state: present
        name: "ansible-test-qos-prof"
        folder: "Service Connections"
        class_bandwidth_type:
          mbps:
            var_class:
            - name: "class1"
              priority: "low"
            - name: "class2"
              priority: "real-time"
              class_bandwidth:
                egress_guaranteed: 20
                egress_max: 40
        aggregate_bandwidth:
          egress_guaranteed: 500
          egress_max: 2000
      register: update_result

    - name: Show updated qos_profile
      ansible.builtin.debug:
        var: update_result.qos_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get qos_profile by name
      paloaltonetworks.scm.scm_qos_profile:
        state: gathered
        name: "ansible-test-qos-prof"
        folder: "Service Connections"
      register: gathered_result

    - name: Show gathered qos_profile
      ansible.builtin.debug:
        var: gathered_result.qos_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get qos_profile by name (info module)
      paloaltonetworks.scm.scm_qos_profile_info:
        name: "ansible-test-qos-prof"
        folder: "Service Connections"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.qos_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get qos_profile by ID (info module)
      paloaltonetworks.scm.scm_qos_profile_info:
        id: "{{ gathered_result.qos_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.qos_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all qos_profiles
      paloaltonetworks.scm.scm_qos_profile_info:
        folder: "Service Connections"
      register: list_result

    - name: Show qos_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} qos_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete qos_profile
      paloaltonetworks.scm.scm_qos_profile:
        state: absent
        name: "ansible-test-qos-prof"
        folder: "Service Connections"
