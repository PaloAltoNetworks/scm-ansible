---
# Example playbook for paloaltonetworks.scm.scm_pbf_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_pbf_rule.yml
#

- name: Manage pbf_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create pbf_rule
      paloaltonetworks.scm.scm_pbf_rule:
        state: present
        name: "ansible-test-pbf"
        folder: "All"
        var_from:
          zone:
          - "trust"
        source: ["192.168.10.0/24"]
        destination: ["192.168.10.0/24"]
        application: ["web-browsing"]
        service: ["service-http"]
        action:
          discard: {}
      register: create_result

    - name: Show created pbf_rule
      ansible.builtin.debug:
        var: create_result.pbf_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update pbf_rule
      paloaltonetworks.scm.scm_pbf_rule:
        state: present
        name: "ansible-test-pbf"
        folder: "All"
        var_from:
          zone:
          - "trust"
        source: ["192.168.10.0/24"]
        destination: ["192.168.10.0/24"]
        application: ["web-browsing"]
        service: ["service-http"]
        action:
          discard: {}
      register: update_result

    - name: Show updated pbf_rule
      ansible.builtin.debug:
        var: update_result.pbf_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get pbf_rule by name
      paloaltonetworks.scm.scm_pbf_rule:
        state: gathered
        name: "ansible-test-pbf"
        folder: "All"
        var_from:
          zone:
          - "trust"
        source: ["192.168.10.0/24"]
        destination: ["192.168.10.0/24"]
        application: ["web-browsing"]
        service: ["service-http"]
        action:
          discard: {}
      register: gathered_result

    - name: Show gathered pbf_rule
      ansible.builtin.debug:
        var: gathered_result.pbf_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get pbf_rule by name (info module)
      paloaltonetworks.scm.scm_pbf_rule_info:
        name: "ansible-test-pbf"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.pbf_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get pbf_rule by ID (info module)
      paloaltonetworks.scm.scm_pbf_rule_info:
        id: "{{ gathered_result.pbf_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.pbf_rules

    # ── List all ────────────────────────────────────────────
    - name: List all pbf_rules
      paloaltonetworks.scm.scm_pbf_rule_info:
        folder: "All"
      register: list_result

    - name: Show pbf_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} pbf_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete pbf_rule
      paloaltonetworks.scm.scm_pbf_rule:
        state: absent
        name: "ansible-test-pbf"
        folder: "All"
        var_from:
          zone:
          - "trust"
        source: ["192.168.10.0/24"]
        destination: ["192.168.10.0/24"]
        application: ["web-browsing"]
        service: ["service-http"]
        action:
          discard: {}

