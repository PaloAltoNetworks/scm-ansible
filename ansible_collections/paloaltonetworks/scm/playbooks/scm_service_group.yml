---
# Example playbook for paloaltonetworks.scm.scm_service_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_service_group.yml
#

- name: Manage service_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create service_group
      paloaltonetworks.scm.scm_service_group:
        state: present
        name: "ansible-test-svcgrp"
        folder: "Prisma Access"
        members:
          - "service-http"
          - "service-https"
      register: create_result

    - name: Show created service_group
      ansible.builtin.debug:
        var: create_result.service_group

    # ── Update ──────────────────────────────────────────────
    - name: Update service_group
      paloaltonetworks.scm.scm_service_group:
        state: present
        name: "ansible-test-svcgrp"
        folder: "Prisma Access"
        members:
          - "service-http"
      register: update_result

    - name: Show updated service_group
      ansible.builtin.debug:
        var: update_result.service_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get service_group by name
      paloaltonetworks.scm.scm_service_group:
        state: gathered
        name: "ansible-test-svcgrp"
        folder: "Prisma Access"
        members: []
      register: gathered_result

    - name: Show gathered service_group
      ansible.builtin.debug:
        var: gathered_result.service_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get service_group by name (info module)
      paloaltonetworks.scm.scm_service_group_info:
        name: "ansible-test-svcgrp"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.service_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get service_group by ID (info module)
      paloaltonetworks.scm.scm_service_group_info:
        id: "{{ gathered_result.service_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.service_groups

    # ── List all ────────────────────────────────────────────
    - name: List all service_groups
      paloaltonetworks.scm.scm_service_group_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show service_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} service_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete service_group
      paloaltonetworks.scm.scm_service_group:
        state: absent
        name: "ansible-test-svcgrp"
        folder: "Prisma Access"
        members: []
