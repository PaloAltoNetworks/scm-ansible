---
# Example playbook for paloaltonetworks.scm.scm_decryption_rule
#
# Demonstrates: create, update, gather, delete
#
# NOTE: Decryption rules use 'var_from' instead of 'from' (Python reserved word).
#       The info module has API validation issues, so this playbook only tests CRUD.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_decryption_rule.yml

- name: Manage decryption_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: present
        name: "ansible-test-decreule"
        folder: "All"
        position: "pre"
        action: "no-decrypt"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "any"
        destination:
          - "any"
        category:
          - "any"
        service:
          - "service-https"
        source_user:
          - "any"
        type:
          ssl_forward_proxy: {}
        log_success: true
      register: create_result

    - name: Show created decryption_rule
      ansible.builtin.debug:
        var: create_result.decryption_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: present
        name: "ansible-test-decreule"
        folder: "All"
        position: "pre"
        description: "Updated by Ansible"
        action: "no-decrypt"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "10.0.0.0/8"
        destination:
          - "192.168.0.0/16"
        category:
          - "any"
        service:
          - "service-https"
        source_user:
          - "any"
        type:
          ssl_forward_proxy: {}
        log_success: true
      register: update_result

    - name: Show updated decryption_rule
      ansible.builtin.debug:
        var: update_result.decryption_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get decryption_rule by name
      paloaltonetworks.scm.scm_decryption_rule:
        state: gathered
        name: "ansible-test-decreule"
        folder: "All"
        position: "pre"
        action: "no-decrypt"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        category: ["any"]
        service: ["service-https"]
        source_user: ["any"]
      register: gathered_result

    - name: Show gathered decryption_rule
      ansible.builtin.debug:
        var: gathered_result.decryption_rule

    # ── Delete ──────────────────────────────────────────────
    - name: Delete decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: absent
        name: "ansible-test-decreule"
        folder: "All"
        position: "pre"
        action: "no-decrypt"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        category: ["any"]
        service: ["service-https"]
        source_user: ["any"]
