---
# Example playbook for paloaltonetworks.scm.scm_region
#
# Demonstrates: create, update, gather, delete
#
# NOTE: The info module has API validation issues, so this playbook only tests CRUD.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_region.yml

- name: Manage regions in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create region
      paloaltonetworks.scm.scm_region:
        state: present
        name: "ansible-test-region"
        folder: "All"
        address:
          - "10.100.0.0/16"
      register: create_result

    - name: Show created region
      ansible.builtin.debug:
        var: create_result.region

    # ── Update ──────────────────────────────────────────────
    - name: Update region
      paloaltonetworks.scm.scm_region:
        state: present
        name: "ansible-test-region"
        folder: "All"
        address:
          - "10.100.0.0/16"
          - "10.200.0.0/16"
      register: update_result

    - name: Show updated region
      ansible.builtin.debug:
        var: update_result.region

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get region by name
      paloaltonetworks.scm.scm_region:
        state: gathered
        name: "ansible-test-region"
        folder: "All"
      register: gathered_result

    - name: Show gathered region
      ansible.builtin.debug:
        var: gathered_result.region

    # ── Delete ──────────────────────────────────────────────
    - name: Delete region
      paloaltonetworks.scm.scm_region:
        state: absent
        name: "ansible-test-region"
        folder: "All"
