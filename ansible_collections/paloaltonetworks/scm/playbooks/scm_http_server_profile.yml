---
# Example playbook for paloaltonetworks.scm.scm_http_server_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_http_server_profile.yml
#

- name: Manage http_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create http_server_profile
      paloaltonetworks.scm.scm_http_server_profile:
        state: present
        name: "ansible-test-httpsvr"
        folder: "Prisma Access"
        server:
          - name: "test-server-1"
            address: "192.0.2.1"
            port: 443
            protocol: "HTTPS"
            http_method: "GET"
      register: create_result

    - name: Show created http_server_profile
      ansible.builtin.debug:
        var: create_result.http_server_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update http_server_profile
      paloaltonetworks.scm.scm_http_server_profile:
        state: present
        name: "ansible-test-httpsvr"
        folder: "Prisma Access"
        server:
          - name: "test-server-1"
            address: "192.0.2.2"
            port: 8443
            protocol: "HTTPS"
            http_method: "POST"
      register: update_result

    - name: Show updated http_server_profile
      ansible.builtin.debug:
        var: update_result.http_server_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get http_server_profile by name
      paloaltonetworks.scm.scm_http_server_profile:
        state: gathered
        name: "ansible-test-httpsvr"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered http_server_profile
      ansible.builtin.debug:
        var: gathered_result.http_server_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get http_server_profile by name (info module)
      paloaltonetworks.scm.scm_http_server_profile_info:
        name: "ansible-test-httpsvr"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.http_server_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get http_server_profile by ID (info module)
      paloaltonetworks.scm.scm_http_server_profile_info:
        id: "{{ gathered_result.http_server_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.http_server_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all http_server_profiles
      paloaltonetworks.scm.scm_http_server_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show http_server_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} http_server_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete http_server_profile
      paloaltonetworks.scm.scm_http_server_profile:
        state: absent
        name: "ansible-test-httpsvr"
        folder: "Prisma Access"
