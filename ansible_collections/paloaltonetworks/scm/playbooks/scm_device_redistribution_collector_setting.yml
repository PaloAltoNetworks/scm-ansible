---
# Example playbook for paloaltonetworks.scm.scm_device_redistribution_collector_setting
#
# NOTE: This is a SINGLETON setting - it already exists per folder.
#       You can only gather (read) or update it, not create or delete.
#
# Demonstrates: gather, list
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_device_redistribution_collector_setting.yml

- name: Manage device_redistribution_collector_setting in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Gather (read current setting) ─────────────────────────
    - name: Gather device_redistribution_collector_setting
      paloaltonetworks.scm.scm_device_redistribution_collector_setting:
        state: gathered
        folder: "All"
      register: gathered_result

    - name: Show gathered device_redistribution_collector_setting
      ansible.builtin.debug:
        var: gathered_result.device_redistribution_collector_setting

    # ── List via info module ──────────────────────────────────
    - name: List device_redistribution_collector_settings
      paloaltonetworks.scm.scm_device_redistribution_collector_setting_info:
        folder: "All"
      register: list_result

    - name: Show device_redistribution_collector_settings
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} device_redistribution_collector_settings"
