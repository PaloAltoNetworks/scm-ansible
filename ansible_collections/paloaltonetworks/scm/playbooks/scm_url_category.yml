---
# Example playbook for paloaltonetworks.scm.scm_url_category
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_url_category.yml
#

- name: Manage url_categories in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create url_category
      paloaltonetworks.scm.scm_url_category:
        state: present
        name: "ansible-test-urlcat"
        folder: "Prisma Access"
        description: "Created by Ansible"
        list:
          - "example.com"
          - "test.com"
        type: "URL List"
      register: create_result

    - name: Show created url_category
      ansible.builtin.debug:
        var: create_result.url_category

    # ── Update ──────────────────────────────────────────────
    - name: Update url_category
      paloaltonetworks.scm.scm_url_category:
        state: present
        name: "ansible-test-urlcat"
        folder: "Prisma Access"
        description: "Updated by Ansible"
        list:
          - "example.com"
          - "test.com"
          - "updated.com"
        type: "URL List"
      register: update_result

    - name: Show updated url_category
      ansible.builtin.debug:
        var: update_result.url_category

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get url_category by name
      paloaltonetworks.scm.scm_url_category:
        state: gathered
        name: "ansible-test-urlcat"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered url_category
      ansible.builtin.debug:
        var: gathered_result.url_category

    # ── Get by name (info module) ───────────────────────────
    - name: Get url_category by name (info module)
      paloaltonetworks.scm.scm_url_category_info:
        name: "ansible-test-urlcat"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.url_categories

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get url_category by ID (info module)
      paloaltonetworks.scm.scm_url_category_info:
        id: "{{ gathered_result.url_category.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.url_categories

    # ── List all ────────────────────────────────────────────
    - name: List all url_categories
      paloaltonetworks.scm.scm_url_category_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show url_categories count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} url_categories"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete url_category
      paloaltonetworks.scm.scm_url_category:
        state: absent
        name: "ansible-test-urlcat"
        folder: "Prisma Access"
