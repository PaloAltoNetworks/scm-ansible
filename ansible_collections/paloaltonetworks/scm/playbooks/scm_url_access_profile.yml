---
# Example playbook for paloaltonetworks.scm.scm_url_access_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_url_access_profile.yml
#

- name: Manage url_access_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create url_access_profile
      paloaltonetworks.scm.scm_url_access_profile:
        state: present
        name: "ansible-test-url_access_profile"
        folder: "All"
        description: "Created by Ansible"
      register: create_result

    - name: Show created url_access_profile
      ansible.builtin.debug:
        var: create_result.url_access_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update url_access_profile
      paloaltonetworks.scm.scm_url_access_profile:
        state: present
        name: "ansible-test-url_access_profile"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated url_access_profile
      ansible.builtin.debug:
        var: update_result.url_access_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get url_access_profile by name
      paloaltonetworks.scm.scm_url_access_profile:
        state: gathered
        name: "ansible-test-url_access_profile"
        folder: "All"
      register: gathered_result

    - name: Show gathered url_access_profile
      ansible.builtin.debug:
        var: gathered_result.url_access_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get url_access_profile by name (info module)
      paloaltonetworks.scm.scm_url_access_profile_info:
        name: "ansible-test-url_access_profile"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.url_access_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get url_access_profile by ID (info module)
      paloaltonetworks.scm.scm_url_access_profile_info:
        id: "{{ gathered_result.url_access_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.url_access_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all url_access_profiles
      paloaltonetworks.scm.scm_url_access_profile_info:
        folder: "All"
      register: list_result

    - name: Show url_access_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} url_access_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete url_access_profile
      paloaltonetworks.scm.scm_url_access_profile:
        state: absent
        name: "ansible-test-url_access_profile"
        folder: "All"

