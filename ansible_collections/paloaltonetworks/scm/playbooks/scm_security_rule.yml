---
# Example playbook for paloaltonetworks.scm.scm_security_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_security_rule.yml
#

- name: Manage security_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create security_rule
      paloaltonetworks.scm.scm_security_rule:
        state: present
        name: "ansible-test-secrule"
        folder: "Prisma Access"
        position: "pre"
        policy_type: "Security"
        action: "allow"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "any"
        destination:
          - "any"
        application:
          - "any"
        service:
          - "any"
        category:
          - "any"
        source_user:
          - "any"
      register: create_result

    - name: Show created security_rule
      ansible.builtin.debug:
        var: create_result.security_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update security_rule
      paloaltonetworks.scm.scm_security_rule:
        state: present
        name: "ansible-test-secrule"
        folder: "Prisma Access"
        position: "pre"
        policy_type: "Security"
        description: "Updated by Ansible"
        action: "deny"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "any"
        destination:
          - "any"
        application:
          - "any"
        service:
          - "any"
        category:
          - "any"
        source_user:
          - "any"
      register: update_result

    - name: Show updated security_rule
      ansible.builtin.debug:
        var: update_result.security_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get security_rule by name
      paloaltonetworks.scm.scm_security_rule:
        state: gathered
        name: "ansible-test-secrule"
        folder: "Prisma Access"
        position: "pre"
      register: gathered_result

    - name: Show gathered security_rule
      ansible.builtin.debug:
        var: gathered_result.security_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get security_rule by name (info module)
      paloaltonetworks.scm.scm_security_rule_info:
        name: "ansible-test-secrule"
        folder: "Prisma Access"
        position: "pre"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.security_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get security_rule by ID (info module)
      paloaltonetworks.scm.scm_security_rule_info:
        id: "{{ gathered_result.security_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.security_rules

    # ── List all ────────────────────────────────────────────
    - name: List all security_rules
      paloaltonetworks.scm.scm_security_rule_info:
        folder: "Prisma Access"
        position: "pre"
      register: list_result

    - name: Show security_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} security_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete security_rule
      paloaltonetworks.scm.scm_security_rule:
        state: absent
        name: "ansible-test-secrule"
        folder: "Prisma Access"
        position: "pre"
