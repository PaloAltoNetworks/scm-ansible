---
# Example playbook for paloaltonetworks.scm.scm_security_zone
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_security_zone.yml
#

- name: Manage security_zones in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create security_zone
      paloaltonetworks.scm.scm_security_zone:
        state: present
        name: "ansible-test-seczone"
        folder: "All"
        enable_device_identification: true
        enable_user_identification: true
      register: create_result

    - name: Show created security_zone
      ansible.builtin.debug:
        var: create_result.security_zone

    # ── Update ──────────────────────────────────────────────
    - name: Update security_zone
      paloaltonetworks.scm.scm_security_zone:
        state: present
        name: "ansible-test-seczone"
        folder: "All"
        enable_device_identification: true
        enable_user_identification: false
      register: update_result

    - name: Show updated security_zone
      ansible.builtin.debug:
        var: update_result.security_zone

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get security_zone by name
      paloaltonetworks.scm.scm_security_zone:
        state: gathered
        name: "ansible-test-seczone"
        folder: "All"
      register: gathered_result

    - name: Show gathered security_zone
      ansible.builtin.debug:
        var: gathered_result.security_zone

    # ── Get by name (info module) ───────────────────────────
    - name: Get security_zone by name (info module)
      paloaltonetworks.scm.scm_security_zone_info:
        name: "ansible-test-seczone"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.security_zones

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get security_zone by ID (info module)
      paloaltonetworks.scm.scm_security_zone_info:
        id: "{{ gathered_result.security_zone.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.security_zones

    # ── List all ────────────────────────────────────────────
    - name: List all security_zones
      paloaltonetworks.scm.scm_security_zone_info:
        folder: "All"
      register: list_result

    - name: Show security_zones count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} security_zones"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete security_zone
      paloaltonetworks.scm.scm_security_zone:
        state: absent
        name: "ansible-test-seczone"
        folder: "All"
