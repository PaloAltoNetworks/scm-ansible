---
# Example playbook for paloaltonetworks.scm.scm_auto_tag_action
#
# Demonstrates: create, get by name, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_auto_tag_action.yml
#

- name: Manage auto_tag_actions in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create auto_tag_action
      paloaltonetworks.scm.scm_auto_tag_action:
        state: present
        name: "ansible-test-auto_tag_action"
        log_type: "traffic"
        filter: "All Logs"
        actions:
        - name: "test-action"
          type: "tagging"
          action: "add-tag"
          target: "source-address"
          tags:
          - "test-tag"
      register: create_result

    - name: Show created auto_tag_action
      ansible.builtin.debug:
        var: create_result.auto_tag_action

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get auto_tag_action by name
      paloaltonetworks.scm.scm_auto_tag_action:
        state: gathered
        name: "ansible-test-auto_tag_action"
        log_type: "traffic"
        filter: "All Logs"
        actions:
        - name: "test-action"
          type: "tagging"
          action: "add-tag"
          target: "source-address"
          tags:
          - "test-tag"
      register: gathered_result

    - name: Show gathered auto_tag_action
      ansible.builtin.debug:
        var: gathered_result.auto_tag_action

    # ── Get by name (info module) ───────────────────────────
    - name: Get auto_tag_action by name (info module)
      paloaltonetworks.scm.scm_auto_tag_action_info:
        name: "ansible-test-auto_tag_action"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.auto_tag_actions

    # ── List all ────────────────────────────────────────────
    - name: List all auto_tag_actions
      paloaltonetworks.scm.scm_auto_tag_action_info:
      register: list_result

    - name: Show auto_tag_actions count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} auto_tag_actions"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete auto_tag_action
      paloaltonetworks.scm.scm_auto_tag_action:
        state: absent
        name: "ansible-test-auto_tag_action"
        log_type: "traffic"
        filter: "All Logs"
        actions:
        - name: "test-action"
          type: "tagging"
          action: "add-tag"
          target: "source-address"
          tags:
          - "test-tag"

