---
# Example playbook for paloaltonetworks.scm.scm_loopback_interface
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_loopback_interface.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_loopback_interface' for full parameter docs.

- name: Manage loopback_interfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create loopback_interface
      paloaltonetworks.scm.scm_loopback_interface:
        state: present
        name: "$ansible-test-loopback"
        folder: "All"
        mtu: 1500
        comment: "ansible test loopback interface"
      register: create_result

    - name: Show created loopback_interface
      ansible.builtin.debug:
        var: create_result.loopback_interface

    # ── Update ──────────────────────────────────────────────
    - name: Update loopback_interface
      paloaltonetworks.scm.scm_loopback_interface:
        state: present
        name: "$ansible-test-loopback"
        folder: "All"
        mtu: 1500
        comment: "ansible test loopback interface updated"
      register: update_result

    - name: Show updated loopback_interface
      ansible.builtin.debug:
        var: update_result.loopback_interface

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get loopback_interface by name
      paloaltonetworks.scm.scm_loopback_interface:
        state: gathered
        name: "$ansible-test-loopback"
        folder: "All"
      register: gathered_result

    - name: Show gathered loopback_interface
      ansible.builtin.debug:
        var: gathered_result.loopback_interface

    # ── Get by name (info module) ───────────────────────────
    - name: Get loopback_interface by name (info module)
      paloaltonetworks.scm.scm_loopback_interface_info:
        name: "$ansible-test-loopback"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.loopback_interfaces

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get loopback_interface by ID (info module)
      paloaltonetworks.scm.scm_loopback_interface_info:
        id: "{{ gathered_result.loopback_interface.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.loopback_interfaces

    # ── List all ────────────────────────────────────────────
    - name: List all loopback_interfaces
      paloaltonetworks.scm.scm_loopback_interface_info:
        folder: "All"
      register: list_result

    - name: Show loopback_interfaces count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} loopback_interfaces"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete loopback_interface
      paloaltonetworks.scm.scm_loopback_interface:
        state: absent
        name: "$ansible-test-loopback"
        folder: "All"

