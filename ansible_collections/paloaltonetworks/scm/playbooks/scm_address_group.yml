---
# Example playbook for paloaltonetworks.scm.scm_address_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_address_group.yml
#

- name: Manage address_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create address_group
      paloaltonetworks.scm.scm_address_group:
        state: present
        name: "ansible-test-addrgrp"
        folder: "Prisma Access"
        dynamic:
          filter: "'ansible-test-tag'"
        description: "Created by Ansible"
      register: create_result

    - name: Show created address_group
      ansible.builtin.debug:
        var: create_result.address_group

    # ── Update ──────────────────────────────────────────────
    - name: Update address_group
      paloaltonetworks.scm.scm_address_group:
        state: present
        name: "ansible-test-addrgrp"
        folder: "Prisma Access"
        description: "Updated by Ansible"
        dynamic:
          filter: "'ansible-test-tag'"
      register: update_result

    - name: Show updated address_group
      ansible.builtin.debug:
        var: update_result.address_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get address_group by name
      paloaltonetworks.scm.scm_address_group:
        state: gathered
        name: "ansible-test-addrgrp"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered address_group
      ansible.builtin.debug:
        var: gathered_result.address_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get address_group by name (info module)
      paloaltonetworks.scm.scm_address_group_info:
        name: "ansible-test-addrgrp"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.address_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get address_group by ID (info module)
      paloaltonetworks.scm.scm_address_group_info:
        id: "{{ gathered_result.address_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.address_groups

    # ── List all ────────────────────────────────────────────
    - name: List all address_groups
      paloaltonetworks.scm.scm_address_group_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show address_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} address_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete address_group
      paloaltonetworks.scm.scm_address_group:
        state: absent
        name: "ansible-test-addrgrp"
        folder: "Prisma Access"
