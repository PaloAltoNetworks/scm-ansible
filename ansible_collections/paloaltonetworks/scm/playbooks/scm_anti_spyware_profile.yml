---
# Example playbook for paloaltonetworks.scm.scm_anti_spyware_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_anti_spyware_profile.yml
#

- name: Manage anti_spyware_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create anti_spyware_profile
      paloaltonetworks.scm.scm_anti_spyware_profile:
        state: present
        name: "ansible-test-antispy"
        folder: "Prisma Access"
        description: "Created by Ansible"
      register: create_result

    - name: Show created anti_spyware_profile
      ansible.builtin.debug:
        var: create_result.anti_spyware_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update anti_spyware_profile
      paloaltonetworks.scm.scm_anti_spyware_profile:
        state: present
        name: "ansible-test-antispy"
        folder: "Prisma Access"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated anti_spyware_profile
      ansible.builtin.debug:
        var: update_result.anti_spyware_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get anti_spyware_profile by name
      paloaltonetworks.scm.scm_anti_spyware_profile:
        state: gathered
        name: "ansible-test-antispy"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered anti_spyware_profile
      ansible.builtin.debug:
        var: gathered_result.anti_spyware_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get anti_spyware_profile by name (info module)
      paloaltonetworks.scm.scm_anti_spyware_profile_info:
        name: "ansible-test-antispy"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.anti_spyware_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get anti_spyware_profile by ID (info module)
      paloaltonetworks.scm.scm_anti_spyware_profile_info:
        id: "{{ gathered_result.anti_spyware_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.anti_spyware_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all anti_spyware_profiles
      paloaltonetworks.scm.scm_anti_spyware_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show anti_spyware_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} anti_spyware_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete anti_spyware_profile
      paloaltonetworks.scm.scm_anti_spyware_profile:
        state: absent
        name: "ansible-test-antispy"
        folder: "Prisma Access"
