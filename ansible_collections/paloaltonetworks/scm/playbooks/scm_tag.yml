---
# Example playbook for paloaltonetworks.scm.scm_tag
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_tag.yml
#

- name: Manage tags in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create tag
      paloaltonetworks.scm.scm_tag:
        state: present
        name: "ansible-test-tag"
        folder: "Prisma Access"
        color: "Red"
        comments: "Created by Ansible"
      register: create_result

    - name: Show created tag
      ansible.builtin.debug:
        var: create_result.tag

    # ── Update ──────────────────────────────────────────────
    - name: Update tag
      paloaltonetworks.scm.scm_tag:
        state: present
        name: "ansible-test-tag"
        folder: "Prisma Access"
        color: "Blue"
        comments: "Updated by Ansible"
      register: update_result

    - name: Show updated tag
      ansible.builtin.debug:
        var: update_result.tag

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get tag by name
      paloaltonetworks.scm.scm_tag:
        state: gathered
        name: "ansible-test-tag"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered tag
      ansible.builtin.debug:
        var: gathered_result.tag

    # ── Get by name (info module) ───────────────────────────
    - name: Get tag by name (info module)
      paloaltonetworks.scm.scm_tag_info:
        name: "ansible-test-tag"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.tags

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get tag by ID (info module)
      paloaltonetworks.scm.scm_tag_info:
        id: "{{ gathered_result.tag.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.tags

    # ── List all ────────────────────────────────────────────
    - name: List all tags
      paloaltonetworks.scm.scm_tag_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show tags count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} tags"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete tag
      paloaltonetworks.scm.scm_tag:
        state: absent
        name: "ansible-test-tag"
        folder: "Prisma Access"
