---
# Example playbook for paloaltonetworks.scm.scm_saml_server_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_saml_server_profile.yml
#

- name: Manage saml_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create saml_server_profile
      paloaltonetworks.scm.scm_saml_server_profile:
        state: present
        name: "ansible-test-saml"
        folder: "All"
        certificate: "Global Authentication Cookie Cert"
        entity_id: "https://idp.example.com/entity"
        sso_url: "https://idp.example.com/sso"
        sso_bindings: "redirect"
      register: create_result

    - name: Show created saml_server_profile
      ansible.builtin.debug:
        var: create_result.saml_server_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update saml_server_profile
      paloaltonetworks.scm.scm_saml_server_profile:
        state: present
        name: "ansible-test-saml"
        folder: "All"
        certificate: "Global Authentication Cookie Cert"
        entity_id: "https://idp.example.com/entity"
        sso_url: "https://idp.updated.com/sso"
        sso_bindings: "redirect"
        max_clock_skew: 500
      register: update_result

    - name: Show updated saml_server_profile
      ansible.builtin.debug:
        var: update_result.saml_server_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get saml_server_profile by name
      paloaltonetworks.scm.scm_saml_server_profile:
        state: gathered
        name: "ansible-test-saml"
        folder: "All"
        certificate: "Global Authentication Cookie Cert"
        entity_id: "https://idp.example.com/entity"
        sso_url: "https://idp.updated.com/sso"
        sso_bindings: "redirect"
      register: gathered_result

    - name: Show gathered saml_server_profile
      ansible.builtin.debug:
        var: gathered_result.saml_server_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get saml_server_profile by name (info module)
      paloaltonetworks.scm.scm_saml_server_profile_info:
        name: "ansible-test-saml"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.saml_server_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get saml_server_profile by ID (info module)
      paloaltonetworks.scm.scm_saml_server_profile_info:
        id: "{{ gathered_result.saml_server_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.saml_server_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all saml_server_profiles
      paloaltonetworks.scm.scm_saml_server_profile_info:
        folder: "All"
      register: list_result

    - name: Show saml_server_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} saml_server_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete saml_server_profile
      paloaltonetworks.scm.scm_saml_server_profile:
        state: absent
        name: "ansible-test-saml"
        folder: "All"
        certificate: "Global Authentication Cookie Cert"
        entity_id: "https://idp.example.com/entity"
        sso_url: "https://idp.updated.com/sso"
        sso_bindings: "redirect"
