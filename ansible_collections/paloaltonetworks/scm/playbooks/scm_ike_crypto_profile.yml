---
# Example playbook for paloaltonetworks.scm.scm_ike_crypto_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_ike_crypto_profile.yml
#

- name: Manage ike_crypto_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create ike_crypto_profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: present
        name: "ansible-test-ike-crypto"
        folder: "Shared"
        dh_group: ["group14"]
        encryption: ["aes-256-cbc"]
        hash: ["sha256"]
        lifetime:
          hours: 8
      register: create_result

    - name: Show created ike_crypto_profile
      ansible.builtin.debug:
        var: create_result.ike_crypto_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update ike_crypto_profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: present
        name: "ansible-test-ike-crypto"
        folder: "Shared"
        dh_group: ["group14", "group19"]
        encryption: ["aes-256-cbc"]
        hash: ["sha256", "sha384"]
        lifetime:
          hours: 8
      register: update_result

    - name: Show updated ike_crypto_profile
      ansible.builtin.debug:
        var: update_result.ike_crypto_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get ike_crypto_profile by name
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: gathered
        name: "ansible-test-ike-crypto"
        folder: "Shared"
        dh_group: ["group14"]
        encryption: ["aes-256-cbc"]
        hash: ["sha256"]
      register: gathered_result

    - name: Show gathered ike_crypto_profile
      ansible.builtin.debug:
        var: gathered_result.ike_crypto_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get ike_crypto_profile by name (info module)
      paloaltonetworks.scm.scm_ike_crypto_profile_info:
        name: "ansible-test-ike-crypto"
        folder: "Shared"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.ike_crypto_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get ike_crypto_profile by ID (info module)
      paloaltonetworks.scm.scm_ike_crypto_profile_info:
        id: "{{ gathered_result.ike_crypto_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.ike_crypto_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all ike_crypto_profiles
      paloaltonetworks.scm.scm_ike_crypto_profile_info:
        folder: "Shared"
      register: list_result

    - name: Show ike_crypto_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} ike_crypto_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete ike_crypto_profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: absent
        name: "ansible-test-ike-crypto"
        folder: "Shared"
        dh_group: ["group14"]
        encryption: ["aes-256-cbc"]
        hash: ["sha256"]
