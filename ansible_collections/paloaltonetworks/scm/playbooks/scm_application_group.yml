---
# Example playbook for paloaltonetworks.scm.scm_application_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_application_group.yml
#

- name: Manage application_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create application_group
      paloaltonetworks.scm.scm_application_group:
        state: present
        name: "ansible-test-appgrp"
        folder: "Prisma Access"
        members:
          - "web-browsing"
          - "ssl"
      register: create_result

    - name: Show created application_group
      ansible.builtin.debug:
        var: create_result.application_group

    # ── Update ──────────────────────────────────────────────
    - name: Update application_group
      paloaltonetworks.scm.scm_application_group:
        state: present
        name: "ansible-test-appgrp"
        folder: "Prisma Access"
        members:
          - "web-browsing"
          - "ssl"
          - "dns"
      register: update_result

    - name: Show updated application_group
      ansible.builtin.debug:
        var: update_result.application_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get application_group by name
      paloaltonetworks.scm.scm_application_group:
        state: gathered
        name: "ansible-test-appgrp"
        folder: "Prisma Access"
        members: []
      register: gathered_result

    - name: Show gathered application_group
      ansible.builtin.debug:
        var: gathered_result.application_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get application_group by name (info module)
      paloaltonetworks.scm.scm_application_group_info:
        name: "ansible-test-appgrp"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.application_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get application_group by ID (info module)
      paloaltonetworks.scm.scm_application_group_info:
        id: "{{ gathered_result.application_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.application_groups

    # ── List all ────────────────────────────────────────────
    - name: List all application_groups
      paloaltonetworks.scm.scm_application_group_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show application_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} application_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete application_group
      paloaltonetworks.scm.scm_application_group:
        state: absent
        name: "ansible-test-appgrp"
        folder: "Prisma Access"
        members: []
