---
# Example playbook for paloaltonetworks.scm.scm_site
#
# NOTE: Site requires a full VPN dependency chain:
#       IKE Crypto Profile -> IKE Gateway -> IPsec Tunnel -> Remote Network -> Site
#       This playbook creates all dependencies, then the site, then cleans up.
#
# Demonstrates: create with dependencies, gather, delete with cleanup
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_site.yml

- name: Manage site with VPN dependencies in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rn_folder: "Remote Networks"
    crypto_name: "ansible-test-ikecrypto-site"
    gateway_name: "ansible-test-ikegw-site"
    tunnel_name: "ansible-test-ipsectun-site"
    rn_name: "ansible-test-rn-site"
    site_name: "ansible-test-site"

  tasks:

    # ══════════════════════════════════════════════════════════
    # SETUP: Create VPN dependency chain
    # ══════════════════════════════════════════════════════════

    # ── 1. Create IKE Crypto Profile ──────────────────────────
    - name: Create IKE Crypto Profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: present
        name: "{{ crypto_name }}"
        folder: "{{ rn_folder }}"
        hash:
          - "sha256"
        dh_group:
          - "group14"
        encryption:
          - "aes-256-cbc"
      register: crypto_result

    # ── 2. Create IKE Gateway ─────────────────────────────────
    - name: Create IKE Gateway
      paloaltonetworks.scm.scm_ike_gateway:
        state: present
        name: "{{ gateway_name }}"
        folder: "{{ rn_folder }}"
        authentication:
          pre_shared_key:
            key: "secret123"
        peer_address:
          ip: "2.2.2.8"
        peer_id:
          type: "ipaddr"
          id: "10.3.3.8"
        local_id:
          type: "ipaddr"
          id: "10.3.4.8"
        protocol:
          ikev1:
            ike_crypto_profile: "{{ crypto_name }}"
            dpd:
              enable: true
          ikev2:
            ike_crypto_profile: "{{ crypto_name }}"
            dpd:
              enable: true
      register: gateway_result

    # ── 3. Create IPsec Tunnel ────────────────────────────────
    - name: Create IPsec Tunnel
      paloaltonetworks.scm.scm_ipsec_tunnel:
        state: present
        name: "{{ tunnel_name }}"
        folder: "{{ rn_folder }}"
        anti_replay: true
        copy_tos: false
        enable_gre_encapsulation: false
        auto_key:
          ike_gateway:
            - name: "{{ gateway_name }}"
          ipsec_crypto_profile: "PaloAlto-Networks-IPSec-Crypto"
      register: tunnel_result

    # ── 4. Create Remote Network ──────────────────────────────
    - name: Create Remote Network
      paloaltonetworks.scm.scm_remote_network:
        state: present
        name: "{{ rn_name }}"
        folder: "{{ rn_folder }}"
        region: "us-west-2"
        spn_name: "us-west-dakota"
        license_type: "FWAAS-AGGREGATE"
        ipsec_tunnel: "{{ tunnel_name }}"
      register: rn_result

    # ══════════════════════════════════════════════════════════
    # MAIN: Site CRUD operations
    # ══════════════════════════════════════════════════════════

    # ── Create Site ───────────────────────────────────────────
    - name: Create site
      paloaltonetworks.scm.scm_site:
        state: present
        name: "{{ site_name }}"
        folder: "All"
        city: "San Jose"
        country: "US"
        members:
          - name: "{{ rn_name }}"
            mode: "active"
            remote_network: "{{ rn_name }}"
      register: create_result

    - name: Show created site
      ansible.builtin.debug:
        var: create_result.site

    # ── Gather Site ───────────────────────────────────────────
    - name: Gather site by name
      paloaltonetworks.scm.scm_site:
        state: gathered
        name: "{{ site_name }}"
        folder: "All"
      register: gathered_result

    - name: Show gathered site
      ansible.builtin.debug:
        var: gathered_result.site

    # ── List Sites ────────────────────────────────────────────
    - name: List all sites
      paloaltonetworks.scm.scm_site_info:
        folder: "All"
      register: list_result

    - name: Show sites count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} sites"

    # ══════════════════════════════════════════════════════════
    # CLEANUP: Delete in reverse order
    # ══════════════════════════════════════════════════════════

    # ── Delete Site ───────────────────────────────────────────
    - name: Delete site
      paloaltonetworks.scm.scm_site:
        state: absent
        name: "{{ site_name }}"
        folder: "All"

    # ── Delete Remote Network ─────────────────────────────────
    - name: Delete Remote Network
      paloaltonetworks.scm.scm_remote_network:
        state: absent
        name: "{{ rn_name }}"
        folder: "{{ rn_folder }}"
        region: "us-west-2"
        license_type: "FWAAS-AGGREGATE"

    # ── Delete IPsec Tunnel ───────────────────────────────────
    - name: Delete IPsec Tunnel
      paloaltonetworks.scm.scm_ipsec_tunnel:
        state: absent
        name: "{{ tunnel_name }}"
        folder: "{{ rn_folder }}"
        auto_key:
          ike_gateway:
            - name: "{{ gateway_name }}"
          ipsec_crypto_profile: "PaloAlto-Networks-IPSec-Crypto"

    # ── Delete IKE Gateway ────────────────────────────────────
    - name: Delete IKE Gateway
      paloaltonetworks.scm.scm_ike_gateway:
        state: absent
        name: "{{ gateway_name }}"
        folder: "{{ rn_folder }}"
        authentication:
          pre_shared_key:
            key: "secret123"
        peer_address:
          ip: "2.2.2.8"
        protocol:
          ikev1:
            ike_crypto_profile: "{{ crypto_name }}"
          ikev2:
            ike_crypto_profile: "{{ crypto_name }}"

    # ── Delete IKE Crypto Profile ─────────────────────────────
    - name: Delete IKE Crypto Profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: absent
        name: "{{ crypto_name }}"
        folder: "{{ rn_folder }}"
        hash:
          - "sha256"
        dh_group:
          - "group14"
        encryption:
          - "aes-256-cbc"
