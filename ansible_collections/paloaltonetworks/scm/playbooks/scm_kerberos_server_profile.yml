---
# Example playbook for paloaltonetworks.scm.scm_kerberos_server_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_kerberos_server_profile.yml
#

- name: Manage kerberos_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create kerberos_server_profile
      paloaltonetworks.scm.scm_kerberos_server_profile:
        state: present
        name: "ansible-test-kerberos"
        folder: "All"
        server:
        - name: "kdc1"
          host: "10.0.0.50"
          port: 88
        - name: "kdc2"
          host: "kerberos.example.com"
          port: 88
      register: create_result

    - name: Show created kerberos_server_profile
      ansible.builtin.debug:
        var: create_result.kerberos_server_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update kerberos_server_profile
      paloaltonetworks.scm.scm_kerberos_server_profile:
        state: present
        name: "ansible-test-kerberos"
        folder: "All"
        server:
        - name: "kdc1"
          host: "10.0.0.51"
          port: 88
        - name: "kdc2"
          host: "kerberos2.example.com"
          port: 88
      register: update_result

    - name: Show updated kerberos_server_profile
      ansible.builtin.debug:
        var: update_result.kerberos_server_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get kerberos_server_profile by name
      paloaltonetworks.scm.scm_kerberos_server_profile:
        state: gathered
        name: "ansible-test-kerberos"
        folder: "All"
        server:
        - name: "kdc1"
          host: "10.0.0.51"
          port: 88
      register: gathered_result

    - name: Show gathered kerberos_server_profile
      ansible.builtin.debug:
        var: gathered_result.kerberos_server_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get kerberos_server_profile by name (info module)
      paloaltonetworks.scm.scm_kerberos_server_profile_info:
        name: "ansible-test-kerberos"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.kerberos_server_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get kerberos_server_profile by ID (info module)
      paloaltonetworks.scm.scm_kerberos_server_profile_info:
        id: "{{ gathered_result.kerberos_server_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.kerberos_server_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all kerberos_server_profiles
      paloaltonetworks.scm.scm_kerberos_server_profile_info:
        folder: "All"
      register: list_result

    - name: Show kerberos_server_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} kerberos_server_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete kerberos_server_profile
      paloaltonetworks.scm.scm_kerberos_server_profile:
        state: absent
        name: "ansible-test-kerberos"
        folder: "All"
        server:
        - name: "kdc1"
          host: "10.0.0.51"
          port: 88
