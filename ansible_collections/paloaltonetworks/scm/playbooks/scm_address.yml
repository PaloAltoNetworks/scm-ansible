---
# Example playbook for paloaltonetworks.scm.scm_address
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_address.yml
#

- name: Manage addresses in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create address
      paloaltonetworks.scm.scm_address:
        state: present
        name: "ansible-test-address"
        folder: "Prisma Access"
        ip_netmask: "10.0.0.1/32"
        description: "Created by Ansible"
      register: create_result

    - name: Show created address
      ansible.builtin.debug:
        var: create_result.address

    # ── Update ──────────────────────────────────────────────
    - name: Update address
      paloaltonetworks.scm.scm_address:
        state: present
        name: "ansible-test-address"
        description: "Updated by Ansible"
        folder: "Prisma Access"
        ip_netmask: "10.0.0.1/32"
      register: update_result

    - name: Show updated address
      ansible.builtin.debug:
        var: update_result.address

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get address by name
      paloaltonetworks.scm.scm_address:
        state: gathered
        name: "ansible-test-address"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered address
      ansible.builtin.debug:
        var: gathered_result.address

    # ── Get by name (info module) ───────────────────────────
    - name: Get address by name (info module)
      paloaltonetworks.scm.scm_address_info:
        name: "ansible-test-address"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.addresses

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get address by ID (info module)
      paloaltonetworks.scm.scm_address_info:
        id: "{{ gathered_result.address.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.addresses

    # ── List all ────────────────────────────────────────────
    - name: List all addresses
      paloaltonetworks.scm.scm_address_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show addresses count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} addresses"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete address
      paloaltonetworks.scm.scm_address:
        state: absent
        name: "ansible-test-address"
        folder: "Prisma Access"

