---
# Example playbook for paloaltonetworks.scm.scm_lldp_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook playbooks/scm_lldp_profile.yml
#

- name: Manage lldp_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create lldp_profile
      paloaltonetworks.scm.scm_lldp_profile:
        state: present
        name: "ansible-test-lldp"
        folder: "All"
        mode: "transmit-receive"
      register: create_result

    - name: Show created lldp_profile
      ansible.builtin.debug:
        var: create_result.lldp_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update lldp_profile
      paloaltonetworks.scm.scm_lldp_profile:
        state: present
        name: "ansible-test-lldp"
        folder: "All"
        mode: "transmit-receive"
      register: update_result

    - name: Show updated lldp_profile
      ansible.builtin.debug:
        var: update_result.lldp_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get lldp_profile by name
      paloaltonetworks.scm.scm_lldp_profile:
        state: gathered
        name: "ansible-test-lldp"
        folder: "All"
      register: gathered_result

    - name: Show gathered lldp_profile
      ansible.builtin.debug:
        var: gathered_result.lldp_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get lldp_profile by name (info module)
      paloaltonetworks.scm.scm_lldp_profile_info:
        name: "ansible-test-lldp"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.lldp_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get lldp_profile by ID (info module)
      paloaltonetworks.scm.scm_lldp_profile_info:
        id: "{{ gathered_result.lldp_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.lldp_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all lldp_profiles
      paloaltonetworks.scm.scm_lldp_profile_info:
        folder: "All"
      register: list_result

    - name: Show lldp_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} lldp_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete lldp_profile
      paloaltonetworks.scm.scm_lldp_profile:
        state: absent
        name: "ansible-test-lldp"
        folder: "All"

