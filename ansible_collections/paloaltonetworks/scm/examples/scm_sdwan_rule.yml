---
# Example playbook for paloaltonetworks.scm.scm_sdwan_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_sdwan_rule.yml
#
# NOTE: SD-WAN rules require SD-WAN to be enabled in your SCM tenant and
#       valid path_quality_profile and traffic_distribution_profile names.
#       Update the profile names below to match profiles that exist in your environment.
#       Run 'ansible-doc paloaltonetworks.scm.scm_sdwan_rule' for full parameter docs.

- name: Manage sdwan_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create sdwan_rule
      paloaltonetworks.scm.scm_sdwan_rule:
        state: present
        name: "ansible-test-sdwan-rule"
        folder: "All"
        position: "pre"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        source_user: ["any"]
        destination: ["any"]
        application: ["any"]
        service: ["any"]
        path_quality_profile: "Default Path Quality Profile"
        action:
          traffic_distribution_profile: "Default Traffic Distribution Profile"
      register: create_result

    - name: Show created sdwan_rule
      ansible.builtin.debug:
        var: create_result.sdwan_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update sdwan_rule
      paloaltonetworks.scm.scm_sdwan_rule:
        state: present
        name: "ansible-test-sdwan-rule"
        folder: "All"
        position: "pre"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        source_user: ["any"]
        destination: ["any"]
        application: ["any"]
        service: ["any"]
        path_quality_profile: "Default Path Quality Profile"
        action:
          traffic_distribution_profile: "Default Traffic Distribution Profile"
      register: update_result

    - name: Show updated sdwan_rule
      ansible.builtin.debug:
        var: update_result.sdwan_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get sdwan_rule by name
      paloaltonetworks.scm.scm_sdwan_rule:
        state: gathered
        name: "ansible-test-sdwan-rule"
        folder: "All"
        position: "pre"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        source_user: ["any"]
        destination: ["any"]
        application: ["any"]
        service: ["any"]
        path_quality_profile: "Default Path Quality Profile"
        action:
          traffic_distribution_profile: "Default Traffic Distribution Profile"
      register: gathered_result

    - name: Show gathered sdwan_rule
      ansible.builtin.debug:
        var: gathered_result.sdwan_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get sdwan_rule by name (info module)
      paloaltonetworks.scm.scm_sdwan_rule_info:
        name: "ansible-test-sdwan-rule"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.sdwan_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get sdwan_rule by ID (info module)
      paloaltonetworks.scm.scm_sdwan_rule_info:
        id: "{{ gathered_result.sdwan_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.sdwan_rules

    # ── List all ────────────────────────────────────────────
    - name: List all sdwan_rules
      paloaltonetworks.scm.scm_sdwan_rule_info:
        folder: "All"
      register: list_result

    - name: Show sdwan_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} sdwan_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete sdwan_rule
      paloaltonetworks.scm.scm_sdwan_rule:
        state: absent
        name: "ansible-test-sdwan-rule"
        folder: "All"
        position: "pre"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        source_user: ["any"]
        destination: ["any"]
        application: ["any"]
        service: ["any"]
        path_quality_profile: "Default Path Quality Profile"
        action:
          traffic_distribution_profile: "Default Traffic Distribution Profile"

