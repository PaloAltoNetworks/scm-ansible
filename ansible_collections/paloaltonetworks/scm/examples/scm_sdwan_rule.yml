---
# Example playbook for paloaltonetworks.scm.scm_sdwan_rule
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_sdwan_rule.yml

- name: Manage sdwan_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a sdwan_rule object
      paloaltonetworks.scm.scm_sdwan_rule:
        state: present
        name: "example-sdwan_rule"
        folder: "Shared"
      register: create_result

    - name: Display created sdwan_rule
      ansible.builtin.debug:
        var: create_result.sdwan_rule

    - name: Gather information about a sdwan_rule object
      paloaltonetworks.scm.scm_sdwan_rule:
        state: gathered
        name: "example-sdwan_rule"
        folder: "Shared"
      register: gather_result

    - name: Display gathered sdwan_rule
      ansible.builtin.debug:
        var: gather_result.sdwan_rule

    - name: List all sdwan_rules in a folder
      paloaltonetworks.scm.scm_sdwan_rule_info:
        folder: "Shared"
      register: list_result

    - name: Display sdwan_rules list
      ansible.builtin.debug:
        var: list_result.sdwan_rules


    - name: Delete the sdwan_rule object
      paloaltonetworks.scm.scm_sdwan_rule:
        state: absent
        name: "example-sdwan_rule"
        folder: "Shared"

