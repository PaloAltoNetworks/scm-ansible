---
# Example playbook for paloaltonetworks.scm.scm_radius_server_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_radius_server_profile.yml
#

- name: Manage radius_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create radius_server_profile
      paloaltonetworks.scm.scm_radius_server_profile:
        state: present
        name: "ansible-test-radius"
        folder: "All"
        protocol:
          pap: {}
        server:
        - name: "rad1"
          ip_address: "10.1.1.1"
          secret: "radsecret"
          port: 1812
        retries: 3
        timeout: 10
      register: create_result

    - name: Show created radius_server_profile
      ansible.builtin.debug:
        var: create_result.radius_server_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update radius_server_profile
      paloaltonetworks.scm.scm_radius_server_profile:
        state: present
        name: "ansible-test-radius"
        folder: "All"
        protocol:
          pap: {}
        server:
        - name: "rad1"
          ip_address: "10.1.1.1"
          secret: "radsecret"
          port: 1812
        retries: 2
        timeout: 60
      register: update_result

    - name: Show updated radius_server_profile
      ansible.builtin.debug:
        var: update_result.radius_server_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get radius_server_profile by name
      paloaltonetworks.scm.scm_radius_server_profile:
        state: gathered
        name: "ansible-test-radius"
        folder: "All"
        protocol:
          pap: {}
        server:
        - name: "rad1"
          ip_address: "10.1.1.1"
          secret: "radsecret"
          port: 1812
      register: gathered_result

    - name: Show gathered radius_server_profile
      ansible.builtin.debug:
        var: gathered_result.radius_server_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get radius_server_profile by name (info module)
      paloaltonetworks.scm.scm_radius_server_profile_info:
        name: "ansible-test-radius"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.radius_server_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get radius_server_profile by ID (info module)
      paloaltonetworks.scm.scm_radius_server_profile_info:
        id: "{{ gathered_result.radius_server_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.radius_server_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all radius_server_profiles
      paloaltonetworks.scm.scm_radius_server_profile_info:
        folder: "All"
      register: list_result

    - name: Show radius_server_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} radius_server_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete radius_server_profile
      paloaltonetworks.scm.scm_radius_server_profile:
        state: absent
        name: "ansible-test-radius"
        folder: "All"
        protocol:
          pap: {}
        server:
        - name: "rad1"
          ip_address: "10.1.1.1"
          secret: "radsecret"
          port: 1812
