---
# Example playbook for paloaltonetworks.scm.scm_radius_server_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_radius_server_profile.yml

- name: Manage radius_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a radius_server_profile object
      paloaltonetworks.scm.scm_radius_server_profile:
        state: present
        name: "example-radius_server_profile"
        folder: "Shared"
      register: create_result

    - name: Display created radius_server_profile
      ansible.builtin.debug:
        var: create_result.radius_server_profile

    - name: Gather information about a radius_server_profile object
      paloaltonetworks.scm.scm_radius_server_profile:
        state: gathered
        name: "example-radius_server_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered radius_server_profile
      ansible.builtin.debug:
        var: gather_result.radius_server_profile

    - name: List all radius_server_profiles in a folder
      paloaltonetworks.scm.scm_radius_server_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display radius_server_profiles list
      ansible.builtin.debug:
        var: list_result.radius_server_profiles


    - name: Delete the radius_server_profile object
      paloaltonetworks.scm.scm_radius_server_profile:
        state: absent
        name: "example-radius_server_profile"
        folder: "Shared"

