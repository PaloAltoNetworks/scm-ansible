---
# Example playbook for paloaltonetworks.scm.scm_local_user
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_local_user.yml
#

- name: Manage local_users in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create local_user
      paloaltonetworks.scm.scm_local_user:
        state: present
        name: "ansible-test-local_user"
        folder: "All"
        password: "TestPass123!"
      register: create_result

    - name: Show created local_user
      ansible.builtin.debug:
        var: create_result.local_user

    # ── Update ──────────────────────────────────────────────
    - name: Update local_user
      paloaltonetworks.scm.scm_local_user:
        state: present
        name: "ansible-test-local_user"
        description: "Updated by Ansible"
        folder: "All"
        password: "TestPass123!"
      register: update_result

    - name: Show updated local_user
      ansible.builtin.debug:
        var: update_result.local_user

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get local_user by name
      paloaltonetworks.scm.scm_local_user:
        state: gathered
        name: "ansible-test-local_user"
        folder: "All"
      register: gathered_result

    - name: Show gathered local_user
      ansible.builtin.debug:
        var: gathered_result.local_user

    # ── Get by name (info module) ───────────────────────────
    - name: Get local_user by name (info module)
      paloaltonetworks.scm.scm_local_user_info:
        name: "ansible-test-local_user"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.local_users

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get local_user by ID (info module)
      paloaltonetworks.scm.scm_local_user_info:
        id: "{{ gathered_result.local_user.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.local_users

    # ── List all ────────────────────────────────────────────
    - name: List all local_users
      paloaltonetworks.scm.scm_local_user_info:
        folder: "All"
      register: list_result

    - name: Show local_users count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} local_users"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete local_user
      paloaltonetworks.scm.scm_local_user:
        state: absent
        name: "ansible-test-local_user"
        folder: "All"

