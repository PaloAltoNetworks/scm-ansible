---
# Example playbook for paloaltonetworks.scm.scm_bandwidth_allocation
#
# Demonstrates: create, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_bandwidth_allocation.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_bandwidth_allocation' for full parameter docs.

- name: Manage bandwidth_allocations in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create bandwidth_allocation
      paloaltonetworks.scm.scm_bandwidth_allocation:
        state: present
        name: "ansible-test-bandwidth_allocation"
        # allocated_bandwidth: <required>
      register: create_result

    - name: Show created bandwidth_allocation
      ansible.builtin.debug:
        var: create_result.bandwidth_allocation

    # ── List all ────────────────────────────────────────────
    - name: List all bandwidth_allocations
      paloaltonetworks.scm.scm_bandwidth_allocation_info:
      register: list_result

    - name: Show bandwidth_allocations count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} bandwidth_allocations"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete bandwidth_allocation
      paloaltonetworks.scm.scm_bandwidth_allocation:
        state: absent
        name: "ansible-test-bandwidth_allocation"

