---
# Example playbook for paloaltonetworks.scm.scm_session_timeouts_setting
#
# Demonstrates: create, update, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_session_timeouts_setting.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_session_timeouts_setting' for full parameter docs.

- name: Manage session_timeouts_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create session_timeouts_setting
      paloaltonetworks.scm.scm_session_timeouts_setting:
        state: present
        name: "ansible-test-session_timeouts_setting"
        folder: "All"
      register: create_result

    - name: Show created session_timeouts_setting
      ansible.builtin.debug:
        var: create_result.session_timeouts_setting

    # ── Update ──────────────────────────────────────────────
    - name: Update session_timeouts_setting
      paloaltonetworks.scm.scm_session_timeouts_setting:
        state: present
        name: "ansible-test-session_timeouts_setting"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated session_timeouts_setting
      ansible.builtin.debug:
        var: update_result.session_timeouts_setting

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get session_timeouts_setting by ID (info module)
      paloaltonetworks.scm.scm_session_timeouts_setting_info:
        id: "your-object-uuid-here"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.session_timeouts_settings

    # ── List all ────────────────────────────────────────────
    - name: List all session_timeouts_settings
      paloaltonetworks.scm.scm_session_timeouts_setting_info:
        folder: "All"
      register: list_result

    - name: Show session_timeouts_settings count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} session_timeouts_settings"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete session_timeouts_setting
      paloaltonetworks.scm.scm_session_timeouts_setting:
        state: absent
        name: "ansible-test-session_timeouts_setting"
        folder: "All"

