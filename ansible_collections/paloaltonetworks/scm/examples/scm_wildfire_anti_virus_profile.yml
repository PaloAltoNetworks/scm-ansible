---
# Example playbook for paloaltonetworks.scm.scm_wildfire_anti_virus_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_wildfire_anti_virus_profile.yml

- name: Manage wildfire_anti_virus_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a wildfire_anti_virus_profile object
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: present
        name: "example-wildfire_anti_virus_profile"
        folder: "Shared"
      register: create_result

    - name: Display created wildfire_anti_virus_profile
      ansible.builtin.debug:
        var: create_result.wildfire_anti_virus_profile

    - name: Gather information about a wildfire_anti_virus_profile object
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: gathered
        name: "example-wildfire_anti_virus_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered wildfire_anti_virus_profile
      ansible.builtin.debug:
        var: gather_result.wildfire_anti_virus_profile

    - name: List all wildfire_anti_virus_profiles in a folder
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display wildfire_anti_virus_profiles list
      ansible.builtin.debug:
        var: list_result.wildfire_anti_virus_profiles


    - name: Delete the wildfire_anti_virus_profile object
      paloaltonetworks.scm.scm_wildfire_anti_virus_profile:
        state: absent
        name: "example-wildfire_anti_virus_profile"
        folder: "Shared"

