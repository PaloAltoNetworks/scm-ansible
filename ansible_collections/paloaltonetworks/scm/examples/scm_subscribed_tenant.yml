---
# Example playbook for paloaltonetworks.scm.scm_subscribed_tenant
#
# Demonstrates: create, delete
#
# INFRA_DEP: This resource requires a real snippet's UUID and name to subscribe
#            to. Replace snippet_id and snippet_name with actual values from your
#            SCM environment. The API may also restrict which tenants can subscribe
#            to which snippets based on sharing permissions.
#
# NOTE: subscribed_tenant has no name field. It is identified by ID (returned
#       after creation). Required fields are snippet_id and snippet_name.
#       Delete uses the record ID, not a name.
#
# KNOWN LIMITATION: The underlying API model (AddSubscriberRequestPayloadInner)
#       also requires a tsg_id body field alongside snippet_id and snippet_name.
#       This field is not exposed in the Ansible module argument_spec. As a result,
#       create operations will fail with a validation error. This requires a fix
#       in the generator to add tsg_id to PARAM_TO_FIELD for this resource.
#
# NOTE: The scm_subscribed_tenant_info list operation requires a specific snippet
#       ID and is not supported for general listing in this module.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_subscribed_tenant.yml

- name: Manage subscribed_tenants in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Replace these with actual snippet values from your SCM environment
    target_snippet_id: "00000000-0000-0000-0000-000000000001"
    target_snippet_name: "your-shared-snippet-name"

  tasks:

    # ── Create ──────────────────────────────────────────────
    # Both snippet_id and snippet_name are required. The snippet must exist and
    # be shared with your tenant for this operation to succeed.
    # Note: Currently fails due to missing tsg_id in module argument_spec.
    - name: Subscribe tenant to a snippet
      paloaltonetworks.scm.scm_subscribed_tenant:
        state: present
        snippet_id: "{{ target_snippet_id }}"
        snippet_name: "{{ target_snippet_name }}"
      register: create_result
      ignore_errors: true

    - name: Show created subscribed_tenant
      ansible.builtin.debug:
        var: create_result

    # ── Delete ──────────────────────────────────────────────
    # Delete requires the record ID returned from create, not a name.
    - name: Delete subscribed_tenant by ID
      paloaltonetworks.scm.scm_subscribed_tenant:
        state: absent
        id: "{{ create_result.subscribed_tenant.id }}"
      when:
        - create_result is not failed
        - create_result.subscribed_tenant is defined
        - create_result.subscribed_tenant.id is defined
      ignore_errors: true
