---
# Example playbook for paloaltonetworks.scm.scm_authentication_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_authentication_profile.yml

- name: Manage authentication_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a authentication_profile object
      paloaltonetworks.scm.scm_authentication_profile:
        state: present
        name: "example-authentication_profile"
        folder: "Shared"
      register: create_result

    - name: Display created authentication_profile
      ansible.builtin.debug:
        var: create_result.authentication_profile

    - name: Gather information about a authentication_profile object
      paloaltonetworks.scm.scm_authentication_profile:
        state: gathered
        name: "example-authentication_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered authentication_profile
      ansible.builtin.debug:
        var: gather_result.authentication_profile

    - name: List all authentication_profiles in a folder
      paloaltonetworks.scm.scm_authentication_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display authentication_profiles list
      ansible.builtin.debug:
        var: list_result.authentication_profiles


    - name: Delete the authentication_profile object
      paloaltonetworks.scm.scm_authentication_profile:
        state: absent
        name: "example-authentication_profile"
        folder: "Shared"

