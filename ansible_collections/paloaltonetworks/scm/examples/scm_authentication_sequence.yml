---
# Example playbook for paloaltonetworks.scm.scm_authentication_sequence
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_authentication_sequence.yml
#

- name: Manage authentication_sequences in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create authentication_sequence
      paloaltonetworks.scm.scm_authentication_sequence:
        state: present
        name: "ansible-test-authentication_sequence"
        folder: "All"
        authentication_profiles: ["<Attribute(value=Name(id='TestAuthenticationSequencesLifecycle', ctx=Load()), attr='_profile_name', ctx=Load())>"]
        use_domain_find_profile: false
      register: create_result

    - name: Show created authentication_sequence
      ansible.builtin.debug:
        var: create_result.authentication_sequence

    # ── Update ──────────────────────────────────────────────
    - name: Update authentication_sequence
      paloaltonetworks.scm.scm_authentication_sequence:
        state: present
        name: "ansible-test-authentication_sequence"
        description: "Updated by Ansible"
        folder: "All"
        authentication_profiles: ["<Attribute(value=Name(id='TestAuthenticationSequencesLifecycle', ctx=Load()), attr='_profile_name', ctx=Load())>"]
        use_domain_find_profile: false
      register: update_result

    - name: Show updated authentication_sequence
      ansible.builtin.debug:
        var: update_result.authentication_sequence

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get authentication_sequence by name
      paloaltonetworks.scm.scm_authentication_sequence:
        state: gathered
        name: "ansible-test-authentication_sequence"
        folder: "All"
      register: gathered_result

    - name: Show gathered authentication_sequence
      ansible.builtin.debug:
        var: gathered_result.authentication_sequence

    # ── Get by name (info module) ───────────────────────────
    - name: Get authentication_sequence by name (info module)
      paloaltonetworks.scm.scm_authentication_sequence_info:
        name: "ansible-test-authentication_sequence"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.authentication_sequences

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get authentication_sequence by ID (info module)
      paloaltonetworks.scm.scm_authentication_sequence_info:
        id: "{{ gathered_result.authentication_sequence.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.authentication_sequences

    # ── List all ────────────────────────────────────────────
    - name: List all authentication_sequences
      paloaltonetworks.scm.scm_authentication_sequence_info:
        folder: "All"
      register: list_result

    - name: Show authentication_sequences count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} authentication_sequences"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete authentication_sequence
      paloaltonetworks.scm.scm_authentication_sequence:
        state: absent
        name: "ansible-test-authentication_sequence"
        folder: "All"

