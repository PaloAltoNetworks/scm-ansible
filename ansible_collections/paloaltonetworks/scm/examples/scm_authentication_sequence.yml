---
# Example playbook for paloaltonetworks.scm.scm_authentication_sequence
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_authentication_sequence.yml

- name: Manage authentication_sequences in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a authentication_sequence object
      paloaltonetworks.scm.scm_authentication_sequence:
        state: present
        name: "example-authentication_sequence"
        folder: "Shared"
      register: create_result

    - name: Display created authentication_sequence
      ansible.builtin.debug:
        var: create_result.authentication_sequence

    - name: Gather information about a authentication_sequence object
      paloaltonetworks.scm.scm_authentication_sequence:
        state: gathered
        name: "example-authentication_sequence"
        folder: "Shared"
      register: gather_result

    - name: Display gathered authentication_sequence
      ansible.builtin.debug:
        var: gather_result.authentication_sequence

    - name: List all authentication_sequences in a folder
      paloaltonetworks.scm.scm_authentication_sequence_info:
        folder: "Shared"
      register: list_result

    - name: Display authentication_sequences list
      ansible.builtin.debug:
        var: list_result.authentication_sequences


    - name: Delete the authentication_sequence object
      paloaltonetworks.scm.scm_authentication_sequence:
        state: absent
        name: "example-authentication_sequence"
        folder: "Shared"

