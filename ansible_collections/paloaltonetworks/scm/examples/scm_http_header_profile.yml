---
# Example playbook for paloaltonetworks.scm.scm_http_header_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_http_header_profile.yml
#

- name: Manage http_header_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create http_header_profile
      paloaltonetworks.scm.scm_http_header_profile:
        state: present
        name: "ansible-test-http_header_profile"
        folder: "All"
        description: "Created by Ansible"
      register: create_result

    - name: Show created http_header_profile
      ansible.builtin.debug:
        var: create_result.http_header_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update http_header_profile
      paloaltonetworks.scm.scm_http_header_profile:
        state: present
        name: "ansible-test-http_header_profile"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated http_header_profile
      ansible.builtin.debug:
        var: update_result.http_header_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get http_header_profile by name
      paloaltonetworks.scm.scm_http_header_profile:
        state: gathered
        name: "ansible-test-http_header_profile"
        folder: "All"
      register: gathered_result

    - name: Show gathered http_header_profile
      ansible.builtin.debug:
        var: gathered_result.http_header_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get http_header_profile by name (info module)
      paloaltonetworks.scm.scm_http_header_profile_info:
        name: "ansible-test-http_header_profile"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.http_header_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get http_header_profile by ID (info module)
      paloaltonetworks.scm.scm_http_header_profile_info:
        id: "{{ gathered_result.http_header_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.http_header_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all http_header_profiles
      paloaltonetworks.scm.scm_http_header_profile_info:
        folder: "All"
      register: list_result

    - name: Show http_header_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} http_header_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete http_header_profile
      paloaltonetworks.scm.scm_http_header_profile:
        state: absent
        name: "ansible-test-http_header_profile"
        folder: "All"

