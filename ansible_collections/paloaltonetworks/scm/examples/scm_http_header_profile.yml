---
# Example playbook for paloaltonetworks.scm.scm_http_header_profile
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_http_header_profile.yml

- name: Manage http_header_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a http_header_profile object
      paloaltonetworks.scm.scm_http_header_profile:
        state: present
        name: "example-http_header_profile"
        folder: "Shared"
      register: create_result

    - name: Display created http_header_profile
      ansible.builtin.debug:
        var: create_result.http_header_profile

    - name: Gather information about a http_header_profile object
      paloaltonetworks.scm.scm_http_header_profile:
        state: gathered
        name: "example-http_header_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered http_header_profile
      ansible.builtin.debug:
        var: gather_result.http_header_profile

    - name: List all http_header_profiles in a folder
      paloaltonetworks.scm.scm_http_header_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display http_header_profiles list
      ansible.builtin.debug:
        var: list_result.http_header_profiles


    - name: Delete the http_header_profile object
      paloaltonetworks.scm.scm_http_header_profile:
        state: absent
        name: "example-http_header_profile"
        folder: "Shared"

