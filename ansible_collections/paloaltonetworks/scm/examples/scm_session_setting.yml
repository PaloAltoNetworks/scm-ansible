---
# Example playbook for paloaltonetworks.scm.scm_session_setting
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_session_setting.yml

- name: Manage session_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a session_setting object
      paloaltonetworks.scm.scm_session_setting:
        state: present
        name: "example-session_setting"
        folder: "Shared"
      register: create_result

    - name: Display created session_setting
      ansible.builtin.debug:
        var: create_result.session_setting

    - name: Gather information about a session_setting object
      paloaltonetworks.scm.scm_session_setting:
        state: gathered
        name: "example-session_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered session_setting
      ansible.builtin.debug:
        var: gather_result.session_setting

    - name: List all session_settings in a folder
      paloaltonetworks.scm.scm_session_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display session_settings list
      ansible.builtin.debug:
        var: list_result.session_settings


    - name: Delete the session_setting object
      paloaltonetworks.scm.scm_session_setting:
        state: absent
        name: "example-session_setting"
        folder: "Shared"

