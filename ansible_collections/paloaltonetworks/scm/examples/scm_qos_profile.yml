---
# Example playbook for paloaltonetworks.scm.scm_qos_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_qos_profile.yml

- name: Manage qos_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a qos_profile object
      paloaltonetworks.scm.scm_qos_profile:
        state: present
        name: "example-qos_profile"
        folder: "Shared"
      register: create_result

    - name: Display created qos_profile
      ansible.builtin.debug:
        var: create_result.qos_profile

    - name: Gather information about a qos_profile object
      paloaltonetworks.scm.scm_qos_profile:
        state: gathered
        name: "example-qos_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered qos_profile
      ansible.builtin.debug:
        var: gather_result.qos_profile

    - name: List all qos_profiles in a folder
      paloaltonetworks.scm.scm_qos_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display qos_profiles list
      ansible.builtin.debug:
        var: list_result.qos_profiles


    - name: Delete the qos_profile object
      paloaltonetworks.scm.scm_qos_profile:
        state: absent
        name: "example-qos_profile"
        folder: "Shared"

