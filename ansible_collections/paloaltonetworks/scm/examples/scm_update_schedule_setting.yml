---
# Example playbook for paloaltonetworks.scm.scm_update_schedule_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_update_schedule_setting.yml

- name: Manage update_schedule_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a update_schedule_setting object
      paloaltonetworks.scm.scm_update_schedule_setting:
        state: present
        name: "example-update_schedule_setting"
        folder: "Shared"
      register: create_result

    - name: Display created update_schedule_setting
      ansible.builtin.debug:
        var: create_result.update_schedule_setting

    - name: Gather information about a update_schedule_setting object
      paloaltonetworks.scm.scm_update_schedule_setting:
        state: gathered
        name: "example-update_schedule_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered update_schedule_setting
      ansible.builtin.debug:
        var: gather_result.update_schedule_setting

    - name: List all update_schedule_settings in a folder
      paloaltonetworks.scm.scm_update_schedule_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display update_schedule_settings list
      ansible.builtin.debug:
        var: list_result.update_schedule_settings


    - name: Delete the update_schedule_setting object
      paloaltonetworks.scm.scm_update_schedule_setting:
        state: absent
        name: "example-update_schedule_setting"
        folder: "Shared"

