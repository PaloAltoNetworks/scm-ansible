---
# Example playbook for paloaltonetworks.scm.scm_vpn_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_vpn_setting.yml

- name: Manage vpn_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a vpn_setting object
      paloaltonetworks.scm.scm_vpn_setting:
        state: present
        name: "example-vpn_setting"
        folder: "Shared"
      register: create_result

    - name: Display created vpn_setting
      ansible.builtin.debug:
        var: create_result.vpn_setting

    - name: Gather information about a vpn_setting object
      paloaltonetworks.scm.scm_vpn_setting:
        state: gathered
        name: "example-vpn_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered vpn_setting
      ansible.builtin.debug:
        var: gather_result.vpn_setting

    - name: List all vpn_settings in a folder
      paloaltonetworks.scm.scm_vpn_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display vpn_settings list
      ansible.builtin.debug:
        var: list_result.vpn_settings


    - name: Delete the vpn_setting object
      paloaltonetworks.scm.scm_vpn_setting:
        state: absent
        name: "example-vpn_setting"
        folder: "Shared"

