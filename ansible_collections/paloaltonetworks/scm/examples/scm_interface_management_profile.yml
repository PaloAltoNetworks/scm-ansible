---
# Example playbook for paloaltonetworks.scm.scm_interface_management_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_interface_management_profile.yml
#

- name: Manage interface_management_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create interface_management_profile
      paloaltonetworks.scm.scm_interface_management_profile:
        state: present
        name: "ansible-test-if-mgmt"
        folder: "All"
        ping: true
        ssh: true
        https: true
      register: create_result

    - name: Show created interface_management_profile
      ansible.builtin.debug:
        var: create_result.interface_management_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update interface_management_profile
      paloaltonetworks.scm.scm_interface_management_profile:
        state: present
        name: "ansible-test-if-mgmt"
        folder: "All"
        ping: true
        ssh: true
        https: true
        http: false
      register: update_result

    - name: Show updated interface_management_profile
      ansible.builtin.debug:
        var: update_result.interface_management_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get interface_management_profile by name
      paloaltonetworks.scm.scm_interface_management_profile:
        state: gathered
        name: "ansible-test-if-mgmt"
        folder: "All"
      register: gathered_result

    - name: Show gathered interface_management_profile
      ansible.builtin.debug:
        var: gathered_result.interface_management_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get interface_management_profile by name (info module)
      paloaltonetworks.scm.scm_interface_management_profile_info:
        name: "ansible-test-if-mgmt"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.interface_management_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get interface_management_profile by ID (info module)
      paloaltonetworks.scm.scm_interface_management_profile_info:
        id: "{{ gathered_result.interface_management_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.interface_management_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all interface_management_profiles
      paloaltonetworks.scm.scm_interface_management_profile_info:
        folder: "All"
      register: list_result

    - name: Show interface_management_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} interface_management_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete interface_management_profile
      paloaltonetworks.scm.scm_interface_management_profile:
        state: absent
        name: "ansible-test-if-mgmt"
        folder: "All"
