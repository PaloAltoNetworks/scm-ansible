---
# Example playbook for paloaltonetworks.scm.scm_ike_gateway
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_ike_gateway.yml

- name: Manage ike_gateways in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a ike_gateway object
      paloaltonetworks.scm.scm_ike_gateway:
        state: present
        name: "example-ike_gateway"
        folder: "Shared"
      register: create_result

    - name: Display created ike_gateway
      ansible.builtin.debug:
        var: create_result.ike_gateway

    - name: Gather information about a ike_gateway object
      paloaltonetworks.scm.scm_ike_gateway:
        state: gathered
        name: "example-ike_gateway"
        folder: "Shared"
      register: gather_result

    - name: Display gathered ike_gateway
      ansible.builtin.debug:
        var: gather_result.ike_gateway

    - name: List all ike_gateways in a folder
      paloaltonetworks.scm.scm_ike_gateway_info:
        folder: "Shared"
      register: list_result

    - name: Display ike_gateways list
      ansible.builtin.debug:
        var: list_result.ike_gateways


    - name: Delete the ike_gateway object
      paloaltonetworks.scm.scm_ike_gateway:
        state: absent
        name: "example-ike_gateway"
        folder: "Shared"

