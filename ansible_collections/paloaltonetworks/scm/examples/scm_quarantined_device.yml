---
# Example playbook for paloaltonetworks.scm.scm_quarantined_device
#
# Demonstrates: create, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_quarantined_device.yml
#
# NOTE: This resource uses host_id (not name) as the unique identifier.
#       The module has known bugs:
#         1. required_if references 'name' which is not in module_args (MODULE_BUG)
#         2. delete calls api.delete_quarantined_devices(id=...) but SDK requires host_id (MODULE_BUG)
#       Replace host_id with the actual device host ID from your environment.

- name: Manage quarantined_devices in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    # NOTE: host_id is required. Use the actual host ID of the device to quarantine.
    - name: Create quarantined_device
      paloaltonetworks.scm.scm_quarantined_device:
        state: present
        host_id: "your-device-host-id"
        serial_number: "your-device-serial"
      register: create_result

    - name: Show created quarantined_device
      ansible.builtin.debug:
        var: create_result.quarantined_device

    # ── List all ────────────────────────────────────────────
    - name: List all quarantined_devices
      paloaltonetworks.scm.scm_quarantined_device_info:
      register: list_result

    - name: Show quarantined_devices count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} quarantined_devices"

    # ── Delete ──────────────────────────────────────────────
    # NOTE: Delete uses host_id as the identifier (not name or id UUID)
    - name: Delete quarantined_device
      paloaltonetworks.scm.scm_quarantined_device:
        state: absent
        host_id: "your-device-host-id"
