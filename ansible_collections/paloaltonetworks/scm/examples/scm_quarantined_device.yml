---
# Example playbook for paloaltonetworks.scm.scm_quarantined_device
#
# Demonstrates: create, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_quarantined_device.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_quarantined_device' for full parameter docs.

- name: Manage quarantined_devices in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create quarantined_device
      paloaltonetworks.scm.scm_quarantined_device:
        state: present
        name: "ansible-test-quarantined_device"
        # host_id: <required>
      register: create_result

    - name: Show created quarantined_device
      ansible.builtin.debug:
        var: create_result.quarantined_device

    # ── List all ────────────────────────────────────────────
    - name: List all quarantined_devices
      paloaltonetworks.scm.scm_quarantined_device_info:
      register: list_result

    - name: Show quarantined_devices count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} quarantined_devices"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete quarantined_device
      paloaltonetworks.scm.scm_quarantined_device:
        state: absent
        name: "ansible-test-quarantined_device"

