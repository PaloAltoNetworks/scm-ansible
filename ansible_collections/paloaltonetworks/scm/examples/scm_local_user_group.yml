---
# Example playbook for paloaltonetworks.scm.scm_local_user_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_local_user_group.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_local_user_group' for full parameter docs.

- name: Manage local_user_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create local_user_group
      paloaltonetworks.scm.scm_local_user_group:
        state: present
        name: "ansible-test-lusergrp"
        folder: "Prisma Access"
      register: create_result

    - name: Show created local_user_group
      ansible.builtin.debug:
        var: create_result.local_user_group

    # ── Update ──────────────────────────────────────────────
    - name: Update local_user_group
      paloaltonetworks.scm.scm_local_user_group:
        state: present
        name: "ansible-test-lusergrp"
        folder: "Prisma Access"
      register: update_result

    - name: Show updated local_user_group
      ansible.builtin.debug:
        var: update_result.local_user_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get local_user_group by name
      paloaltonetworks.scm.scm_local_user_group:
        state: gathered
        name: "ansible-test-lusergrp"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered local_user_group
      ansible.builtin.debug:
        var: gathered_result.local_user_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get local_user_group by name (info module)
      paloaltonetworks.scm.scm_local_user_group_info:
        name: "ansible-test-lusergrp"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.local_user_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get local_user_group by ID (info module)
      paloaltonetworks.scm.scm_local_user_group_info:
        id: "{{ gathered_result.local_user_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.local_user_groups

    # ── List all ────────────────────────────────────────────
    - name: List all local_user_groups
      paloaltonetworks.scm.scm_local_user_group_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show local_user_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} local_user_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete local_user_group
      paloaltonetworks.scm.scm_local_user_group:
        state: absent
        name: "ansible-test-lusergrp"
        folder: "Prisma Access"

