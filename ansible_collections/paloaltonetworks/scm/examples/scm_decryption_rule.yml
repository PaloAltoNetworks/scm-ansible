---
# Example playbook for paloaltonetworks.scm.scm_decryption_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# NOTE: Decryption rules use 'var_from' instead of 'from' (Python reserved word).
#       Many fields are required=True and must be provided even for gathered/absent states.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_decryption_rule.yml
#

- name: Manage decryption_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: present
        name: "ansible-test-decreule"
        folder: "All"
        action: "no-decrypt"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "any"
        destination:
          - "any"
        category:
          - "any"
        service:
          - "any"
        source_user:
          - "any"
        type:
          ssl_forward_proxy: {}
      register: create_result

    - name: Show created decryption_rule
      ansible.builtin.debug:
        var: create_result.decryption_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: present
        name: "ansible-test-decreule"
        folder: "All"
        description: "Updated by Ansible"
        action: "no-decrypt"
        var_from:
          - "any"
        to:
          - "any"
        source:
          - "10.0.0.0/8"
        destination:
          - "192.168.0.0/16"
        category:
          - "any"
        service:
          - "any"
        source_user:
          - "any"
        type:
          ssl_forward_proxy: {}
      register: update_result

    - name: Show updated decryption_rule
      ansible.builtin.debug:
        var: update_result.decryption_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get decryption_rule by name
      paloaltonetworks.scm.scm_decryption_rule:
        state: gathered
        name: "ansible-test-decreule"
        folder: "All"
        action: "no-decrypt"
        category:
          - "any"
        destination:
          - "any"
        service:
          - "any"
        source:
          - "any"
        source_user:
          - "any"
        to:
          - "any"
        var_from:
          - "any"
      register: gathered_result

    - name: Show gathered decryption_rule
      ansible.builtin.debug:
        var: gathered_result.decryption_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get decryption_rule by name (info module)
      paloaltonetworks.scm.scm_decryption_rule_info:
        name: "ansible-test-decreule"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.decryption_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get decryption_rule by ID (info module)
      paloaltonetworks.scm.scm_decryption_rule_info:
        id: "{{ gathered_result.decryption_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.decryption_rules

    # ── List all ────────────────────────────────────────────
    - name: List all decryption_rules
      paloaltonetworks.scm.scm_decryption_rule_info:
        folder: "All"
      register: list_result

    - name: Show decryption_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} decryption_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete decryption_rule
      paloaltonetworks.scm.scm_decryption_rule:
        state: absent
        name: "ansible-test-decreule"
        folder: "All"
        action: "no-decrypt"
        category:
          - "any"
        destination:
          - "any"
        service:
          - "any"
        source:
          - "any"
        source_user:
          - "any"
        to:
          - "any"
        var_from:
          - "any"
