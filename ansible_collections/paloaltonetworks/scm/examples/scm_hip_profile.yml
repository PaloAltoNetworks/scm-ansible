---
# Example playbook for paloaltonetworks.scm.scm_hip_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_hip_profile.yml
#

- name: Manage hip_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create hip_profile
      paloaltonetworks.scm.scm_hip_profile:
        state: present
        name: "ansible-test-hipprof"
        folder: "Prisma Access"
        description: "Created by Ansible"
        match: '"is-win" and "is-anti-malware-and-rtp-enabled"'
      register: create_result

    - name: Show created hip_profile
      ansible.builtin.debug:
        var: create_result.hip_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update hip_profile
      paloaltonetworks.scm.scm_hip_profile:
        state: present
        name: "ansible-test-hipprof"
        folder: "Prisma Access"
        description: "Updated by Ansible"
        match: '"is-win"'
      register: update_result

    - name: Show updated hip_profile
      ansible.builtin.debug:
        var: update_result.hip_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get hip_profile by name
      paloaltonetworks.scm.scm_hip_profile:
        state: gathered
        name: "ansible-test-hipprof"
        folder: "Prisma Access"
        match: "placeholder"
      register: gathered_result

    - name: Show gathered hip_profile
      ansible.builtin.debug:
        var: gathered_result.hip_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get hip_profile by name (info module)
      paloaltonetworks.scm.scm_hip_profile_info:
        name: "ansible-test-hipprof"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.hip_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get hip_profile by ID (info module)
      paloaltonetworks.scm.scm_hip_profile_info:
        id: "{{ gathered_result.hip_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.hip_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all hip_profiles
      paloaltonetworks.scm.scm_hip_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show hip_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} hip_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete hip_profile
      paloaltonetworks.scm.scm_hip_profile:
        state: absent
        name: "ansible-test-hipprof"
        folder: "Prisma Access"
        match: "placeholder"
