---
# Example playbook for paloaltonetworks.scm.scm_hip_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_hip_profile.yml

- name: Manage hip_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a hip_profile object
      paloaltonetworks.scm.scm_hip_profile:
        state: present
        name: "example-hip_profile"
        folder: "Shared"
      register: create_result

    - name: Display created hip_profile
      ansible.builtin.debug:
        var: create_result.hip_profile

    - name: Gather information about a hip_profile object
      paloaltonetworks.scm.scm_hip_profile:
        state: gathered
        name: "example-hip_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered hip_profile
      ansible.builtin.debug:
        var: gather_result.hip_profile

    - name: List all hip_profiles in a folder
      paloaltonetworks.scm.scm_hip_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display hip_profiles list
      ansible.builtin.debug:
        var: list_result.hip_profiles


    - name: Delete the hip_profile object
      paloaltonetworks.scm.scm_hip_profile:
        state: absent
        name: "example-hip_profile"
        folder: "Shared"

