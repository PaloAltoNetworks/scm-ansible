---
# Example playbook for paloaltonetworks.scm.scm_folder
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_folder.yml
#

- name: Manage folders in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create folder
      paloaltonetworks.scm.scm_folder:
        state: present
        name: "ansible-test-folder"
        parent: "All"
        description: "Created by Ansible"
      register: create_result

    - name: Show created folder
      ansible.builtin.debug:
        var: create_result.folder

    # ── Update ──────────────────────────────────────────────
    - name: Update folder
      paloaltonetworks.scm.scm_folder:
        state: present
        name: "ansible-test-folder"
        description: "Updated by Ansible"
        parent: "All"
      register: update_result

    - name: Show updated folder
      ansible.builtin.debug:
        var: update_result.folder

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get folder by name
      paloaltonetworks.scm.scm_folder:
        state: gathered
        name: "ansible-test-folder"
      register: gathered_result

    - name: Show gathered folder
      ansible.builtin.debug:
        var: gathered_result.folder

    # ── Get by name (info module) ───────────────────────────
    - name: Get folder by name (info module)
      paloaltonetworks.scm.scm_folder_info:
        name: "ansible-test-folder"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.folders

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get folder by ID (info module)
      paloaltonetworks.scm.scm_folder_info:
        id: "{{ gathered_result.folder.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.folders

    # ── List all ────────────────────────────────────────────
    - name: List all folders
      paloaltonetworks.scm.scm_folder_info:
      register: list_result

    - name: Show folders count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} folders"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete folder
      paloaltonetworks.scm.scm_folder:
        state: absent
        name: "ansible-test-folder"

