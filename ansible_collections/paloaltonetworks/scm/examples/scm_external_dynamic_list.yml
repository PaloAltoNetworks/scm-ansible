---
# Example playbook for paloaltonetworks.scm.scm_external_dynamic_list
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_external_dynamic_list.yml

- name: Manage external_dynamic_lists in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a external_dynamic_list object
      paloaltonetworks.scm.scm_external_dynamic_list:
        state: present
        name: "example-external_dynamic_list"
        folder: "Shared"
      register: create_result

    - name: Display created external_dynamic_list
      ansible.builtin.debug:
        var: create_result.external_dynamic_list

    - name: Gather information about a external_dynamic_list object
      paloaltonetworks.scm.scm_external_dynamic_list:
        state: gathered
        name: "example-external_dynamic_list"
        folder: "Shared"
      register: gather_result

    - name: Display gathered external_dynamic_list
      ansible.builtin.debug:
        var: gather_result.external_dynamic_list

    - name: List all external_dynamic_lists in a folder
      paloaltonetworks.scm.scm_external_dynamic_list_info:
        folder: "Shared"
      register: list_result

    - name: Display external_dynamic_lists list
      ansible.builtin.debug:
        var: list_result.external_dynamic_lists


    - name: Delete the external_dynamic_list object
      paloaltonetworks.scm.scm_external_dynamic_list:
        state: absent
        name: "example-external_dynamic_list"
        folder: "Shared"

