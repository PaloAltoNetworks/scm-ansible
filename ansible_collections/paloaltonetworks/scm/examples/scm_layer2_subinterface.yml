---
# Example playbook for paloaltonetworks.scm.scm_layer2_subinterface
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_layer2_subinterface.yml

- name: Manage layer2_subinterfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a layer2_subinterface object
      paloaltonetworks.scm.scm_layer2_subinterface:
        state: present
        name: "example-layer2_subinterface"
        folder: "Shared"
      register: create_result

    - name: Display created layer2_subinterface
      ansible.builtin.debug:
        var: create_result.layer2_subinterface

    - name: Gather information about a layer2_subinterface object
      paloaltonetworks.scm.scm_layer2_subinterface:
        state: gathered
        name: "example-layer2_subinterface"
        folder: "Shared"
      register: gather_result

    - name: Display gathered layer2_subinterface
      ansible.builtin.debug:
        var: gather_result.layer2_subinterface

    - name: List all layer2_subinterfaces in a folder
      paloaltonetworks.scm.scm_layer2_subinterface_info:
        folder: "Shared"
      register: list_result

    - name: Display layer2_subinterfaces list
      ansible.builtin.debug:
        var: list_result.layer2_subinterfaces


    - name: Delete the layer2_subinterface object
      paloaltonetworks.scm.scm_layer2_subinterface:
        state: absent
        name: "example-layer2_subinterface"
        folder: "Shared"

