---
# Example playbook for paloaltonetworks.scm.scm_certificate
#
# Demonstrates: create, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_certificate.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_certificate' for full parameter docs.

- name: Manage certificates in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create certificate
      paloaltonetworks.scm.scm_certificate:
        state: present
        name: "ansible-test-certificate"
        folder: "All"
        # algorithm: <required>
        # certificate_name: <required>
        # common_name: <required>
        # digest: <required>
        # signed_by: <required>
      register: create_result

    - name: Show created certificate
      ansible.builtin.debug:
        var: create_result.certificate

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get certificate by name
      paloaltonetworks.scm.scm_certificate:
        state: gathered
        name: "ansible-test-certificate"
        folder: "All"
      register: gathered_result

    - name: Show gathered certificate
      ansible.builtin.debug:
        var: gathered_result.certificate

    # ── Get by name (info module) ───────────────────────────
    - name: Get certificate by name (info module)
      paloaltonetworks.scm.scm_certificate_info:
        name: "ansible-test-certificate"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.certificates

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get certificate by ID (info module)
      paloaltonetworks.scm.scm_certificate_info:
        id: "{{ gathered_result.certificate.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.certificates

    # ── List all ────────────────────────────────────────────
    - name: List all certificates
      paloaltonetworks.scm.scm_certificate_info:
        folder: "All"
      register: list_result

    - name: Show certificates count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} certificates"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete certificate
      paloaltonetworks.scm.scm_certificate:
        state: absent
        name: "ansible-test-certificate"
        folder: "All"

