---
# Example playbook for paloaltonetworks.scm.scm_tcp_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_tcp_setting.yml

- name: Manage tcp_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a tcp_setting object
      paloaltonetworks.scm.scm_tcp_setting:
        state: present
        name: "example-tcp_setting"
        folder: "Shared"
      register: create_result

    - name: Display created tcp_setting
      ansible.builtin.debug:
        var: create_result.tcp_setting

    - name: Gather information about a tcp_setting object
      paloaltonetworks.scm.scm_tcp_setting:
        state: gathered
        name: "example-tcp_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered tcp_setting
      ansible.builtin.debug:
        var: gather_result.tcp_setting

    - name: List all tcp_settings in a folder
      paloaltonetworks.scm.scm_tcp_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display tcp_settings list
      ansible.builtin.debug:
        var: list_result.tcp_settings


    - name: Delete the tcp_setting object
      paloaltonetworks.scm.scm_tcp_setting:
        state: absent
        name: "example-tcp_setting"
        folder: "Shared"

