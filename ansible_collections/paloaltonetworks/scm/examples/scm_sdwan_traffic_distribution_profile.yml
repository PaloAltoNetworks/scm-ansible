---
# Example playbook for paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_sdwan_traffic_distribution_profile.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile' for full parameter docs.

- name: Manage sdwan_traffic_distribution_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create sdwan_traffic_distribution_profile
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile:
        state: present
        name: "ansible-test-sdwan-tdp"
        folder: "All"
        link_tags: []
      register: create_result

    - name: Show created sdwan_traffic_distribution_profile
      ansible.builtin.debug:
        var: create_result.sdwan_traffic_distribution_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update sdwan_traffic_distribution_profile
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile:
        state: present
        name: "ansible-test-sdwan-tdp"
        folder: "All"
        link_tags: []
      register: update_result

    - name: Show updated sdwan_traffic_distribution_profile
      ansible.builtin.debug:
        var: update_result.sdwan_traffic_distribution_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get sdwan_traffic_distribution_profile by name
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile:
        state: gathered
        name: "ansible-test-sdwan-tdp"
        folder: "All"
        link_tags: []
      register: gathered_result

    - name: Show gathered sdwan_traffic_distribution_profile
      ansible.builtin.debug:
        var: gathered_result.sdwan_traffic_distribution_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get sdwan_traffic_distribution_profile by name (info module)
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile_info:
        name: "ansible-test-sdwan-tdp"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.sdwan_traffic_distribution_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get sdwan_traffic_distribution_profile by ID (info module)
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile_info:
        id: "{{ gathered_result.sdwan_traffic_distribution_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.sdwan_traffic_distribution_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all sdwan_traffic_distribution_profiles
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile_info:
        folder: "All"
      register: list_result

    - name: Show sdwan_traffic_distribution_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} sdwan_traffic_distribution_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete sdwan_traffic_distribution_profile
      paloaltonetworks.scm.scm_sdwan_traffic_distribution_profile:
        state: absent
        name: "ansible-test-sdwan-tdp"
        folder: "All"

