---
# Example playbook for paloaltonetworks.scm.scm_pbf_rule
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_pbf_rule.yml

- name: Manage pbf_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a pbf_rule object
      paloaltonetworks.scm.scm_pbf_rule:
        state: present
        name: "example-pbf_rule"
        folder: "Shared"
      register: create_result

    - name: Display created pbf_rule
      ansible.builtin.debug:
        var: create_result.pbf_rule

    - name: Gather information about a pbf_rule object
      paloaltonetworks.scm.scm_pbf_rule:
        state: gathered
        name: "example-pbf_rule"
        folder: "Shared"
      register: gather_result

    - name: Display gathered pbf_rule
      ansible.builtin.debug:
        var: gather_result.pbf_rule

    - name: List all pbf_rules in a folder
      paloaltonetworks.scm.scm_pbf_rule_info:
        folder: "Shared"
      register: list_result

    - name: Display pbf_rules list
      ansible.builtin.debug:
        var: list_result.pbf_rules


    - name: Delete the pbf_rule object
      paloaltonetworks.scm.scm_pbf_rule:
        state: absent
        name: "example-pbf_rule"
        folder: "Shared"

