---
# Example playbook for paloaltonetworks.scm.scm_schedule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_schedule.yml
#

- name: Manage schedules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create schedule
      paloaltonetworks.scm.scm_schedule:
        state: present
        name: "ansible-test-sched"
        folder: "Prisma Access"
        schedule_type:
          recurring:
            daily:
              - "00:00-23:59"
      register: create_result

    - name: Show created schedule
      ansible.builtin.debug:
        var: create_result.schedule

    # ── Update ──────────────────────────────────────────────
    - name: Update schedule
      paloaltonetworks.scm.scm_schedule:
        state: present
        name: "ansible-test-sched"
        folder: "Prisma Access"
        schedule_type:
          recurring:
            daily:
              - "08:00-17:00"
      register: update_result

    - name: Show updated schedule
      ansible.builtin.debug:
        var: update_result.schedule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get schedule by name
      paloaltonetworks.scm.scm_schedule:
        state: gathered
        name: "ansible-test-sched"
        folder: "Prisma Access"
        schedule_type: {}
      register: gathered_result

    - name: Show gathered schedule
      ansible.builtin.debug:
        var: gathered_result.schedule

    # ── Get by name (info module) ───────────────────────────
    - name: Get schedule by name (info module)
      paloaltonetworks.scm.scm_schedule_info:
        name: "ansible-test-sched"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.schedules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get schedule by ID (info module)
      paloaltonetworks.scm.scm_schedule_info:
        id: "{{ gathered_result.schedule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.schedules

    # ── List all ────────────────────────────────────────────
    - name: List all schedules
      paloaltonetworks.scm.scm_schedule_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show schedules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} schedules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete schedule
      paloaltonetworks.scm.scm_schedule:
        state: absent
        name: "ansible-test-sched"
        folder: "Prisma Access"
        schedule_type: {}
