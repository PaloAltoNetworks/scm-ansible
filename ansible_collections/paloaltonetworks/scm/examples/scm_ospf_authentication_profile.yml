---
# Example playbook for paloaltonetworks.scm.scm_ospf_authentication_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_ospf_authentication_profile.yml
#

- name: Manage ospf_authentication_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create ospf_authentication_profile
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: present
        name: "ansible-test-ospf_authentication_profile"
        folder: "All"
        password: "test123"
      register: create_result

    - name: Show created ospf_authentication_profile
      ansible.builtin.debug:
        var: create_result.ospf_authentication_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update ospf_authentication_profile
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: present
        name: "ansible-test-ospf_authentication_profile"
        description: "Updated by Ansible"
        folder: "All"
        password: "test123"
      register: update_result

    - name: Show updated ospf_authentication_profile
      ansible.builtin.debug:
        var: update_result.ospf_authentication_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get ospf_authentication_profile by name
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: gathered
        name: "ansible-test-ospf_authentication_profile"
        folder: "All"
      register: gathered_result

    - name: Show gathered ospf_authentication_profile
      ansible.builtin.debug:
        var: gathered_result.ospf_authentication_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get ospf_authentication_profile by name (info module)
      paloaltonetworks.scm.scm_ospf_authentication_profile_info:
        name: "ansible-test-ospf_authentication_profile"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.ospf_authentication_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get ospf_authentication_profile by ID (info module)
      paloaltonetworks.scm.scm_ospf_authentication_profile_info:
        id: "{{ gathered_result.ospf_authentication_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.ospf_authentication_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all ospf_authentication_profiles
      paloaltonetworks.scm.scm_ospf_authentication_profile_info:
        folder: "All"
      register: list_result

    - name: Show ospf_authentication_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} ospf_authentication_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete ospf_authentication_profile
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: absent
        name: "ansible-test-ospf_authentication_profile"
        folder: "All"

