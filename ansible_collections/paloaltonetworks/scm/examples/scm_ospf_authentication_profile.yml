---
# Example playbook for paloaltonetworks.scm.scm_ospf_authentication_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_ospf_authentication_profile.yml

- name: Manage ospf_authentication_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a ospf_authentication_profile object
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: present
        name: "example-ospf_authentication_profile"
        folder: "Shared"
      register: create_result

    - name: Display created ospf_authentication_profile
      ansible.builtin.debug:
        var: create_result.ospf_authentication_profile

    - name: Gather information about a ospf_authentication_profile object
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: gathered
        name: "example-ospf_authentication_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered ospf_authentication_profile
      ansible.builtin.debug:
        var: gather_result.ospf_authentication_profile

    - name: List all ospf_authentication_profiles in a folder
      paloaltonetworks.scm.scm_ospf_authentication_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display ospf_authentication_profiles list
      ansible.builtin.debug:
        var: list_result.ospf_authentication_profiles


    - name: Delete the ospf_authentication_profile object
      paloaltonetworks.scm.scm_ospf_authentication_profile:
        state: absent
        name: "example-ospf_authentication_profile"
        folder: "Shared"

