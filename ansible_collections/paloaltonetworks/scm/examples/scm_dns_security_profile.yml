---
# Example playbook for paloaltonetworks.scm.scm_dns_security_profile
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_dns_security_profile.yml

- name: Manage dns_security_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a dns_security_profile object
      paloaltonetworks.scm.scm_dns_security_profile:
        state: present
        name: "example-dns_security_profile"
        folder: "Shared"
      register: create_result

    - name: Display created dns_security_profile
      ansible.builtin.debug:
        var: create_result.dns_security_profile

    - name: Gather information about a dns_security_profile object
      paloaltonetworks.scm.scm_dns_security_profile:
        state: gathered
        name: "example-dns_security_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered dns_security_profile
      ansible.builtin.debug:
        var: gather_result.dns_security_profile

    - name: List all dns_security_profiles in a folder
      paloaltonetworks.scm.scm_dns_security_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display dns_security_profiles list
      ansible.builtin.debug:
        var: list_result.dns_security_profiles


    - name: Delete the dns_security_profile object
      paloaltonetworks.scm.scm_dns_security_profile:
        state: absent
        name: "example-dns_security_profile"
        folder: "Shared"

