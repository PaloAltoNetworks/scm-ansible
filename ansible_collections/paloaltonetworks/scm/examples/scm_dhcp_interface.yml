---
# Example playbook for paloaltonetworks.scm.scm_dhcp_interface
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_dhcp_interface.yml
#
# NOTE: A DHCP interface is a DHCP server/relay configuration that is bound
#       to an existing ethernet interface by name. The 'name' field must match
#       an existing ethernet interface name (which must start with '$').
#       Either 'server' or 'relay' configuration must be provided.
#       Run 'ansible-doc paloaltonetworks.scm.scm_dhcp_interface' for full parameter docs.

- name: Manage dhcp_interfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create prerequisite ethernet interface ───────────────
    # DHCP interface 'name' must reference an existing ethernet interface.
    - name: Create prerequisite ethernet interface for DHCP
      paloaltonetworks.scm.scm_ethernet_interface:
        state: present
        name: "$ansible-dhcp-eth"
        folder: "All"
        comment: "Ethernet interface for DHCP test"
        layer3: {}
      register: eth_result

    - name: Show created ethernet interface
      ansible.builtin.debug:
        var: eth_result.ethernet_interface

    # ── Create ──────────────────────────────────────────────
    # The DHCP interface name must match the ethernet interface name.
    # DHCP server mode requires either ip_pool or reserved configuration.
    - name: Create dhcp_interface
      paloaltonetworks.scm.scm_dhcp_interface:
        state: present
        name: "$ansible-dhcp-eth"
        folder: "All"
        server:
          mode: "auto"
          ip_pool:
            - "192.168.100.10-192.168.100.50"
          option:
            gateway: "192.168.100.1"
            subnet_mask: "255.255.255.0"
      register: create_result

    - name: Show created dhcp_interface
      ansible.builtin.debug:
        var: create_result.dhcp_interface

    # ── Update ──────────────────────────────────────────────
    - name: Update dhcp_interface
      paloaltonetworks.scm.scm_dhcp_interface:
        state: present
        name: "$ansible-dhcp-eth"
        folder: "All"
        server:
          mode: "auto"
          ip_pool:
            - "192.168.100.10-192.168.100.100"
          option:
            gateway: "192.168.100.1"
            subnet_mask: "255.255.255.0"
      register: update_result

    - name: Show updated dhcp_interface
      ansible.builtin.debug:
        var: update_result.dhcp_interface

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get dhcp_interface by name
      paloaltonetworks.scm.scm_dhcp_interface:
        state: gathered
        name: "$ansible-dhcp-eth"
        folder: "All"
      register: gathered_result

    - name: Show gathered dhcp_interface
      ansible.builtin.debug:
        var: gathered_result.dhcp_interface

    # ── Get by name (info module) ───────────────────────────
    - name: Get dhcp_interface by name (info module)
      paloaltonetworks.scm.scm_dhcp_interface_info:
        name: "$ansible-dhcp-eth"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.dhcp_interfaces

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get dhcp_interface by ID (info module)
      paloaltonetworks.scm.scm_dhcp_interface_info:
        id: "{{ gathered_result.dhcp_interface.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.dhcp_interfaces

    # ── List all ────────────────────────────────────────────
    - name: List all dhcp_interfaces
      paloaltonetworks.scm.scm_dhcp_interface_info:
        folder: "All"
      register: list_result

    - name: Show dhcp_interfaces count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} dhcp_interfaces"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete dhcp_interface
      paloaltonetworks.scm.scm_dhcp_interface:
        state: absent
        name: "$ansible-dhcp-eth"
        folder: "All"

    - name: Delete prerequisite ethernet interface
      paloaltonetworks.scm.scm_ethernet_interface:
        state: absent
        name: "$ansible-dhcp-eth"
        folder: "All"
