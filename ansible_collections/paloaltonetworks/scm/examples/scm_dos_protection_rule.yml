---
# Example playbook for paloaltonetworks.scm.scm_dos_protection_rule
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_dos_protection_rule.yml

- name: Manage dos_protection_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a dos_protection_rule object
      paloaltonetworks.scm.scm_dos_protection_rule:
        state: present
        name: "example-dos_protection_rule"
        folder: "Shared"
      register: create_result

    - name: Display created dos_protection_rule
      ansible.builtin.debug:
        var: create_result.dos_protection_rule

    - name: Gather information about a dos_protection_rule object
      paloaltonetworks.scm.scm_dos_protection_rule:
        state: gathered
        name: "example-dos_protection_rule"
        folder: "Shared"
      register: gather_result

    - name: Display gathered dos_protection_rule
      ansible.builtin.debug:
        var: gather_result.dos_protection_rule

    - name: List all dos_protection_rules in a folder
      paloaltonetworks.scm.scm_dos_protection_rule_info:
        folder: "Shared"
      register: list_result

    - name: Display dos_protection_rules list
      ansible.builtin.debug:
        var: list_result.dos_protection_rules


    - name: Delete the dos_protection_rule object
      paloaltonetworks.scm.scm_dos_protection_rule:
        state: absent
        name: "example-dos_protection_rule"
        folder: "Shared"

