---
# Example playbook for paloaltonetworks.scm.scm_service_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_service_setting.yml

- name: Manage service_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a service_setting object
      paloaltonetworks.scm.scm_service_setting:
        state: present
        name: "example-service_setting"
        folder: "Shared"
      register: create_result

    - name: Display created service_setting
      ansible.builtin.debug:
        var: create_result.service_setting

    - name: Gather information about a service_setting object
      paloaltonetworks.scm.scm_service_setting:
        state: gathered
        name: "example-service_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered service_setting
      ansible.builtin.debug:
        var: gather_result.service_setting

    - name: List all service_settings in a folder
      paloaltonetworks.scm.scm_service_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display service_settings list
      ansible.builtin.debug:
        var: list_result.service_settings


    - name: Delete the service_setting object
      paloaltonetworks.scm.scm_service_setting:
        state: absent
        name: "example-service_setting"
        folder: "Shared"

