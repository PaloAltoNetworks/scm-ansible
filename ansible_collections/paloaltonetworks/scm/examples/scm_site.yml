---
# Example playbook for paloaltonetworks.scm.scm_site
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_site.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_site' for full parameter docs.

- name: Manage sites in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create site
      paloaltonetworks.scm.scm_site:
        state: present
        name: "ansible-test-site"
      register: create_result

    - name: Show created site
      ansible.builtin.debug:
        var: create_result.site

    # ── Update ──────────────────────────────────────────────
    - name: Update site
      paloaltonetworks.scm.scm_site:
        state: present
        name: "ansible-test-site"
      register: update_result

    - name: Show updated site
      ansible.builtin.debug:
        var: update_result.site

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get site by name
      paloaltonetworks.scm.scm_site:
        state: gathered
        name: "ansible-test-site"
      register: gathered_result

    - name: Show gathered site
      ansible.builtin.debug:
        var: gathered_result.site

    # ── Get by name (info module) ───────────────────────────
    - name: Get site by name (info module)
      paloaltonetworks.scm.scm_site_info:
        name: "ansible-test-site"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.sites

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get site by ID (info module)
      paloaltonetworks.scm.scm_site_info:
        id: "{{ gathered_result.site.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.sites

    # ── List all ────────────────────────────────────────────
    - name: List all sites
      paloaltonetworks.scm.scm_site_info:
      register: list_result

    - name: Show sites count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} sites"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete site
      paloaltonetworks.scm.scm_site:
        state: absent
        name: "ansible-test-site"

