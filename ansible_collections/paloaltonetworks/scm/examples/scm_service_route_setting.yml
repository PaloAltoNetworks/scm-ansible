---
# Example playbook for paloaltonetworks.scm.scm_service_route_setting
#
# Demonstrates: list (singleton), get by ID, update
#
# SINGLETON RESOURCE: service_route_setting has no create or delete operations.
# One instance exists per folder. Use list to discover the ID, then get/update.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_service_route_setting.yml

- name: Manage service_route_setting in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── List (discover singleton ID) ─────────────────────────
    - name: List all service_route_settings
      paloaltonetworks.scm.scm_service_route_setting_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show service_route_settings list
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} service_route_setting(s)"

    # ── Get by ID ────────────────────────────────────────────
    - name: Get service_route_setting by ID
      paloaltonetworks.scm.scm_service_route_setting_info:
        id: "{{ list_result.service_route_settings[0].id }}"
      register: info_by_id
      when: list_result.service_route_settings | length > 0

    - name: Show service_route_setting detail
      ansible.builtin.debug:
        var: info_by_id.service_route_settings
      when: list_result.service_route_settings | length > 0

    # ── Update by ID ─────────────────────────────────────────
    # No-op update: re-apply the existing configuration to verify idempotency
    - name: Update service_route_setting by ID
      paloaltonetworks.scm.scm_service_route_setting:
        state: present
        id: "{{ list_result.service_route_settings[0].id }}"
        folder: "Prisma Access"
        # Optionally specify route configuration:
        # route:
        #   destination: "internet"
        #   nexthop: "10.0.0.1"
      register: update_result
      when: list_result.service_route_settings | length > 0

    - name: Show updated service_route_setting
      ansible.builtin.debug:
        var: update_result.service_route_setting
      when: list_result.service_route_settings | length > 0
