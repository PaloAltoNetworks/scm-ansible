---
# Example playbook for paloaltonetworks.scm.scm_dos_protection_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_dos_protection_profile.yml

- name: Manage dos_protection_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a dos_protection_profile object
      paloaltonetworks.scm.scm_dos_protection_profile:
        state: present
        name: "example-dos_protection_profile"
        folder: "Shared"
      register: create_result

    - name: Display created dos_protection_profile
      ansible.builtin.debug:
        var: create_result.dos_protection_profile

    - name: Gather information about a dos_protection_profile object
      paloaltonetworks.scm.scm_dos_protection_profile:
        state: gathered
        name: "example-dos_protection_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered dos_protection_profile
      ansible.builtin.debug:
        var: gather_result.dos_protection_profile

    - name: List all dos_protection_profiles in a folder
      paloaltonetworks.scm.scm_dos_protection_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display dos_protection_profiles list
      ansible.builtin.debug:
        var: list_result.dos_protection_profiles


    - name: Delete the dos_protection_profile object
      paloaltonetworks.scm.scm_dos_protection_profile:
        state: absent
        name: "example-dos_protection_profile"
        folder: "Shared"

