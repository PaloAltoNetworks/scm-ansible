---
# Example playbook for paloaltonetworks.scm.scm_scep_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_scep_profile.yml

- name: Manage scep_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a scep_profile object
      paloaltonetworks.scm.scm_scep_profile:
        state: present
        name: "example-scep_profile"
        folder: "Shared"
      register: create_result

    - name: Display created scep_profile
      ansible.builtin.debug:
        var: create_result.scep_profile

    - name: Gather information about a scep_profile object
      paloaltonetworks.scm.scm_scep_profile:
        state: gathered
        name: "example-scep_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered scep_profile
      ansible.builtin.debug:
        var: gather_result.scep_profile

    - name: List all scep_profiles in a folder
      paloaltonetworks.scm.scm_scep_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display scep_profiles list
      ansible.builtin.debug:
        var: list_result.scep_profiles


    - name: Delete the scep_profile object
      paloaltonetworks.scm.scm_scep_profile:
        state: absent
        name: "example-scep_profile"
        folder: "Shared"

