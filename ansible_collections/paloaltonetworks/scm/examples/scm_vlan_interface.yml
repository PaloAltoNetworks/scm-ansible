---
# Example playbook for paloaltonetworks.scm.scm_vlan_interface
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_vlan_interface.yml

- name: Manage vlan_interfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a vlan_interface object
      paloaltonetworks.scm.scm_vlan_interface:
        state: present
        name: "example-vlan_interface"
        folder: "Shared"
      register: create_result

    - name: Display created vlan_interface
      ansible.builtin.debug:
        var: create_result.vlan_interface

    - name: Gather information about a vlan_interface object
      paloaltonetworks.scm.scm_vlan_interface:
        state: gathered
        name: "example-vlan_interface"
        folder: "Shared"
      register: gather_result

    - name: Display gathered vlan_interface
      ansible.builtin.debug:
        var: gather_result.vlan_interface

    - name: List all vlan_interfaces in a folder
      paloaltonetworks.scm.scm_vlan_interface_info:
        folder: "Shared"
      register: list_result

    - name: Display vlan_interfaces list
      ansible.builtin.debug:
        var: list_result.vlan_interfaces


    - name: Delete the vlan_interface object
      paloaltonetworks.scm.scm_vlan_interface:
        state: absent
        name: "example-vlan_interface"
        folder: "Shared"

