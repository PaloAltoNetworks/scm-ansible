---
# Example playbook for paloaltonetworks.scm.scm_general_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_general_setting.yml

- name: Manage general_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a general_setting object
      paloaltonetworks.scm.scm_general_setting:
        state: present
        name: "example-general_setting"
        folder: "Shared"
      register: create_result

    - name: Display created general_setting
      ansible.builtin.debug:
        var: create_result.general_setting

    - name: Gather information about a general_setting object
      paloaltonetworks.scm.scm_general_setting:
        state: gathered
        name: "example-general_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered general_setting
      ansible.builtin.debug:
        var: gather_result.general_setting

    - name: List all general_settings in a folder
      paloaltonetworks.scm.scm_general_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display general_settings list
      ansible.builtin.debug:
        var: list_result.general_settings


    - name: Delete the general_setting object
      paloaltonetworks.scm.scm_general_setting:
        state: absent
        name: "example-general_setting"
        folder: "Shared"

