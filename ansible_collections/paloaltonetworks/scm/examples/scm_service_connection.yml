---
# Example playbook for paloaltonetworks.scm.scm_service_connection
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# INFRA_DEP: Service connections require deployment-specific infrastructure
#   that must exist in your SCM tenant before running this playbook:
#
#   Required infrastructure (must be pre-created):
#     - An IPSec tunnel (ipsec_tunnel field, required) — created in the
#       "Service Connections" folder via IKE Crypto Profile + IKE Gateway +
#       IPSec Tunnel chain
#     - A valid cloud region (region field, required) — e.g. "us-central1-a",
#       "us-east1-a", "us-west1-a", "eu-west1-a"
#
#   The folder for service connections is "Service Connections" (fixed).
#
#   Replace the placeholder values below with real values from your environment:
#     - ipsec_tunnel: Name of your pre-created IPSec tunnel
#     - region: The cloud region where your service connection terminates
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_service_connection.yml
#
# Run 'ansible-doc paloaltonetworks.scm.scm_service_connection' for full parameter docs.

- name: Manage service_connections in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Replace with your actual pre-created IPSec tunnel name
    ipsec_tunnel_name: "your-ipsec-tunnel-name"
    # Replace with your actual cloud region
    sc_region: "us-central1-a"

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create service_connection
      paloaltonetworks.scm.scm_service_connection:
        state: present
        name: "ansible-test-service-connection"
        ipsec_tunnel: "{{ ipsec_tunnel_name }}"
        region: "{{ sc_region }}"
        onboarding_type: "classic"
        subnets:
          - "10.0.0.0/24"
          - "10.0.1.0/24"
        source_nat: true
      register: create_result

    - name: Show created service_connection
      ansible.builtin.debug:
        var: create_result.service_connection

    # ── Update ──────────────────────────────────────────────
    - name: Update service_connection
      paloaltonetworks.scm.scm_service_connection:
        state: present
        name: "ansible-test-service-connection"
        ipsec_tunnel: "{{ ipsec_tunnel_name }}"
        region: "{{ sc_region }}"
        onboarding_type: "classic"
        subnets:
          - "10.0.0.0/24"
          - "10.0.1.0/24"
          - "192.168.0.0/16"
        source_nat: true
      register: update_result

    - name: Show updated service_connection
      ansible.builtin.debug:
        var: update_result.service_connection

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get service_connection by name
      paloaltonetworks.scm.scm_service_connection:
        state: gathered
        name: "ansible-test-service-connection"
        ipsec_tunnel: "{{ ipsec_tunnel_name }}"
        region: "{{ sc_region }}"
      register: gathered_result

    - name: Show gathered service_connection
      ansible.builtin.debug:
        var: gathered_result.service_connection

    # ── Get by name (info module) ───────────────────────────
    - name: Get service_connection by name (info module)
      paloaltonetworks.scm.scm_service_connection_info:
        name: "ansible-test-service-connection"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.service_connections

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get service_connection by ID (info module)
      paloaltonetworks.scm.scm_service_connection_info:
        id: "{{ gathered_result.service_connection.id }}"
      register: info_by_id
      when: gathered_result.service_connection.id is defined

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.service_connections
      when: gathered_result.service_connection.id is defined

    # ── List all ────────────────────────────────────────────
    - name: List all service_connections
      paloaltonetworks.scm.scm_service_connection_info:
      register: list_result

    - name: Show service_connections count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} service_connections"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete service_connection
      paloaltonetworks.scm.scm_service_connection:
        state: absent
        name: "ansible-test-service-connection"
        ipsec_tunnel: "{{ ipsec_tunnel_name }}"
        region: "{{ sc_region }}"
