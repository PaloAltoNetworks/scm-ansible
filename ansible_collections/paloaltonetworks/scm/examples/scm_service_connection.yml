---
# Example playbook for paloaltonetworks.scm.scm_service_connection
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_service_connection.yml

- name: Manage service_connections in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a service_connection object
      paloaltonetworks.scm.scm_service_connection:
        state: present
        name: "example-service_connection"
      register: create_result

    - name: Display created service_connection
      ansible.builtin.debug:
        var: create_result.service_connection

    - name: Gather information about a service_connection object
      paloaltonetworks.scm.scm_service_connection:
        state: gathered
        name: "example-service_connection"
      register: gather_result

    - name: Display gathered service_connection
      ansible.builtin.debug:
        var: gather_result.service_connection

    - name: List all service_connections in a folder
      paloaltonetworks.scm.scm_service_connection_info:
      register: list_result

    - name: Display service_connections list
      ansible.builtin.debug:
        var: list_result.service_connections


    - name: Delete the service_connection object
      paloaltonetworks.scm.scm_service_connection:
        state: absent
        name: "example-service_connection"

