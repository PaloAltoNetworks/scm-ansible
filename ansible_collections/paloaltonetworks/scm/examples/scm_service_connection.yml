---
# Example playbook for paloaltonetworks.scm.scm_service_connection
#
# NOTE: Service Connection requires VPN infrastructure:
#       IKE Crypto Profile -> IKE Gateway -> IPsec Tunnel -> Service Connection
#       This playbook creates all dependencies, then the service connection, then cleans up.
#
# Demonstrates: create with dependencies, gather, delete with cleanup
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_service_connection.yml

- name: Manage service_connection with VPN dependencies in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    folder: "Service Connections"
    crypto_name: "ansible-test-ikecrypto-sc"
    gateway_name: "ansible-test-ikegw-sc"
    tunnel_name: "ansible-test-ipsectun-sc"
    sc_name: "ansible-test-svcconn"

  tasks:

    # ══════════════════════════════════════════════════════════
    # SETUP: Create VPN dependency chain
    # ══════════════════════════════════════════════════════════

    # ── 1. Create IKE Crypto Profile ──────────────────────────
    - name: Create IKE Crypto Profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: present
        name: "{{ crypto_name }}"
        folder: "{{ folder }}"
        hash:
          - "sha256"
        dh_group:
          - "group14"
        encryption:
          - "aes-256-cbc"
      register: crypto_result

    # ── 2. Create IKE Gateway ─────────────────────────────────
    - name: Create IKE Gateway
      paloaltonetworks.scm.scm_ike_gateway:
        state: present
        name: "{{ gateway_name }}"
        folder: "{{ folder }}"
        authentication:
          pre_shared_key:
            key: "secret123"
        peer_address:
          ip: "2.2.2.6"
        peer_id:
          type: "ipaddr"
          id: "10.3.3.6"
        local_id:
          type: "ipaddr"
          id: "10.3.4.6"
        protocol:
          ikev1:
            ike_crypto_profile: "{{ crypto_name }}"
            dpd:
              enable: true
          ikev2:
            ike_crypto_profile: "{{ crypto_name }}"
            dpd:
              enable: true
      register: gateway_result

    # ── 3. Create IPsec Tunnel ────────────────────────────────
    - name: Create IPsec Tunnel
      paloaltonetworks.scm.scm_ipsec_tunnel:
        state: present
        name: "{{ tunnel_name }}"
        folder: "{{ folder }}"
        anti_replay: true
        copy_tos: false
        enable_gre_encapsulation: false
        auto_key:
          ike_gateway:
            - name: "{{ gateway_name }}"
          ipsec_crypto_profile: "PaloAlto-Networks-IPSec-Crypto"
      register: tunnel_result

    # ══════════════════════════════════════════════════════════
    # MAIN: Service Connection CRUD operations
    # ══════════════════════════════════════════════════════════

    # ── Create Service Connection ─────────────────────────────
    - name: Create service_connection
      paloaltonetworks.scm.scm_service_connection:
        state: present
        name: "{{ sc_name }}"
        folder: "{{ folder }}"
        ipsec_tunnel: "{{ tunnel_name }}"
        region: "us-central1-a"
        onboarding_type: "classic"
        subnets:
          - "10.0.0.0/24"
          - "10.0.1.0/24"
        source_nat: true
      register: create_result

    - name: Show created service_connection
      ansible.builtin.debug:
        var: create_result.service_connection

    # ── Gather Service Connection ─────────────────────────────
    - name: Gather service_connection by name
      paloaltonetworks.scm.scm_service_connection:
        state: gathered
        name: "{{ sc_name }}"
        folder: "{{ folder }}"
        ipsec_tunnel: "{{ tunnel_name }}"
        region: "us-central1-a"
      register: gathered_result

    - name: Show gathered service_connection
      ansible.builtin.debug:
        var: gathered_result.service_connection

    # ── List Service Connections ──────────────────────────────
    - name: List all service_connections
      paloaltonetworks.scm.scm_service_connection_info:
        folder: "{{ folder }}"
      register: list_result

    - name: Show service_connections count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} service_connections"

    # ══════════════════════════════════════════════════════════
    # CLEANUP: Delete in reverse order
    # ══════════════════════════════════════════════════════════

    # ── Delete Service Connection ─────────────────────────────
    - name: Delete service_connection
      paloaltonetworks.scm.scm_service_connection:
        state: absent
        name: "{{ sc_name }}"
        folder: "{{ folder }}"
        ipsec_tunnel: "{{ tunnel_name }}"
        region: "us-central1-a"

    # ── Delete IPsec Tunnel ───────────────────────────────────
    - name: Delete IPsec Tunnel
      paloaltonetworks.scm.scm_ipsec_tunnel:
        state: absent
        name: "{{ tunnel_name }}"
        folder: "{{ folder }}"
        auto_key:
          ike_gateway:
            - name: "{{ gateway_name }}"
          ipsec_crypto_profile: "PaloAlto-Networks-IPSec-Crypto"

    # ── Delete IKE Gateway ────────────────────────────────────
    - name: Delete IKE Gateway
      paloaltonetworks.scm.scm_ike_gateway:
        state: absent
        name: "{{ gateway_name }}"
        folder: "{{ folder }}"
        authentication:
          pre_shared_key:
            key: "secret123"
        peer_address:
          ip: "2.2.2.6"
        protocol:
          ikev1:
            ike_crypto_profile: "{{ crypto_name }}"
          ikev2:
            ike_crypto_profile: "{{ crypto_name }}"

    # ── Delete IKE Crypto Profile ─────────────────────────────
    - name: Delete IKE Crypto Profile
      paloaltonetworks.scm.scm_ike_crypto_profile:
        state: absent
        name: "{{ crypto_name }}"
        folder: "{{ folder }}"
