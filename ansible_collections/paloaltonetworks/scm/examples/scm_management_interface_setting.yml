---
# Example playbook for paloaltonetworks.scm.scm_management_interface_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_management_interface_setting.yml

- name: Manage management_interface_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a management_interface_setting object
      paloaltonetworks.scm.scm_management_interface_setting:
        state: present
        name: "example-management_interface_setting"
        folder: "Shared"
      register: create_result

    - name: Display created management_interface_setting
      ansible.builtin.debug:
        var: create_result.management_interface_setting

    - name: Gather information about a management_interface_setting object
      paloaltonetworks.scm.scm_management_interface_setting:
        state: gathered
        name: "example-management_interface_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered management_interface_setting
      ansible.builtin.debug:
        var: gather_result.management_interface_setting

    - name: List all management_interface_settings in a folder
      paloaltonetworks.scm.scm_management_interface_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display management_interface_settings list
      ansible.builtin.debug:
        var: list_result.management_interface_settings


    - name: Delete the management_interface_setting object
      paloaltonetworks.scm.scm_management_interface_setting:
        state: absent
        name: "example-management_interface_setting"
        folder: "Shared"

