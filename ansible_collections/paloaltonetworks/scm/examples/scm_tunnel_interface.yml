---
# Example playbook for paloaltonetworks.scm.scm_tunnel_interface
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_tunnel_interface.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_tunnel_interface' for full parameter docs.

- name: Manage tunnel_interfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create tunnel_interface
      paloaltonetworks.scm.scm_tunnel_interface:
        state: present
        name: "ansible-test-tunnel_interface"
        folder: "All"
      register: create_result

    - name: Show created tunnel_interface
      ansible.builtin.debug:
        var: create_result.tunnel_interface

    # ── Update ──────────────────────────────────────────────
    - name: Update tunnel_interface
      paloaltonetworks.scm.scm_tunnel_interface:
        state: present
        name: "ansible-test-tunnel_interface"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated tunnel_interface
      ansible.builtin.debug:
        var: update_result.tunnel_interface

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get tunnel_interface by name
      paloaltonetworks.scm.scm_tunnel_interface:
        state: gathered
        name: "ansible-test-tunnel_interface"
        folder: "All"
      register: gathered_result

    - name: Show gathered tunnel_interface
      ansible.builtin.debug:
        var: gathered_result.tunnel_interface

    # ── Get by name (info module) ───────────────────────────
    - name: Get tunnel_interface by name (info module)
      paloaltonetworks.scm.scm_tunnel_interface_info:
        name: "ansible-test-tunnel_interface"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.tunnel_interfaces

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get tunnel_interface by ID (info module)
      paloaltonetworks.scm.scm_tunnel_interface_info:
        id: "{{ gathered_result.tunnel_interface.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.tunnel_interfaces

    # ── List all ────────────────────────────────────────────
    - name: List all tunnel_interfaces
      paloaltonetworks.scm.scm_tunnel_interface_info:
        folder: "All"
      register: list_result

    - name: Show tunnel_interfaces count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} tunnel_interfaces"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete tunnel_interface
      paloaltonetworks.scm.scm_tunnel_interface:
        state: absent
        name: "ansible-test-tunnel_interface"
        folder: "All"

