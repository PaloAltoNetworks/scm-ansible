---
# Example playbook for paloaltonetworks.scm.scm_login_banner_setting
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_login_banner_setting.yml

- name: Manage login_banner_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a login_banner_setting object
      paloaltonetworks.scm.scm_login_banner_setting:
        state: present
        name: "example-login_banner_setting"
        folder: "Shared"
      register: create_result

    - name: Display created login_banner_setting
      ansible.builtin.debug:
        var: create_result.login_banner_setting

    - name: Gather information about a login_banner_setting object
      paloaltonetworks.scm.scm_login_banner_setting:
        state: gathered
        name: "example-login_banner_setting"
        folder: "Shared"
      register: gather_result

    - name: Display gathered login_banner_setting
      ansible.builtin.debug:
        var: gather_result.login_banner_setting

    - name: List all login_banner_settings in a folder
      paloaltonetworks.scm.scm_login_banner_setting_info:
        folder: "Shared"
      register: list_result

    - name: Display login_banner_settings list
      ansible.builtin.debug:
        var: list_result.login_banner_settings


    - name: Delete the login_banner_setting object
      paloaltonetworks.scm.scm_login_banner_setting:
        state: absent
        name: "example-login_banner_setting"
        folder: "Shared"

