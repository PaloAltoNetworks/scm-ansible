---
# Example playbook for paloaltonetworks.scm.scm_login_banner_setting
#
# Demonstrates: create, update, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_login_banner_setting.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_login_banner_setting' for full parameter docs.

- name: Manage login_banner_settings in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create login_banner_setting
      paloaltonetworks.scm.scm_login_banner_setting:
        state: present
        name: "ansible-test-login_banner_setting"
        folder: "All"
      register: create_result

    - name: Show created login_banner_setting
      ansible.builtin.debug:
        var: create_result.login_banner_setting

    # ── Update ──────────────────────────────────────────────
    - name: Update login_banner_setting
      paloaltonetworks.scm.scm_login_banner_setting:
        state: present
        name: "ansible-test-login_banner_setting"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated login_banner_setting
      ansible.builtin.debug:
        var: update_result.login_banner_setting

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get login_banner_setting by ID (info module)
      paloaltonetworks.scm.scm_login_banner_setting_info:
        id: "your-object-uuid-here"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.login_banner_settings

    # ── List all ────────────────────────────────────────────
    - name: List all login_banner_settings
      paloaltonetworks.scm.scm_login_banner_setting_info:
        folder: "All"
      register: list_result

    - name: Show login_banner_settings count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} login_banner_settings"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete login_banner_setting
      paloaltonetworks.scm.scm_login_banner_setting:
        state: absent
        name: "ansible-test-login_banner_setting"
        folder: "All"

