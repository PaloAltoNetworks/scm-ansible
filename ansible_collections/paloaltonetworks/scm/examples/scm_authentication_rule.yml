---
# Example playbook for paloaltonetworks.scm.scm_authentication_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#   An authentication_profile must exist (e.g. "ansible-test-auth-prof")
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_authentication_rule.yml
#

- name: Manage authentication_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Dependency: Authentication Profile ──────────────────
    - name: Create dep authentication_profile
      paloaltonetworks.scm.scm_authentication_profile:
        state: present
        name: "ansible-dep-auth-prof"
        folder: "All"
        allow_list: ["all"]
        method:
          local_database: {}
      register: dep_profile

    # ── Create ──────────────────────────────────────────────
    - name: Create authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: present
        name: "ansible-test-authrule"
        folder: "All"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        service: ["any"]
        authentication_enforcement: "ansible-dep-auth-prof"
        description: "Test auth rule"
      register: create_result

    - name: Show created authentication_rule
      ansible.builtin.debug:
        var: create_result.authentication_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: present
        name: "ansible-test-authrule"
        folder: "All"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        service: ["any"]
        authentication_enforcement: "ansible-dep-auth-prof"
        description: "Updated auth rule"
        log_authentication_timeout: true
      register: update_result

    - name: Show updated authentication_rule
      ansible.builtin.debug:
        var: update_result.authentication_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get authentication_rule by name
      paloaltonetworks.scm.scm_authentication_rule:
        state: gathered
        name: "ansible-test-authrule"
        folder: "All"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        service: ["any"]
      register: gathered_result

    - name: Show gathered authentication_rule
      ansible.builtin.debug:
        var: gathered_result.authentication_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get authentication_rule by name (info module)
      paloaltonetworks.scm.scm_authentication_rule_info:
        name: "ansible-test-authrule"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.authentication_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get authentication_rule by ID (info module)
      paloaltonetworks.scm.scm_authentication_rule_info:
        id: "{{ gathered_result.authentication_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.authentication_rules

    # ── List all ────────────────────────────────────────────
    - name: List all authentication_rules
      paloaltonetworks.scm.scm_authentication_rule_info:
        folder: "All"
      register: list_result

    - name: Show authentication_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} authentication_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: absent
        name: "ansible-test-authrule"
        folder: "All"
        var_from: ["any"]
        to: ["any"]
        source: ["any"]
        destination: ["any"]
        service: ["any"]

    # ── Cleanup dep ──────────────────────────────────────────
    - name: Delete dep authentication_profile
      paloaltonetworks.scm.scm_authentication_profile:
        state: absent
        name: "ansible-dep-auth-prof"
        folder: "All"
