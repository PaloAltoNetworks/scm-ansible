---
# Example playbook for paloaltonetworks.scm.scm_authentication_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_authentication_rule.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_authentication_rule' for full parameter docs.

- name: Manage authentication_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: present
        name: "ansible-test-authentication_rule"
        folder: "All"
        # destination: <required>
        # service: <required>
        # source: <required>
        # to: <required>
        # var_from: <required>
      register: create_result

    - name: Show created authentication_rule
      ansible.builtin.debug:
        var: create_result.authentication_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: present
        name: "ansible-test-authentication_rule"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated authentication_rule
      ansible.builtin.debug:
        var: update_result.authentication_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get authentication_rule by name
      paloaltonetworks.scm.scm_authentication_rule:
        state: gathered
        name: "ansible-test-authentication_rule"
        folder: "All"
      register: gathered_result

    - name: Show gathered authentication_rule
      ansible.builtin.debug:
        var: gathered_result.authentication_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get authentication_rule by name (info module)
      paloaltonetworks.scm.scm_authentication_rule_info:
        name: "ansible-test-authentication_rule"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.authentication_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get authentication_rule by ID (info module)
      paloaltonetworks.scm.scm_authentication_rule_info:
        id: "{{ gathered_result.authentication_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.authentication_rules

    # ── List all ────────────────────────────────────────────
    - name: List all authentication_rules
      paloaltonetworks.scm.scm_authentication_rule_info:
        folder: "All"
      register: list_result

    - name: Show authentication_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} authentication_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete authentication_rule
      paloaltonetworks.scm.scm_authentication_rule:
        state: absent
        name: "ansible-test-authentication_rule"
        folder: "All"

