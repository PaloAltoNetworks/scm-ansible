---
# Example playbook for paloaltonetworks.scm.scm_label
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_label.yml

- name: Manage labels in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a label object
      paloaltonetworks.scm.scm_label:
        state: present
        name: "example-label"
      register: create_result

    - name: Display created label
      ansible.builtin.debug:
        var: create_result.label

    - name: Gather information about a label object
      paloaltonetworks.scm.scm_label:
        state: gathered
        name: "example-label"
      register: gather_result

    - name: Display gathered label
      ansible.builtin.debug:
        var: gather_result.label

    - name: List all labels in a folder
      paloaltonetworks.scm.scm_label_info:
      register: list_result

    - name: Display labels list
      ansible.builtin.debug:
        var: list_result.labels


    - name: Delete the label object
      paloaltonetworks.scm.scm_label:
        state: absent
        name: "example-label"

