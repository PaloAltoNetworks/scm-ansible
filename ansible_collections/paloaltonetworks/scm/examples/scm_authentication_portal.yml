---
# Example playbook for paloaltonetworks.scm.scm_authentication_portal
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_authentication_portal.yml

- name: Manage authentication_portals in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a authentication_portal object
      paloaltonetworks.scm.scm_authentication_portal:
        state: present
        name: "example-authentication_portal"
        folder: "Shared"
      register: create_result

    - name: Display created authentication_portal
      ansible.builtin.debug:
        var: create_result.authentication_portal

    - name: Gather information about a authentication_portal object
      paloaltonetworks.scm.scm_authentication_portal:
        state: gathered
        name: "example-authentication_portal"
        folder: "Shared"
      register: gather_result

    - name: Display gathered authentication_portal
      ansible.builtin.debug:
        var: gather_result.authentication_portal

    - name: List all authentication_portals in a folder
      paloaltonetworks.scm.scm_authentication_portal_info:
        folder: "Shared"
      register: list_result

    - name: Display authentication_portals list
      ansible.builtin.debug:
        var: list_result.authentication_portals


    - name: Delete the authentication_portal object
      paloaltonetworks.scm.scm_authentication_portal:
        state: absent
        name: "example-authentication_portal"
        folder: "Shared"

