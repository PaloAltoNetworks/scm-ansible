---
# Example playbook for paloaltonetworks.scm.scm_authentication_portal
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_authentication_portal.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_authentication_portal' for full parameter docs.

- name: Manage authentication_portals in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create authentication_portal
      paloaltonetworks.scm.scm_authentication_portal:
        state: present
        name: "ansible-test-authentication_portal"
        folder: "All"
        # redirect_host: <required>
      register: create_result

    - name: Show created authentication_portal
      ansible.builtin.debug:
        var: create_result.authentication_portal

    # ── Update ──────────────────────────────────────────────
    - name: Update authentication_portal
      paloaltonetworks.scm.scm_authentication_portal:
        state: present
        name: "ansible-test-authentication_portal"
        description: "Updated by Ansible"
        folder: "All"
      register: update_result

    - name: Show updated authentication_portal
      ansible.builtin.debug:
        var: update_result.authentication_portal

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get authentication_portal by name
      paloaltonetworks.scm.scm_authentication_portal:
        state: gathered
        name: "ansible-test-authentication_portal"
        folder: "All"
      register: gathered_result

    - name: Show gathered authentication_portal
      ansible.builtin.debug:
        var: gathered_result.authentication_portal

    # ── Get by name (info module) ───────────────────────────
    - name: Get authentication_portal by name (info module)
      paloaltonetworks.scm.scm_authentication_portal_info:
        name: "ansible-test-authentication_portal"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.authentication_portals

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get authentication_portal by ID (info module)
      paloaltonetworks.scm.scm_authentication_portal_info:
        id: "{{ gathered_result.authentication_portal.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.authentication_portals

    # ── List all ────────────────────────────────────────────
    - name: List all authentication_portals
      paloaltonetworks.scm.scm_authentication_portal_info:
        folder: "All"
      register: list_result

    - name: Show authentication_portals count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} authentication_portals"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete authentication_portal
      paloaltonetworks.scm.scm_authentication_portal:
        state: absent
        name: "ansible-test-authentication_portal"
        folder: "All"

