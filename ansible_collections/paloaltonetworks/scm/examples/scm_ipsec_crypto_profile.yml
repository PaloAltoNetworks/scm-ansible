---
# Example playbook for paloaltonetworks.scm.scm_ipsec_crypto_profile
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_ipsec_crypto_profile.yml

- name: Manage ipsec_crypto_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a ipsec_crypto_profile object
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: present
        name: "example-ipsec_crypto_profile"
        folder: "Shared"
      register: create_result

    - name: Display created ipsec_crypto_profile
      ansible.builtin.debug:
        var: create_result.ipsec_crypto_profile

    - name: Gather information about a ipsec_crypto_profile object
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: gathered
        name: "example-ipsec_crypto_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered ipsec_crypto_profile
      ansible.builtin.debug:
        var: gather_result.ipsec_crypto_profile

    - name: List all ipsec_crypto_profiles in a folder
      paloaltonetworks.scm.scm_ipsec_crypto_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display ipsec_crypto_profiles list
      ansible.builtin.debug:
        var: list_result.ipsec_crypto_profiles


    - name: Delete the ipsec_crypto_profile object
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: absent
        name: "example-ipsec_crypto_profile"
        folder: "Shared"

