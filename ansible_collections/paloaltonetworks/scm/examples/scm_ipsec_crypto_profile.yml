---
# Example playbook for paloaltonetworks.scm.scm_ipsec_crypto_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_ipsec_crypto_profile.yml
#

- name: Manage ipsec_crypto_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create ipsec_crypto_profile
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: present
        name: "ansible-test-ipsec-crypto"
        folder: "Remote Networks"
        dh_group: "group14"
        esp:
          authentication:
          - "sha256"
          encryption:
          - "aes-256-gcm"
        lifetime:
          hours: 8
      register: create_result

    - name: Show created ipsec_crypto_profile
      ansible.builtin.debug:
        var: create_result.ipsec_crypto_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update ipsec_crypto_profile
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: present
        name: "ansible-test-ipsec-crypto"
        folder: "Remote Networks"
        dh_group: "group14"
        esp:
          authentication:
          - "sha256"
          encryption:
          - "aes-256-gcm"
        lifetime:
          hours: 1
      register: update_result

    - name: Show updated ipsec_crypto_profile
      ansible.builtin.debug:
        var: update_result.ipsec_crypto_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get ipsec_crypto_profile by name
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: gathered
        name: "ansible-test-ipsec-crypto"
        folder: "Remote Networks"
        lifetime:
          hours: 1
      register: gathered_result

    - name: Show gathered ipsec_crypto_profile
      ansible.builtin.debug:
        var: gathered_result.ipsec_crypto_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get ipsec_crypto_profile by name (info module)
      paloaltonetworks.scm.scm_ipsec_crypto_profile_info:
        name: "ansible-test-ipsec-crypto"
        folder: "Remote Networks"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.ipsec_crypto_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get ipsec_crypto_profile by ID (info module)
      paloaltonetworks.scm.scm_ipsec_crypto_profile_info:
        id: "{{ gathered_result.ipsec_crypto_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.ipsec_crypto_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all ipsec_crypto_profiles
      paloaltonetworks.scm.scm_ipsec_crypto_profile_info:
        folder: "Remote Networks"
      register: list_result

    - name: Show ipsec_crypto_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} ipsec_crypto_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete ipsec_crypto_profile
      paloaltonetworks.scm.scm_ipsec_crypto_profile:
        state: absent
        name: "ansible-test-ipsec-crypto"
        folder: "Remote Networks"
        lifetime:
          hours: 1
