---
# Example playbook for paloaltonetworks.scm.scm_nat_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_nat_rule.yml
#

- name: Manage nat_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create nat_rule
      paloaltonetworks.scm.scm_nat_rule:
        state: present
        name: "ansible-test-nat-rule"
        folder: "All"
        description: "Test NAT rule for CRUD"
        var_from: ["any"]
        to: ["untrust"]
        source: ["any"]
        destination: ["any"]
        service: "any"
        nat_type: "ipv4"
        destination_translation:
          translated_address: "10.1.1.10"
          translated_port: 443
          dns_rewrite:
            direction: "reverse"
        source_translation:
          dynamic_ip_and_port:
            translated_address:
            - "10.1.1.20"
            - "10.2.2.23"
      register: create_result

    - name: Show created nat_rule
      ansible.builtin.debug:
        var: create_result.nat_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update nat_rule
      paloaltonetworks.scm.scm_nat_rule:
        state: present
        name: "ansible-test-nat-rule"
        folder: "All"
        description: "Updated NAT rule"
        var_from: ["any"]
        to: ["untrust"]
        source: ["any"]
        destination: ["any"]
        service: "any"
        nat_type: "ipv4"
        source_translation:
          dynamic_ip_and_port:
            translated_address:
            - "10.1.1.20"
      register: update_result

    - name: Show updated nat_rule
      ansible.builtin.debug:
        var: update_result.nat_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get nat_rule by name
      paloaltonetworks.scm.scm_nat_rule:
        state: gathered
        name: "ansible-test-nat-rule"
        folder: "All"
        var_from: ["any"]
        to: ["untrust"]
        source: ["any"]
        destination: ["any"]
        service: "any"
      register: gathered_result

    - name: Show gathered nat_rule
      ansible.builtin.debug:
        var: gathered_result.nat_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get nat_rule by name (info module)
      paloaltonetworks.scm.scm_nat_rule_info:
        name: "ansible-test-nat-rule"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.nat_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get nat_rule by ID (info module)
      paloaltonetworks.scm.scm_nat_rule_info:
        id: "{{ gathered_result.nat_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.nat_rules

    # ── List all ────────────────────────────────────────────
    - name: List all nat_rules
      paloaltonetworks.scm.scm_nat_rule_info:
        folder: "All"
      register: list_result

    - name: Show nat_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} nat_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete nat_rule
      paloaltonetworks.scm.scm_nat_rule:
        state: absent
        name: "ansible-test-nat-rule"
        folder: "All"
        var_from: ["any"]
        to: ["untrust"]
        source: ["any"]
        destination: ["any"]
        service: "any"
