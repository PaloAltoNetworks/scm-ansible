---
# Example playbook for paloaltonetworks.scm.scm_bgp_filtering_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_bgp_filtering_profile.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_bgp_filtering_profile' for full parameter docs.

- name: Manage bgp_filtering_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create bgp_filtering_profile
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: present
        name: "ansible-test-bgp-filter"
        folder: "Prisma Access"
      register: create_result

    - name: Show created bgp_filtering_profile
      ansible.builtin.debug:
        var: create_result.bgp_filtering_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update bgp_filtering_profile
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: present
        name: "ansible-test-bgp-filter"
        description: "Updated by Ansible"
        folder: "Prisma Access"
      register: update_result

    - name: Show updated bgp_filtering_profile
      ansible.builtin.debug:
        var: update_result.bgp_filtering_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get bgp_filtering_profile by name
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: gathered
        name: "ansible-test-bgp-filter"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered bgp_filtering_profile
      ansible.builtin.debug:
        var: gathered_result.bgp_filtering_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get bgp_filtering_profile by name (info module)
      paloaltonetworks.scm.scm_bgp_filtering_profile_info:
        name: "ansible-test-bgp-filter"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.bgp_filtering_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get bgp_filtering_profile by ID (info module)
      paloaltonetworks.scm.scm_bgp_filtering_profile_info:
        id: "{{ gathered_result.bgp_filtering_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.bgp_filtering_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all bgp_filtering_profiles
      paloaltonetworks.scm.scm_bgp_filtering_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show bgp_filtering_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} bgp_filtering_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete bgp_filtering_profile
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: absent
        name: "ansible-test-bgp-filter"
        folder: "Prisma Access"

