---
# Example playbook for paloaltonetworks.scm.scm_bgp_filtering_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_bgp_filtering_profile.yml

- name: Manage bgp_filtering_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a bgp_filtering_profile object
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: present
        name: "example-bgp_filtering_profile"
        folder: "Shared"
      register: create_result

    - name: Display created bgp_filtering_profile
      ansible.builtin.debug:
        var: create_result.bgp_filtering_profile

    - name: Gather information about a bgp_filtering_profile object
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: gathered
        name: "example-bgp_filtering_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered bgp_filtering_profile
      ansible.builtin.debug:
        var: gather_result.bgp_filtering_profile

    - name: List all bgp_filtering_profiles in a folder
      paloaltonetworks.scm.scm_bgp_filtering_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display bgp_filtering_profiles list
      ansible.builtin.debug:
        var: list_result.bgp_filtering_profiles


    - name: Delete the bgp_filtering_profile object
      paloaltonetworks.scm.scm_bgp_filtering_profile:
        state: absent
        name: "example-bgp_filtering_profile"
        folder: "Shared"

