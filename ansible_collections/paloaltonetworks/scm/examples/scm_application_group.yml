---
# Example playbook for paloaltonetworks.scm.scm_application_group
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_application_group.yml

- name: Manage application_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a application_group object
      paloaltonetworks.scm.scm_application_group:
        state: present
        name: "example-application_group"
        folder: "Shared"
      register: create_result

    - name: Display created application_group
      ansible.builtin.debug:
        var: create_result.application_group

    - name: Gather information about a application_group object
      paloaltonetworks.scm.scm_application_group:
        state: gathered
        name: "example-application_group"
        folder: "Shared"
      register: gather_result

    - name: Display gathered application_group
      ansible.builtin.debug:
        var: gather_result.application_group

    - name: List all application_groups in a folder
      paloaltonetworks.scm.scm_application_group_info:
        folder: "Shared"
      register: list_result

    - name: Display application_groups list
      ansible.builtin.debug:
        var: list_result.application_groups


    - name: Delete the application_group object
      paloaltonetworks.scm.scm_application_group:
        state: absent
        name: "example-application_group"
        folder: "Shared"

