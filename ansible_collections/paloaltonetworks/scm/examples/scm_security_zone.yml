---
# Example playbook for paloaltonetworks.scm.scm_security_zone
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_security_zone.yml

- name: Manage security_zones in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a security_zone object
      paloaltonetworks.scm.scm_security_zone:
        state: present
        name: "example-security_zone"
        folder: "Shared"
      register: create_result

    - name: Display created security_zone
      ansible.builtin.debug:
        var: create_result.security_zone

    - name: Gather information about a security_zone object
      paloaltonetworks.scm.scm_security_zone:
        state: gathered
        name: "example-security_zone"
        folder: "Shared"
      register: gather_result

    - name: Display gathered security_zone
      ansible.builtin.debug:
        var: gather_result.security_zone

    - name: List all security_zones in a folder
      paloaltonetworks.scm.scm_security_zone_info:
        folder: "Shared"
      register: list_result

    - name: Display security_zones list
      ansible.builtin.debug:
        var: list_result.security_zones


    - name: Delete the security_zone object
      paloaltonetworks.scm.scm_security_zone:
        state: absent
        name: "example-security_zone"
        folder: "Shared"

