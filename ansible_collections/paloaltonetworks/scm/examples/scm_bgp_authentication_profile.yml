---
# Example playbook for paloaltonetworks.scm.scm_bgp_authentication_profile
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_bgp_authentication_profile.yml

- name: Manage bgp_authentication_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a bgp_authentication_profile object
      paloaltonetworks.scm.scm_bgp_authentication_profile:
        state: present
        name: "example-bgp_authentication_profile"
        folder: "Shared"
      register: create_result

    - name: Display created bgp_authentication_profile
      ansible.builtin.debug:
        var: create_result.bgp_authentication_profile

    - name: Gather information about a bgp_authentication_profile object
      paloaltonetworks.scm.scm_bgp_authentication_profile:
        state: gathered
        name: "example-bgp_authentication_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered bgp_authentication_profile
      ansible.builtin.debug:
        var: gather_result.bgp_authentication_profile

    - name: List all bgp_authentication_profiles in a folder
      paloaltonetworks.scm.scm_bgp_authentication_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display bgp_authentication_profiles list
      ansible.builtin.debug:
        var: list_result.bgp_authentication_profiles


    - name: Delete the bgp_authentication_profile object
      paloaltonetworks.scm.scm_bgp_authentication_profile:
        state: absent
        name: "example-bgp_authentication_profile"
        folder: "Shared"

