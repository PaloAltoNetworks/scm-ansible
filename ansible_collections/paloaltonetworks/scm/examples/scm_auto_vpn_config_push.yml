---
# Example playbook for paloaltonetworks.scm.scm_auto_vpn_config_push
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_auto_vpn_config_push.yml

- name: Manage auto_vpn_config_push in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a auto_vpn_config_push object
      paloaltonetworks.scm.scm_auto_vpn_config_push:
        state: present
        name: "example-auto_vpn_config_push"
      register: create_result

    - name: Display created auto_vpn_config_push
      ansible.builtin.debug:
        var: create_result.auto_vpn_config_push

    - name: Gather information about a auto_vpn_config_push object
      paloaltonetworks.scm.scm_auto_vpn_config_push:
        state: gathered
        name: "example-auto_vpn_config_push"
      register: gather_result

    - name: Display gathered auto_vpn_config_push
      ansible.builtin.debug:
        var: gather_result.auto_vpn_config_push


