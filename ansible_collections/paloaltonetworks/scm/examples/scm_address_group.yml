---
# Example playbook for paloaltonetworks.scm.scm_address_group
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_address_group.yml

- name: Manage address_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a address_group object
      paloaltonetworks.scm.scm_address_group:
        state: present
        name: "example-address_group"
        folder: "Shared"
      register: create_result

    - name: Display created address_group
      ansible.builtin.debug:
        var: create_result.address_group

    - name: Gather information about a address_group object
      paloaltonetworks.scm.scm_address_group:
        state: gathered
        name: "example-address_group"
        folder: "Shared"
      register: gather_result

    - name: Display gathered address_group
      ansible.builtin.debug:
        var: gather_result.address_group

    - name: List all address_groups in a folder
      paloaltonetworks.scm.scm_address_group_info:
        folder: "Shared"
      register: list_result

    - name: Display address_groups list
      ansible.builtin.debug:
        var: list_result.address_groups


    - name: Delete the address_group object
      paloaltonetworks.scm.scm_address_group:
        state: absent
        name: "example-address_group"
        folder: "Shared"

