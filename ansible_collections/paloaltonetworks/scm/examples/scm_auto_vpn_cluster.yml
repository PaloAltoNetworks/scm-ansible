---
# Example playbook for paloaltonetworks.scm.scm_auto_vpn_cluster
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_auto_vpn_cluster.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_auto_vpn_cluster' for full parameter docs.

- name: Manage auto_vpn_clusters in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create auto_vpn_cluster
      paloaltonetworks.scm.scm_auto_vpn_cluster:
        state: present
        name: "ansible-test-avpn"
      register: create_result

    - name: Show created auto_vpn_cluster
      ansible.builtin.debug:
        var: create_result.auto_vpn_cluster

    # ── Update ──────────────────────────────────────────────
    - name: Update auto_vpn_cluster
      paloaltonetworks.scm.scm_auto_vpn_cluster:
        state: present
        name: "ansible-test-avpn"
      register: update_result

    - name: Show updated auto_vpn_cluster
      ansible.builtin.debug:
        var: update_result.auto_vpn_cluster

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get auto_vpn_cluster by name
      paloaltonetworks.scm.scm_auto_vpn_cluster:
        state: gathered
        name: "ansible-test-avpn"
      register: gathered_result

    - name: Show gathered auto_vpn_cluster
      ansible.builtin.debug:
        var: gathered_result.auto_vpn_cluster

    # ── Get by name (info module) ───────────────────────────
    - name: Get auto_vpn_cluster by name (info module)
      paloaltonetworks.scm.scm_auto_vpn_cluster_info:
        name: "ansible-test-avpn"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.auto_vpn_clusters

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get auto_vpn_cluster by ID (info module)
      paloaltonetworks.scm.scm_auto_vpn_cluster_info:
        id: "{{ gathered_result.auto_vpn_cluster.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.auto_vpn_clusters

    # ── List all ────────────────────────────────────────────
    - name: List all auto_vpn_clusters
      paloaltonetworks.scm.scm_auto_vpn_cluster_info:
      register: list_result

    - name: Show auto_vpn_clusters count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} auto_vpn_clusters"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete auto_vpn_cluster
      paloaltonetworks.scm.scm_auto_vpn_cluster:
        state: absent
        name: "ansible-test-avpn"

