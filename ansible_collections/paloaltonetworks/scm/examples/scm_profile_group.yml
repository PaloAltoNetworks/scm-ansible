---
# Example playbook for paloaltonetworks.scm.scm_profile_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_profile_group.yml
#

- name: Manage profile_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create profile_group
      paloaltonetworks.scm.scm_profile_group:
        state: present
        name: "ansible-test-profgrp"
        folder: "All"
      register: create_result

    - name: Show created profile_group
      ansible.builtin.debug:
        var: create_result.profile_group

    # ── Update ──────────────────────────────────────────────
    - name: Update profile_group
      paloaltonetworks.scm.scm_profile_group:
        state: present
        name: "ansible-test-profgrp"
        folder: "All"
        spyware:
          - "best-practice"
      register: update_result

    - name: Show updated profile_group
      ansible.builtin.debug:
        var: update_result.profile_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get profile_group by name
      paloaltonetworks.scm.scm_profile_group:
        state: gathered
        name: "ansible-test-profgrp"
        folder: "All"
      register: gathered_result

    - name: Show gathered profile_group
      ansible.builtin.debug:
        var: gathered_result.profile_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get profile_group by name (info module)
      paloaltonetworks.scm.scm_profile_group_info:
        name: "ansible-test-profgrp"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.profile_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get profile_group by ID (info module)
      paloaltonetworks.scm.scm_profile_group_info:
        id: "{{ gathered_result.profile_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.profile_groups

    # ── List all ────────────────────────────────────────────
    - name: List all profile_groups
      paloaltonetworks.scm.scm_profile_group_info:
        folder: "All"
      register: list_result

    - name: Show profile_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} profile_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete profile_group
      paloaltonetworks.scm.scm_profile_group:
        state: absent
        name: "ansible-test-profgrp"
        folder: "All"
