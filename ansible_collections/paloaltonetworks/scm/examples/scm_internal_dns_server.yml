---
# Example playbook for paloaltonetworks.scm.scm_internal_dns_server
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# NOTE: internal_dns_server is a deployment-services resource and does not use
#       folder/snippet/device containers. The required fields are:
#         - name      (string, required)
#         - domain_name (list of strings, required)
#         - primary   (string, IP address of primary DNS server, required)
#         - secondary (string, IP address of secondary DNS server, optional)
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_internal_dns_server.yml
#

- name: Manage internal_dns_servers in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create internal_dns_server
      paloaltonetworks.scm.scm_internal_dns_server:
        state: present
        name: "ansible-test-internal-dns"
        domain_name:
          - "example.com"
        primary: "8.8.8.8"
        secondary: "8.8.4.4"
      register: create_result

    - name: Show created internal_dns_server
      ansible.builtin.debug:
        var: create_result.internal_dns_server

    # ── Update ──────────────────────────────────────────────
    - name: Update internal_dns_server
      paloaltonetworks.scm.scm_internal_dns_server:
        state: present
        name: "ansible-test-internal-dns"
        domain_name:
          - "example.com"
          - "internal.example.com"
        primary: "8.8.8.8"
        secondary: "1.1.1.1"
      register: update_result

    - name: Show updated internal_dns_server
      ansible.builtin.debug:
        var: update_result.internal_dns_server

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get internal_dns_server by name
      paloaltonetworks.scm.scm_internal_dns_server:
        state: gathered
        name: "ansible-test-internal-dns"
        domain_name:
          - "example.com"
        primary: "8.8.8.8"
      register: gathered_result

    - name: Show gathered internal_dns_server
      ansible.builtin.debug:
        var: gathered_result.internal_dns_server

    # ── Get by name (info module) ───────────────────────────
    - name: Get internal_dns_server by name (info module)
      paloaltonetworks.scm.scm_internal_dns_server_info:
        name: "ansible-test-internal-dns"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.internal_dns_servers

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get internal_dns_server by ID (info module)
      paloaltonetworks.scm.scm_internal_dns_server_info:
        id: "{{ gathered_result.internal_dns_server.id }}"
      register: info_by_id
      when: gathered_result.internal_dns_server.id is defined

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.internal_dns_servers
      when: gathered_result.internal_dns_server.id is defined

    # ── List all ────────────────────────────────────────────
    - name: List all internal_dns_servers
      paloaltonetworks.scm.scm_internal_dns_server_info:
      register: list_result

    - name: Show internal_dns_servers count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} internal_dns_servers"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete internal_dns_server
      paloaltonetworks.scm.scm_internal_dns_server:
        state: absent
        name: "ansible-test-internal-dns"
        domain_name:
          - "example.com"
        primary: "8.8.8.8"
