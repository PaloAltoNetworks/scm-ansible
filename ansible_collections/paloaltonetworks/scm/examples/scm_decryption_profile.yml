---
# Example playbook for paloaltonetworks.scm.scm_decryption_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_decryption_profile.yml
#

- name: Manage decryption_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create decryption_profile
      paloaltonetworks.scm.scm_decryption_profile:
        state: present
        name: "ansible-test-decrypt"
        folder: "Prisma Access"
        ssl_forward_proxy: {}
      register: create_result

    - name: Show created decryption_profile
      ansible.builtin.debug:
        var: create_result.decryption_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update decryption_profile
      paloaltonetworks.scm.scm_decryption_profile:
        state: present
        name: "ansible-test-decrypt"
        folder: "Prisma Access"
        ssl_forward_proxy: {}
        ssl_inbound_proxy: {}
      register: update_result

    - name: Show updated decryption_profile
      ansible.builtin.debug:
        var: update_result.decryption_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get decryption_profile by name
      paloaltonetworks.scm.scm_decryption_profile:
        state: gathered
        name: "ansible-test-decrypt"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered decryption_profile
      ansible.builtin.debug:
        var: gathered_result.decryption_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get decryption_profile by name (info module)
      paloaltonetworks.scm.scm_decryption_profile_info:
        name: "ansible-test-decrypt"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.decryption_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get decryption_profile by ID (info module)
      paloaltonetworks.scm.scm_decryption_profile_info:
        id: "{{ gathered_result.decryption_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.decryption_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all decryption_profiles
      paloaltonetworks.scm.scm_decryption_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show decryption_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} decryption_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete decryption_profile
      paloaltonetworks.scm.scm_decryption_profile:
        state: absent
        name: "ansible-test-decrypt"
        folder: "Prisma Access"
