---
# Example playbook for paloaltonetworks.scm.scm_decryption_profile
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_decryption_profile.yml

- name: Manage decryption_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a decryption_profile object
      paloaltonetworks.scm.scm_decryption_profile:
        state: present
        name: "example-decryption_profile"
        folder: "Shared"
      register: create_result

    - name: Display created decryption_profile
      ansible.builtin.debug:
        var: create_result.decryption_profile

    - name: Gather information about a decryption_profile object
      paloaltonetworks.scm.scm_decryption_profile:
        state: gathered
        name: "example-decryption_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered decryption_profile
      ansible.builtin.debug:
        var: gather_result.decryption_profile

    - name: List all decryption_profiles in a folder
      paloaltonetworks.scm.scm_decryption_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display decryption_profiles list
      ansible.builtin.debug:
        var: list_result.decryption_profiles


    - name: Delete the decryption_profile object
      paloaltonetworks.scm.scm_decryption_profile:
        state: absent
        name: "example-decryption_profile"
        folder: "Shared"

