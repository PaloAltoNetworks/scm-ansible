---
# Example playbook for paloaltonetworks.scm.scm_application_override_rule
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_application_override_rule.yml

- name: Manage application_override_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a application_override_rule object
      paloaltonetworks.scm.scm_application_override_rule:
        state: present
        name: "example-application_override_rule"
        folder: "Shared"
      register: create_result

    - name: Display created application_override_rule
      ansible.builtin.debug:
        var: create_result.application_override_rule

    - name: Gather information about a application_override_rule object
      paloaltonetworks.scm.scm_application_override_rule:
        state: gathered
        name: "example-application_override_rule"
        folder: "Shared"
      register: gather_result

    - name: Display gathered application_override_rule
      ansible.builtin.debug:
        var: gather_result.application_override_rule

    - name: List all application_override_rules in a folder
      paloaltonetworks.scm.scm_application_override_rule_info:
        folder: "Shared"
      register: list_result

    - name: Display application_override_rules list
      ansible.builtin.debug:
        var: list_result.application_override_rules


    - name: Delete the application_override_rule object
      paloaltonetworks.scm.scm_application_override_rule:
        state: absent
        name: "example-application_override_rule"
        folder: "Shared"

