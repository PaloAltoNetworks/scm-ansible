---
# Example playbook for paloaltonetworks.scm.scm_application_override_rule
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_application_override_rule.yml
#

- name: Manage application_override_rules in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create application_override_rule
      paloaltonetworks.scm.scm_application_override_rule:
        state: present
        name: "ansible-test-app-override"
        folder: "Prisma Access"
        application: "web-browsing"
        destination: ["any"]
        var_from: ["any"]
        port: "8080"
        protocol: "tcp"
        source: ["any"]
        to: ["any"]
      register: create_result

    - name: Show created application_override_rule
      ansible.builtin.debug:
        var: create_result.application_override_rule

    # ── Update ──────────────────────────────────────────────
    - name: Update application_override_rule
      paloaltonetworks.scm.scm_application_override_rule:
        state: present
        name: "ansible-test-app-override"
        folder: "Prisma Access"
        application: "web-browsing"
        destination: ["any"]
        var_from: ["any"]
        port: "8080"
        protocol: "tcp"
        source: ["any"]
        to: ["any"]
      register: update_result

    - name: Show updated application_override_rule
      ansible.builtin.debug:
        var: update_result.application_override_rule

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get application_override_rule by name
      paloaltonetworks.scm.scm_application_override_rule:
        state: gathered
        name: "ansible-test-app-override"
        folder: "Prisma Access"
      register: gathered_result

    - name: Show gathered application_override_rule
      ansible.builtin.debug:
        var: gathered_result.application_override_rule

    # ── Get by name (info module) ───────────────────────────
    - name: Get application_override_rule by name (info module)
      paloaltonetworks.scm.scm_application_override_rule_info:
        name: "ansible-test-app-override"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.application_override_rules

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get application_override_rule by ID (info module)
      paloaltonetworks.scm.scm_application_override_rule_info:
        id: "{{ gathered_result.application_override_rule.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.application_override_rules

    # ── List all ────────────────────────────────────────────
    - name: List all application_override_rules
      paloaltonetworks.scm.scm_application_override_rule_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show application_override_rules count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} application_override_rules"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete application_override_rule
      paloaltonetworks.scm.scm_application_override_rule:
        state: absent
        name: "ansible-test-app-override"
        folder: "Prisma Access"

