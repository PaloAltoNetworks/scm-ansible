---
# Example playbook for paloaltonetworks.scm.scm_sdwan_error_correction_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_sdwan_error_correction_profile.yml
#

- name: Manage sdwan_error_correction_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create sdwan_error_correction_profile
      paloaltonetworks.scm.scm_sdwan_error_correction_profile:
        state: present
        name: "ansible-test-sdwan_error_correction_profile"
        folder: "All"
        activation_threshold: 2
        mode:
          forward_error_correction:
            ratio: "10% (20:2)"
            recovery_duration: 1000
      register: create_result

    - name: Show created sdwan_error_correction_profile
      ansible.builtin.debug:
        var: create_result.sdwan_error_correction_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update sdwan_error_correction_profile
      paloaltonetworks.scm.scm_sdwan_error_correction_profile:
        state: present
        name: "ansible-test-sdwan_error_correction_profile"
        description: "Updated by Ansible"
        folder: "All"
        activation_threshold: 2
        mode:
          forward_error_correction:
            ratio: "10% (20:2)"
            recovery_duration: 1000
      register: update_result

    - name: Show updated sdwan_error_correction_profile
      ansible.builtin.debug:
        var: update_result.sdwan_error_correction_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get sdwan_error_correction_profile by name
      paloaltonetworks.scm.scm_sdwan_error_correction_profile:
        state: gathered
        name: "ansible-test-sdwan_error_correction_profile"
        folder: "All"
      register: gathered_result

    - name: Show gathered sdwan_error_correction_profile
      ansible.builtin.debug:
        var: gathered_result.sdwan_error_correction_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get sdwan_error_correction_profile by name (info module)
      paloaltonetworks.scm.scm_sdwan_error_correction_profile_info:
        name: "ansible-test-sdwan_error_correction_profile"
        folder: "All"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.sdwan_error_correction_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get sdwan_error_correction_profile by ID (info module)
      paloaltonetworks.scm.scm_sdwan_error_correction_profile_info:
        id: "{{ gathered_result.sdwan_error_correction_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.sdwan_error_correction_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all sdwan_error_correction_profiles
      paloaltonetworks.scm.scm_sdwan_error_correction_profile_info:
        folder: "All"
      register: list_result

    - name: Show sdwan_error_correction_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} sdwan_error_correction_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete sdwan_error_correction_profile
      paloaltonetworks.scm.scm_sdwan_error_correction_profile:
        state: absent
        name: "ansible-test-sdwan_error_correction_profile"
        folder: "All"

