---
# Example playbook for paloaltonetworks.scm.scm_log_forwarding_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_log_forwarding_profile.yml
#

- name: Manage log_forwarding_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create log_forwarding_profile
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: present
        name: "ansible-test-logfwd"
        folder: "Prisma Access"
        description: "Created by Ansible"
        match_list:
          - name: "profile-match"
            log_type: "auth"
            filter: "All Logs"
      register: create_result

    - name: Show created log_forwarding_profile
      ansible.builtin.debug:
        var: create_result.log_forwarding_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update log_forwarding_profile
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: present
        name: "ansible-test-logfwd"
        folder: "Prisma Access"
        description: "Updated by Ansible"
        match_list:
          - name: "profile-match"
            log_type: "auth"
            filter: "All Logs"
            send_to_panorama: true
      register: update_result

    - name: Show updated log_forwarding_profile
      ansible.builtin.debug:
        var: update_result.log_forwarding_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get log_forwarding_profile by name
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: gathered
        name: "ansible-test-logfwd"
        folder: "Prisma Access"
        match_list: []
      register: gathered_result

    - name: Show gathered log_forwarding_profile
      ansible.builtin.debug:
        var: gathered_result.log_forwarding_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get log_forwarding_profile by name (info module)
      paloaltonetworks.scm.scm_log_forwarding_profile_info:
        name: "ansible-test-logfwd"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.log_forwarding_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get log_forwarding_profile by ID (info module)
      paloaltonetworks.scm.scm_log_forwarding_profile_info:
        id: "{{ gathered_result.log_forwarding_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.log_forwarding_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all log_forwarding_profiles
      paloaltonetworks.scm.scm_log_forwarding_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show log_forwarding_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} log_forwarding_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete log_forwarding_profile
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: absent
        name: "ansible-test-logfwd"
        folder: "Prisma Access"
        match_list: []
