---
# Example playbook for paloaltonetworks.scm.scm_log_forwarding_profile
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_log_forwarding_profile.yml

- name: Manage log_forwarding_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a log_forwarding_profile object
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: present
        name: "example-log_forwarding_profile"
        folder: "Shared"
      register: create_result

    - name: Display created log_forwarding_profile
      ansible.builtin.debug:
        var: create_result.log_forwarding_profile

    - name: Gather information about a log_forwarding_profile object
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: gathered
        name: "example-log_forwarding_profile"
        folder: "Shared"
      register: gather_result

    - name: Display gathered log_forwarding_profile
      ansible.builtin.debug:
        var: gather_result.log_forwarding_profile

    - name: List all log_forwarding_profiles in a folder
      paloaltonetworks.scm.scm_log_forwarding_profile_info:
        folder: "Shared"
      register: list_result

    - name: Display log_forwarding_profiles list
      ansible.builtin.debug:
        var: list_result.log_forwarding_profiles


    - name: Delete the log_forwarding_profile object
      paloaltonetworks.scm.scm_log_forwarding_profile:
        state: absent
        name: "example-log_forwarding_profile"
        folder: "Shared"

