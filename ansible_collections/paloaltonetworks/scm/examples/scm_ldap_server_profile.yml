---
# Example playbook for paloaltonetworks.scm.scm_ldap_server_profile
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_ldap_server_profile.yml
#

- name: Manage ldap_server_profiles in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create ldap_server_profile
      paloaltonetworks.scm.scm_ldap_server_profile:
        state: present
        name: "ansible-test-ldap-prof"
        folder: "Prisma Access"
        server:
        - name: "ldap-svr-1"
          address: "10.0.1.100"
          port: 389
        ldap_type: "active-directory"
        base: "dc=example,dc=com"
        bind_dn: "cn=admin,dc=example,dc=com"
        ssl: false
      register: create_result

    - name: Show created ldap_server_profile
      ansible.builtin.debug:
        var: create_result.ldap_server_profile

    # ── Update ──────────────────────────────────────────────
    - name: Update ldap_server_profile
      paloaltonetworks.scm.scm_ldap_server_profile:
        state: present
        name: "ansible-test-ldap-prof"
        folder: "Prisma Access"
        server:
        - name: "ldap-svr-1"
          address: "10.0.1.100"
          port: 389
        - name: "ldap-svr-2"
          address: "10.0.1.101"
          port: 389
        ldap_type: "active-directory"
        base: "dc=example,dc=com"
        bind_dn: "cn=admin,dc=example,dc=com"
        ssl: false
        timelimit: 30
      register: update_result

    - name: Show updated ldap_server_profile
      ansible.builtin.debug:
        var: update_result.ldap_server_profile

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get ldap_server_profile by name
      paloaltonetworks.scm.scm_ldap_server_profile:
        state: gathered
        name: "ansible-test-ldap-prof"
        folder: "Prisma Access"
        server:
        - name: "ldap-svr-1"
          address: "10.0.1.100"
          port: 389
      register: gathered_result

    - name: Show gathered ldap_server_profile
      ansible.builtin.debug:
        var: gathered_result.ldap_server_profile

    # ── Get by name (info module) ───────────────────────────
    - name: Get ldap_server_profile by name (info module)
      paloaltonetworks.scm.scm_ldap_server_profile_info:
        name: "ansible-test-ldap-prof"
        folder: "Prisma Access"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.ldap_server_profiles

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get ldap_server_profile by ID (info module)
      paloaltonetworks.scm.scm_ldap_server_profile_info:
        id: "{{ gathered_result.ldap_server_profile.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.ldap_server_profiles

    # ── List all ────────────────────────────────────────────
    - name: List all ldap_server_profiles
      paloaltonetworks.scm.scm_ldap_server_profile_info:
        folder: "Prisma Access"
      register: list_result

    - name: Show ldap_server_profiles count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} ldap_server_profiles"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete ldap_server_profile
      paloaltonetworks.scm.scm_ldap_server_profile:
        state: absent
        name: "ansible-test-ldap-prof"
        folder: "Prisma Access"
        server:
        - name: "ldap-svr-1"
          address: "10.0.1.100"
          port: 389
