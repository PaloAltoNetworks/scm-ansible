---
# Example playbook for paloaltonetworks.scm.scm_aggregate_interface
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_aggregate_interface.yml

- name: Manage aggregate_interfaces in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a aggregate_interface object
      paloaltonetworks.scm.scm_aggregate_interface:
        state: present
        name: "example-aggregate_interface"
        folder: "Shared"
      register: create_result

    - name: Display created aggregate_interface
      ansible.builtin.debug:
        var: create_result.aggregate_interface

    - name: Gather information about a aggregate_interface object
      paloaltonetworks.scm.scm_aggregate_interface:
        state: gathered
        name: "example-aggregate_interface"
        folder: "Shared"
      register: gather_result

    - name: Display gathered aggregate_interface
      ansible.builtin.debug:
        var: gather_result.aggregate_interface

    - name: List all aggregate_interfaces in a folder
      paloaltonetworks.scm.scm_aggregate_interface_info:
        folder: "Shared"
      register: list_result

    - name: Display aggregate_interfaces list
      ansible.builtin.debug:
        var: list_result.aggregate_interfaces


    - name: Delete the aggregate_interface object
      paloaltonetworks.scm.scm_aggregate_interface:
        state: absent
        name: "example-aggregate_interface"
        folder: "Shared"

