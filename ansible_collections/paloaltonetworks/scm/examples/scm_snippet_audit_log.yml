---
# Example playbook for paloaltonetworks.scm.scm_snippet_audit_log
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_snippet_audit_log.yml

- name: Manage snippet_audit_logs in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a snippet_audit_log object
      paloaltonetworks.scm.scm_snippet_audit_log:
        state: present
        name: "example-snippet_audit_log"
      register: create_result

    - name: Display created snippet_audit_log
      ansible.builtin.debug:
        var: create_result.snippet_audit_log

    - name: Gather information about a snippet_audit_log object
      paloaltonetworks.scm.scm_snippet_audit_log:
        state: gathered
        name: "example-snippet_audit_log"
      register: gather_result

    - name: Display gathered snippet_audit_log
      ansible.builtin.debug:
        var: gather_result.snippet_audit_log


