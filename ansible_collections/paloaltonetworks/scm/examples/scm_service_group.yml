---
# Example playbook for paloaltonetworks.scm.scm_service_group
#
# Prerequisites:
#   pip install pan-scm-sdk ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_service_group.yml

- name: Manage service_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a service_group object
      paloaltonetworks.scm.scm_service_group:
        state: present
        name: "example-service_group"
        folder: "Shared"
      register: create_result

    - name: Display created service_group
      ansible.builtin.debug:
        var: create_result.service_group

    - name: Gather information about a service_group object
      paloaltonetworks.scm.scm_service_group:
        state: gathered
        name: "example-service_group"
        folder: "Shared"
      register: gather_result

    - name: Display gathered service_group
      ansible.builtin.debug:
        var: gather_result.service_group

    - name: List all service_groups in a folder
      paloaltonetworks.scm.scm_service_group_info:
        folder: "Shared"
      register: list_result

    - name: Display service_groups list
      ansible.builtin.debug:
        var: list_result.service_groups


    - name: Delete the service_group object
      paloaltonetworks.scm.scm_service_group:
        state: absent
        name: "example-service_group"
        folder: "Shared"

