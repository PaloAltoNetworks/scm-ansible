---
# Example playbook for paloaltonetworks.scm.scm_anti_spyware_signature
#
# Demonstrates: create, update, get by ID, list, delete
#
# NOTE: Anti-spyware signatures use 'threatname' and 'threat_id' as identifiers
#       instead of the standard 'name' field. Threat IDs must be in range 6900001-7000000.
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_anti_spyware_signature.yml
#

- name: Manage anti_spyware_signatures in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create anti_spyware_signature
      paloaltonetworks.scm.scm_anti_spyware_signature:
        state: present
        folder: "All"
        threatname: "ansible-test-aspysig"
        threat_id: "6900001"
        severity: "medium"
        direction: "client2server"
        comment: "Created by Ansible"
        signature:
          standard:
            - name: "std-sig-1"
              scope: "protocol-data-unit"
      register: create_result

    - name: Show created anti_spyware_signature
      ansible.builtin.debug:
        var: create_result.anti_spyware_signature

    # ── Update ──────────────────────────────────────────────
    - name: Update anti_spyware_signature
      paloaltonetworks.scm.scm_anti_spyware_signature:
        state: present
        folder: "All"
        threatname: "ansible-test-aspysig"
        threat_id: "6900001"
        severity: "medium"
        direction: "client2server"
        comment: "Updated by Ansible"
        signature:
          standard:
            - name: "std-sig-1"
              scope: "protocol-data-unit"
      register: update_result

    - name: Show updated anti_spyware_signature
      ansible.builtin.debug:
        var: update_result.anti_spyware_signature

    # ── List all ────────────────────────────────────────────
    - name: List all anti_spyware_signatures
      paloaltonetworks.scm.scm_anti_spyware_signature_info:
        folder: "All"
      register: list_result

    - name: Show anti_spyware_signatures count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} anti_spyware_signatures"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete anti_spyware_signature
      paloaltonetworks.scm.scm_anti_spyware_signature:
        state: absent
        folder: "All"
        threatname: "ansible-test-aspysig"
        threat_id: "6900001"
