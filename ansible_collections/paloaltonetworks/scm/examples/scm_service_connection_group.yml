---
# Example playbook for paloaltonetworks.scm.scm_service_connection_group
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_service_connection_group.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_service_connection_group' for full parameter docs.

- name: Manage service_connection_groups in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create service_connection_group
      paloaltonetworks.scm.scm_service_connection_group:
        state: present
        name: "ansible-test-service_connection_group"
        # target: <required>
      register: create_result

    - name: Show created service_connection_group
      ansible.builtin.debug:
        var: create_result.service_connection_group

    # ── Update ──────────────────────────────────────────────
    - name: Update service_connection_group
      paloaltonetworks.scm.scm_service_connection_group:
        state: present
        name: "ansible-test-service_connection_group"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated service_connection_group
      ansible.builtin.debug:
        var: update_result.service_connection_group

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get service_connection_group by name
      paloaltonetworks.scm.scm_service_connection_group:
        state: gathered
        name: "ansible-test-service_connection_group"
      register: gathered_result

    - name: Show gathered service_connection_group
      ansible.builtin.debug:
        var: gathered_result.service_connection_group

    # ── Get by name (info module) ───────────────────────────
    - name: Get service_connection_group by name (info module)
      paloaltonetworks.scm.scm_service_connection_group_info:
        name: "ansible-test-service_connection_group"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.service_connection_groups

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get service_connection_group by ID (info module)
      paloaltonetworks.scm.scm_service_connection_group_info:
        id: "{{ gathered_result.service_connection_group.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.service_connection_groups

    # ── List all ────────────────────────────────────────────
    - name: List all service_connection_groups
      paloaltonetworks.scm.scm_service_connection_group_info:
      register: list_result

    - name: Show service_connection_groups count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} service_connection_groups"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete service_connection_group
      paloaltonetworks.scm.scm_service_connection_group:
        state: absent
        name: "ansible-test-service_connection_group"

