---
# Example playbook for paloaltonetworks.scm.scm_trust
#
# Demonstrates: create, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_trust.yml
#
# NOTE: You may need to add required fields to the create/update tasks below.
#       Run 'ansible-doc paloaltonetworks.scm.scm_trust' for full parameter docs.

- name: Manage trusts in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create trust
      paloaltonetworks.scm.scm_trust:
        state: present
        name: "ansible-test-trust"
      register: create_result

    - name: Show created trust
      ansible.builtin.debug:
        var: create_result.trust

    # ── Delete ──────────────────────────────────────────────
    - name: Delete trust
      paloaltonetworks.scm.scm_trust:
        state: absent
        name: "ansible-test-trust"

