---
# Example playbook for paloaltonetworks.scm.scm_snippet
#
# Demonstrates: create, update, get by name, get by ID, list, delete
#
# Prerequisites:
#   pip install scm-python ansible-core
#
# Authentication (pick one):
#   export SCM_CONFIG_FILE="/path/to/config/scm-config.json"
#   -- or --
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ANSIBLE_COLLECTIONS_PATH=. ansible-playbook examples/scm_snippet.yml
#

- name: Manage snippets in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Create ──────────────────────────────────────────────
    - name: Create snippet
      paloaltonetworks.scm.scm_snippet:
        state: present
        name: "ansible-test-snippet"
        description: "Test snippet"
      register: create_result

    - name: Show created snippet
      ansible.builtin.debug:
        var: create_result.snippet

    # ── Update ──────────────────────────────────────────────
    - name: Update snippet
      paloaltonetworks.scm.scm_snippet:
        state: present
        name: "ansible-test-snippet"
        description: "Updated by Ansible"
      register: update_result

    - name: Show updated snippet
      ansible.builtin.debug:
        var: update_result.snippet

    # ── Get by name (CRUD module, state=gathered) ───────────
    - name: Get snippet by name
      paloaltonetworks.scm.scm_snippet:
        state: gathered
        name: "ansible-test-snippet"
      register: gathered_result

    - name: Show gathered snippet
      ansible.builtin.debug:
        var: gathered_result.snippet

    # ── Get by name (info module) ───────────────────────────
    - name: Get snippet by name (info module)
      paloaltonetworks.scm.scm_snippet_info:
        name: "ansible-test-snippet"
      register: info_by_name

    - name: Show info result
      ansible.builtin.debug:
        var: info_by_name.snippets

    # ── Get by ID (info module) ─────────────────────────────
    - name: Get snippet by ID (info module)
      paloaltonetworks.scm.scm_snippet_info:
        id: "{{ gathered_result.snippet.id }}"
      register: info_by_id

    - name: Show info-by-ID result
      ansible.builtin.debug:
        var: info_by_id.snippets

    # ── List all ────────────────────────────────────────────
    - name: List all snippets
      paloaltonetworks.scm.scm_snippet_info:
      register: list_result

    - name: Show snippets count
      ansible.builtin.debug:
        msg: "Found {{ list_result.total }} snippets"

    # ── Delete ──────────────────────────────────────────────
    - name: Delete snippet
      paloaltonetworks.scm.scm_snippet:
        state: absent
        name: "ansible-test-snippet"

