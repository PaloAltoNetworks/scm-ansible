---
# Example playbook for paloaltonetworks.scm.scm_application_filter
#
# Prerequisites:
#   pip install scm-python ansible-core
#   export SCM_CLIENT_ID="your-client-id"
#   export SCM_CLIENT_SECRET="your-client-secret"
#   export SCM_TSG_ID="your-tsg-id"
#
# Usage:
#   ansible-playbook examples/scm_application_filter.yml

- name: Manage application_filters in Strata Cloud Manager
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create a application_filter object
      paloaltonetworks.scm.scm_application_filter:
        state: present
        name: "example-application_filter"
        folder: "Shared"
      register: create_result

    - name: Display created application_filter
      ansible.builtin.debug:
        var: create_result.application_filter

    - name: Gather information about a application_filter object
      paloaltonetworks.scm.scm_application_filter:
        state: gathered
        name: "example-application_filter"
        folder: "Shared"
      register: gather_result

    - name: Display gathered application_filter
      ansible.builtin.debug:
        var: gather_result.application_filter

    - name: List all application_filters in a folder
      paloaltonetworks.scm.scm_application_filter_info:
        folder: "Shared"
      register: list_result

    - name: Display application_filters list
      ansible.builtin.debug:
        var: list_result.application_filters


    - name: Delete the application_filter object
      paloaltonetworks.scm.scm_application_filter:
        state: absent
        name: "example-application_filter"
        folder: "Shared"

