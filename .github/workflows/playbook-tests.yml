name: Playbook Tests (Full)

# Full playbook integration tests - manual trigger for pre-merge validation
# Takes ~100-120 minutes due to Ansible per-playbook overhead
# See docs/CI_CD_STRATEGY.md for rationale

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running full playbook tests'
        required: false
        default: 'Pre-merge validation'

jobs:
  test:
    name: Full Playbook Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/PaloAltoNetworks/scm-python@develop ansible-core

      - name: Create SCM config file from secrets
        run: |
          mkdir -p config
          cat > config/scm-config.json << EOF
          {
            "auth_url": "${{ secrets.SCM_AUTH_URL }}",
            "client_id": "${{ secrets.SCM_CLIENT_ID }}",
            "client_secret": "${{ secrets.SCM_CLIENT_SECRET }}",
            "host": "${{ secrets.SCM_HOST }}",
            "protocol": "${{ secrets.SCM_PROTOCOL }}",
            "scope": "${{ secrets.SCM_SCOPE }}",
            "logging": "quiet",
            "skip_verify_certificate": ${{ secrets.SCM_SKIP_VERIFY_CERTIFICATE }}
          }
          EOF

      - name: Run example playbooks
        env:
          SCM_CONFIG_FILE: ${{ github.workspace }}/config/scm-config.json
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          set +e

          COLLECTION_DIR="${{ github.workspace }}/ansible_collections/paloaltonetworks/scm"
          cd "$COLLECTION_DIR"

          # Playbooks to skip due to API/model issues (matching skipped integration tests)
          SKIP_PLAYBOOKS=(
            "scm_authentication_portal"              # singleton - existing portal blocks creation
            "scm_auto_tag_action"                    # filter syntax validation is tenant-specific
            "scm_bandwidth_allocation"               # requires SPN and bandwidth infrastructure
            "scm_dos_protection_rule"                # API requires from/to as objects - model mismatch
            "scm_folder"                             # API returns 500 Internal Server Error
            "scm_mfa_server"                         # requires MFA vendor and cert configuration
            "scm_quarantined_device"                 # requires quarantined device infrastructure
            "scm_route_access_list"                  # requires valid IPv4/IPv6 access-list entries
            "scm_route_prefix_list"                  # requires valid IPv4/IPv6 prefix-list entries
            "scm_sdwan_rule"                         # requires position parameter and complex SDWAN setup
            "scm_sdwan_traffic_distribution_profile" # requires link-tags not available in Prisma Access
            "scm_vulnerability_protection_signature" # no test file - API issues
          )

          # Dynamically discover all playbooks from examples directory
          PLAYBOOKS=()
          for pb_file in playbooks/scm_*.yml; do
            [ -f "$pb_file" ] || continue
            pb_name=$(basename "$pb_file" .yml)
            PLAYBOOKS+=("$pb_name")
          done

          echo "Discovered ${#PLAYBOOKS[@]} playbooks"

          pass=0
          skip=0
          fail=0
          results=()

          echo "=========================================="
          echo " Full Playbook Tests"
          echo " Trigger: ${{ github.event.inputs.reason || 'Push to main' }}"
          echo "=========================================="
          echo ""

          # Store error details for summary
          declare -A error_details

          # Helper function to check if playbook should be skipped
          should_skip() {
            local pb="$1"
            for skip_pb in "${SKIP_PLAYBOOKS[@]}"; do
              if [ "$pb" = "$skip_pb" ]; then
                return 0
              fi
            done
            return 1
          }

          for pb in "${PLAYBOOKS[@]}"; do
            # Check if this playbook should be skipped
            if should_skip "$pb"; then
              echo "${pb} :: SKIP (known issue)"
              results+=("SKIP|${pb}")
              ((skip++))
              continue
            fi

            output=$(ansible-playbook "playbooks/${pb}.yml" 2>&1)
            exit_code=$?

            # PASS if exit code 0 and PLAY RECAP shows no failures
            if [ $exit_code -eq 0 ] && echo "$output" | grep -qE "^PLAY RECAP" && ! echo "$output" | grep -qE "failed=[1-9]"; then
              echo "${pb} :: PASS"
              results+=("PASS|${pb}")
              ((pass++))
            else
              echo "${pb} :: FAIL"
              # Print the last error line for quick diagnosis
              error_lines=$(echo "$output" | grep -E "fatal:|ERROR|failed=|msg:" | tail -10)
              echo "$error_lines" | sed 's/^/  /'
              # Store error for summary (escape for markdown)
              error_details["${pb}"]="$error_lines"
              results+=("FAIL|${pb}")
              ((fail++))
            fi
          done

          echo ""
          echo "=========================================="
          echo "SUMMARY: ${pass} PASS, ${fail} FAIL, ${skip} SKIP"
          echo "=========================================="

          # Write GitHub step summary
          {
            echo "## Full Playbook Test Results"
            echo ""
            echo "**Trigger:** ${{ github.event.inputs.reason || 'Push to main' }}"
            echo ""
            echo "| Playbook | Result |"
            echo "|----------|--------|"
            for r in "${results[@]}"; do
              status="${r%%|*}"
              name="${r##*|}"
              if [ "$status" = "PASS" ]; then
                echo "| \`${name}\` | ✅ PASS |"
              elif [ "$status" = "SKIP" ]; then
                echo "| \`${name}\` | ⏭️ SKIP |"
              else
                echo "| \`${name}\` | ❌ FAIL |"
              fi
            done
            echo ""
            echo "**Total: ${pass} passed, ${fail} failed, ${skip} skipped**"
            echo ""

            # Add error details section for failed playbooks
            if [ $fail -gt 0 ]; then
              echo "## Error Details"
              echo ""
              for r in "${results[@]}"; do
                status="${r%%|*}"
                name="${r##*|}"
                if [ "$status" = "FAIL" ]; then
                  echo "### \`${name}\`"
                  echo ""
                  echo "\`\`\`"
                  # Output stored error details
                  if [ -n "${error_details[$name]}" ]; then
                    echo "${error_details[$name]}"
                  else
                    echo "No error details captured"
                  fi
                  echo "\`\`\`"
                  echo ""
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if any playbook failed
          if [ $fail -gt 0 ]; then
            echo "::error::${fail} playbook(s) failed"
            exit 1
          fi
        timeout-minutes: 150
