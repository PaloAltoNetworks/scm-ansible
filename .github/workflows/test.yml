name: Run Example Playbooks

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Test Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scm-python ansible-core

      - name: Create SCM config file from secrets
        run: |
          mkdir -p config
          cat > config/scm-config.json << EOF
          {
            "auth_url": "${{ secrets.SCM_AUTH_URL }}",
            "client_id": "${{ secrets.SCM_CLIENT_ID }}",
            "client_secret": "${{ secrets.SCM_CLIENT_SECRET }}",
            "host": "${{ secrets.SCM_HOST }}",
            "protocol": "${{ secrets.SCM_PROTOCOL }}",
            "scope": "${{ secrets.SCM_SCOPE }}",
            "logging": "quiet",
            "skip_verify_certificate": ${{ secrets.SCM_SKIP_VERIFY_CERTIFICATE }}
          }
          EOF

      - name: Run example playbooks
        env:
          SCM_CONFIG_FILE: ${{ github.workspace }}/config/scm-config.json
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          set +e

          COLLECTION_DIR="${{ github.workspace }}/ansible_collections/paloaltonetworks/scm"
          cd "$COLLECTION_DIR"

          PLAYBOOKS=(
            scm_address
            scm_address_group
            scm_aggregate_interface
            scm_anti_spyware_profile
            scm_anti_spyware_signature
            scm_application
            scm_application_filter
            scm_application_group
            scm_application_override_rule
            scm_authentication_portal
            scm_authentication_profile
            scm_authentication_rule
            scm_authentication_sequence
            scm_authentication_setting
            scm_auto_tag_action
            scm_auto_vpn_cluster
            scm_auto_vpn_config_push
            scm_bgp_address_family_profile
            scm_bgp_authentication_profile
            scm_bgp_filtering_profile
            scm_bgp_redistribution_profile
            scm_bgp_route_map
            scm_bgp_route_map_redistribution
            scm_certificate
            scm_certificate_profile
            scm_content_id_setting
            scm_decryption_exclusion
            scm_decryption_profile
            scm_decryption_rule
            scm_device_redistribution_collector_setting
            scm_dhcp_interface
            scm_dns_proxy
            scm_dns_security_profile
            scm_dos_protection_profile
            scm_dynamic_user_group
            scm_ethernet_interface
            scm_external_dynamic_list
            scm_file_blocking_profile
            scm_general_setting
            scm_hip_object
            scm_hip_profile
            scm_http_header_profile
            scm_http_server_profile
            scm_ike_crypto_profile
            scm_ike_gateway
            scm_interface_management_profile
            scm_internal_dns_server
            scm_ipsec_crypto_profile
            scm_ipsec_tunnel
            scm_kerberos_server_profile
            scm_label
            scm_layer2_subinterface
            scm_layer3_subinterface
            scm_ldap_server_profile
            scm_link_tag
            scm_lldp_profile
            scm_local_user
            scm_local_user_group
            scm_log_forwarding_profile
            scm_logical_router
            scm_login_banner_setting
            scm_loopback_interface
            scm_management_interface_setting
            scm_mfa_server
            scm_nat_rule
            scm_ocsp_responder
            scm_ospf_authentication_profile
            scm_pbf_rule
            scm_profile_group
            scm_qos_profile
            scm_qos_rule
            scm_quarantined_device
            scm_radius_server_profile
            scm_region
            scm_route_community_list
            scm_route_path_access_list
            scm_saml_server_profile
            scm_schedule
            scm_scep_profile
            scm_sdwan_error_correction_profile
            scm_sdwan_path_quality_profile
            scm_sdwan_saas_quality_profile
            scm_security_rule
            scm_security_zone
            scm_service
            scm_service_group
            scm_service_route_setting
            scm_service_setting
            scm_session_setting
            scm_session_timeouts_setting
            scm_snippet
            scm_syslog_server_profile
            scm_tacacs_server_profile
            scm_tag
            scm_tcp_setting
            scm_tls_service_profile
            scm_traffic_steering_rule
            scm_tunnel_interface
            scm_update_schedule_setting
            scm_url_access_profile
            scm_url_category
            scm_variable
            scm_vlan_interface
            scm_vpn_setting
            scm_vulnerability_protection_profile
            scm_vulnerability_protection_signature
            scm_wildfire_anti_virus_profile
            scm_zone_protection_profile
          )

          pass=0
          fail=0
          results=()

          for pb in "${PLAYBOOKS[@]}"; do
            output=$(ansible-playbook "examples/${pb}.yml" 2>&1)
            exit_code=$?

            # PASS if exit code 0 and PLAY RECAP shows no failures
            if [ $exit_code -eq 0 ] && echo "$output" | grep -qE "^PLAY RECAP" && ! echo "$output" | grep -qE "failed=[1-9]"; then
              echo "${pb} :: PASS"
              results+=("PASS|${pb}")
              ((pass++))
            else
              echo "${pb} :: FAIL"
              # Print the last error line for quick diagnosis
              echo "$output" | grep -E "fatal:|ERROR|failed=" | tail -3 | sed 's/^/  /'
              results+=("FAIL|${pb}")
              ((fail++))
            fi
          done

          echo ""
          echo "=================================="
          echo "SUMMARY: ${pass} PASS, ${fail} FAIL"
          echo "=================================="

          # Write GitHub step summary
          {
            echo "## Ansible Playbook Test Results"
            echo ""
            echo "| Playbook | Result |"
            echo "|----------|--------|"
            for r in "${results[@]}"; do
              status="${r%%|*}"
              name="${r##*|}"
              if [ "$status" = "PASS" ]; then
                echo "| \`${name}\` | ✅ PASS |"
              else
                echo "| \`${name}\` | ❌ FAIL |"
              fi
            done
            echo ""
            echo "**Total: ${pass} passed, ${fail} failed**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if any regression (previously-passing test now fails)
          if [ $fail -gt 0 ]; then
            echo "::error::${fail} playbook(s) failed"
            exit 1
          fi
        timeout-minutes: 90
